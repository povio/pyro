[package]
name = "lp-cdp"
description = "Chrome DevTools Protocol server and domains (worker 3)."
version.workspace = true
edition.workspace = true
license.workspace = true
# One integration test binary (tests/integration.rs) instead of one per file.
autotests = false
rust-version.workspace = true

[features]
# Stage timers for CDP handling, read with LP.perfStats (see lp-cdp-protocol/src/perf.rs).
perf-trace = ["lp-cdp-protocol/perf-trace"]
# Page.captureScreenshot and the LP.run matchScreenshot step (lp-render: Blitz).
render = ["dep:lp-render"]

[dependencies]
lp-browser.workspace = true
lp-js.workspace = true
lp-runtime.workspace = true
lp-net.workspace = true
lp-webapi.workspace = true
lp-dom.workspace = true
lp-cdp-protocol.workspace = true
lp-render = { workspace = true, optional = true }
bytes = "1"
http = "1"
regress = "0.12"
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
libc = "0.2"
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

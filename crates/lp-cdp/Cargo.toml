[package]
name = "lp-cdp"
description = "Chrome DevTools Protocol server and domains (worker 3)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lp-browser.workspace = true
lp-js.workspace = true
lp-runtime.workspace = true
lp-net.workspace = true
lp-webapi.workspace = true
lp-dom.workspace = true
bytes = "1"
http = "1"
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[lints]
workspace = true

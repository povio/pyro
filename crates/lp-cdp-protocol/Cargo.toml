[package]
name = "lp-cdp-protocol"
description = "CDP wire protocol for lp-cdp: WebSocket/HTTP server, messages, Target domain and engine-independent domain helpers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Stage timers for CDP handling, read with LP.perfStats (see src/perf.rs).
perf-trace = []

[dependencies]
lp-net.workspace = true
bytes = "1"
http = "1"
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[lints]
workspace = true

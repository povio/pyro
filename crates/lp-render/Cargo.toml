[package]
name = "lp-render"
description = "Page snapshot to pixels with Blitz (Stylo + Taffy + Parley, painted by Vello), plus screenshot comparison."
version.workspace = true
edition.workspace = true
license.workspace = true
# One integration test binary (tests/integration.rs): each test executable links
# the whole renderer, so one per file made `cargo test` mostly link time.
autotests = false

[features]
# GPU raster (vello on wgpu/Metal). Off: the CPU backend (vello_cpu) is the
# default and the deterministic one.
gpu = ["dep:anyrender_vello"]

[dependencies]
data-url = "0.3"
roxmltree = "0.20"
app_units = "0.7"
rustc-hash = "2"
style = { package = "stylo", version = "0.23.0" }
style_dom = { version = "0.23.0", package = "stylo_dom" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
url = "2"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "woff", "svg", "floats", "writing-mode"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
# By-value getters for `Copy` computed values (Stylo 0.23 names the others `slow_clone_*`).
stylo_taffy = { version = "=0.3.0-beta.4", default-features = false }
anyrender = "0.14.0"
lp-canvas = { workspace = true }
# Without `multithreading`: vello_cpu then rasters on the calling thread. With it, each
# renderer (one per capture size) spawned a pool of available_parallelism()-1 threads, and a
# 1280x720 capture cost twice the CPU (10.9 ms against 5.0) for the hand-offs; the pixels are
# the same either way.
anyrender_vello_cpu = "0.18.0"
anyrender_vello = { version = "0.15.0", optional = true }
peniko = "0.6.0"
kurbo = "0.13.1"
parley = { version = "0.12", default-features = false, features = ["std"] }
# blitz-dom decodes images with `image` but enables no format.
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
png = "0.18"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
skrifa = "0.42"
jpeg-encoder = "0.7.1"

[dev-dependencies]
# Trees for the mirror tests come from lp-dom (lp-render itself does not depend on it).
lp-dom = { workspace = true }
# Inflates PDF streams in the PDF tests.
miniz_oxide = "0.8"

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

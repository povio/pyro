[package]
name = "lp-render"
description = "Page snapshot to pixels with Blitz (Stylo + Taffy + Parley, painted by Vello), plus screenshot comparison."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# GPU raster (vello on wgpu/Metal). Off: the CPU backend (vello_cpu) is the
# default and the deterministic one.
gpu = ["dep:anyrender_vello"]

[dependencies]
roxmltree = "0.20"
app_units = "0.7"
rustc-hash = "2"
style = { package = "stylo", version = "0.22.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "woff", "svg", "floats"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
anyrender = "0.14.0"
anyrender_vello_cpu = { version = "0.18.0", features = ["multithreading"] }
anyrender_vello = { version = "0.15.0", optional = true }
peniko = "0.6.0"
kurbo = "0.13.1"
parley = { version = "0.12", default-features = false, features = ["std"] }
# blitz-dom decodes images with `image` but enables no format.
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
png = "0.18"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
skrifa = "0.42"

[dev-dependencies]
# Trees for the mirror tests come from lp-dom (lp-render itself does not depend on it).
lp-dom = { workspace = true }

[lints]
workspace = true

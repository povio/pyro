[package]
name = "lightningpanda"
description = "Headless browser for automation, a Rust + JavaScriptCore rewrite of Lightpanda."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lightningpanda"
path = "src/main.rs"

[features]
default = ["render", "av1", "h264"]
# CDP stage timers (LP.perfStats); for profiling builds only.
perf-trace = ["lp-cdp/perf-trace"]
# Blitz (lp-render): layout geometry, screenshots and PDFs. Without it
# nothing is laid out.
render = ["lp-cdp/render", "dep:lp-render"]
# Video decoders for <video> frames, drawImage(video) and
# requestVideoFrameCallback (lp-media); canPlayType follows them. AV1 is
# rav1d (pure Rust). H.264 is OpenH264 built from source (a C++ compiler at
# build time; see docs/webapi/MEDIA.md for its patent note).
av1 = ["lp-media/av1"]
h264 = ["lp-media/h264"]

[dependencies]
lp-js.workspace = true
lp-runtime.workspace = true
lp-browser.workspace = true
lp-net.workspace = true
lp-cdp.workspace = true
lp-render = { workspace = true, optional = true }
# Only for the codec features above.
lp-media.workspace = true
mimalloc = { version = "0.1.52", default-features = false }
# Only for the `lp_pgo_training` signal handler (scripts/pgo).
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

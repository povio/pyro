[package]
name = "lightningpanda"
description = "Headless browser for automation, a Rust + JavaScriptCore rewrite of Lightpanda."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lightningpanda"
path = "src/main.rs"

[features]
default = ["render"]
# CDP stage timers (LP.perfStats); for profiling builds only.
perf-trace = ["lp-cdp/perf-trace"]
# Blitz (lp-render): layout geometry, screenshots and PDFs. Without it
# nothing is laid out.
render = ["lp-cdp/render", "dep:lp-render"]

[dependencies]
lp-js.workspace = true
lp-runtime.workspace = true
lp-browser.workspace = true
lp-net.workspace = true
lp-cdp.workspace = true
lp-render = { workspace = true, optional = true }
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

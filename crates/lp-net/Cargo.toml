[package]
name = "lp-net"
description = "HTTP client, cookies, CORS and fetch primitives for lightningpanda (worker 2)."
version.workspace = true
edition.workspace = true
license.workspace = true
# One integration test binary (tests/integration.rs) instead of one per file.
autotests = false

[dependencies]
base64 = "0.23.1"
brotli-decompressor = "6.1.0"
bytes = "1"
cookie = { version = "0.18", default-features = false, features = ["percent-encode"] }
encoding_rs = "0.8.42"
flate2 = "1.1.10"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1"] }
percent-encoding = "2.3.2"
psl = "2.1.241"
rustc-hash = "2.1.3"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util"] }
url = "2"

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

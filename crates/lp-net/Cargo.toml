[package]
name = "lp-net"
description = "HTTP client, cookies, CORS and fetch primitives for lightningpanda (worker 2)."
version.workspace = true
edition.workspace = true
license.workspace = true
# One integration test binary (tests/integration.rs) instead of one per file.
autotests = false

[dependencies]
base64 = "0.23.1"
brotli-decompressor = "6.1.0"
bytes = "1"
cookie = { version = "0.18", default-features = false, features = ["percent-encode"] }
encoding_rs = "0.8.42"
flate2 = "1.1.10"
# WebSocket masking keys and handshake nonces.
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
httparse = "1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1", "http2"] }
# HTTPS: rustls with ring (pure Rust, no system TLS state) and Mozilla's roots.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
lp-psl.workspace = true
percent-encoding = "2.3.2"
rustc-hash = "2.1.3"
# Sec-WebSocket-Accept.
sha1 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "fs", "macros"] }
tower-service = "0.3"
url = "2"

[dev-dependencies]
h2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

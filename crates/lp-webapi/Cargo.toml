[package]
name = "lp-webapi"
description = "JavaScript bindings for DOM/network WebAPIs over lp-js (worker 2)."
version.workspace = true
edition.workspace = true
license.workspace = true
# One integration test binary (tests/integration.rs) instead of one per file.
autotests = false

[dependencies]
base64 = "0.23.1"
bytes = "1"
cssparser = "0.38"
encoding_rs = "0.8"
getrandom = "0.3"
lp-dom = { workspace = true }
lp-js = { workspace = true }
lp-net = { workspace = true }
markup5ever = "0.40"
percent-encoding = "2.3.2"
rustc-hash = "2"
sha1 = "0.10"
sha2 = "0.10"
url = "2"

[[test]]
name = "integration"
path = "tests/integration.rs"

# Observes GC outcomes (a closed realm must be collected after bounded synchronous GC), so it must not
# share a process with other engines collecting concurrently: its own binary, like lp-js string_allocation.
[[test]]
name = "payload_cycles"
path = "tests/payload_cycles.rs"

[lints]
workspace = true

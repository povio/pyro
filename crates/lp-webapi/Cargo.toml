[package]
name = "lp-webapi"
description = "JavaScript bindings for DOM/network WebAPIs over lp-js (worker 2)."
version.workspace = true
edition.workspace = true
license.workspace = true
# One integration test binary (tests/integration.rs) instead of one per file.
autotests = false

[dependencies]
base64 = "0.23.1"
bytes = "1"
cssparser = "0.38"
encoding_rs = "0.8"
getrandom = "0.3"
lp-dom = { workspace = true }
lp-js = { workspace = true }
lp-net = { workspace = true }
markup5ever = "0.40"
percent-encoding = "2.3.2"
rustc-hash = "2"
sha1 = "0.10"
sha2 = "0.10"
url = "2"

[[test]]
name = "integration"
path = "tests/integration.rs"

# Observes GC outcomes (a closed realm must be collected after bounded synchronous GC). Its own process
# restores the conditions its retention tests were validated under (no other engine collecting alongside),
# like lp-js string_allocation. It does not cure the intermittency of
# formdata_cross_realm_file_does_not_leak_after_both_realms_close, an engine behaviour that also occurs
# without this layout; see the pull request that added this target.
[[test]]
name = "payload_cycles"
path = "tests/payload_cycles.rs"

[dev-dependencies]
# Geometry for the layout tests (Blitz).
lp-layout = { workspace = true }
lp-render = { workspace = true }

[lints]
workspace = true

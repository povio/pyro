[package]
name = "pyro-canvas"
description = "Canvas 2D raster surfaces (vello_cpu), canvas text (Parley), image decode/encode, and the process's system fonts."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# All already in the tree through pyro-render (Blitz/anyrender), with the same
# versions and features: this crate compiles nothing new but itself.
bytemuck = "1"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
kurbo = "0.13.1"
parley = { version = "0.12", default-features = false, features = ["system", "bytemuck"] }
peniko = "0.6.0"
png = "0.18"
skrifa = "0.44"
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "text", "u8_pipeline"] }

[lints]
workspace = true

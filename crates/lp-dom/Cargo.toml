[package]
name = "lp-dom"
description = "Pure-Rust DOM: arena document, html5ever parsing, selectors, events (worker 2)."
version.workspace = true
edition.workspace = true
license.workspace = true
# One integration test binary (tests/integration.rs) instead of one per file.
autotests = false

[dependencies]
cssparser = "0.38"
encoding_rs = "0.8"
html5ever = "0.40"
markup5ever = "0.40"
precomputed-hash = "0.1"
quick-xml = "0.42"
rustc-hash = "2"
selectors = "0.41"

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

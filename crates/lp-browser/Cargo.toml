[package]
name = "lp-browser"
description = "Browser/Session/Page/Frame orchestration, navigation, worlds, window timers."
version.workspace = true
edition.workspace = true
license.workspace = true
# One integration test binary (tests/integration.rs) instead of one per file.
autotests = false

[dependencies]
lp-js.workspace = true
lp-runtime.workspace = true
lp-dom.workspace = true
lp-net.workspace = true
lp-webapi.workspace = true
url = "2"
bytes = "1"
percent-encoding = "2.3.2"
http = "1"
smallvec = "1"

[dev-dependencies]
lp-layout.workspace = true
# Every codec in this crate's tests (tests/media_decoding.rs).
lp-media = { workspace = true, features = ["av1", "h264"] }
lp-render.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

[package]
name = "pyro-net"
description = "HTTP client, cookies, CORS and fetch primitives for pyro (worker 2)."
version.workspace = true
edition.workspace = true
license.workspace = true
# One integration test binary (tests/integration.rs) instead of one per file.
autotests = false

[dependencies]
base64 = "0.23.1"
data-url = "0.3.2"
brotli-decompressor = "6.1.0"
bytes = "1"
encoding_rs = "0.8.42"
# WebSocket permessage-deflate. Keep it on its default backend (miniz_oxide):
# a flate2 feature unifies across the build and would change the bytes of
# every flate2 compressor (PDF streams, CompressionStream).
flate2 = "1.1.10"
# WebSocket masking keys and handshake nonces.
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
httparse = "1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1", "http2"] }
# HTTPS: rustls with ring (pure Rust, no system TLS state) and Mozilla's roots.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
pyro-psl.workspace = true
percent-encoding = "2.3.2"
rustc-hash = "2.1.3"
# `Content-Encoding: zstd` (src/zstd.rs): a pure-Rust decoder, no C build.
ruzstd = "0.9.1"
# Sec-WebSocket-Accept.
sha1 = "0.10"
# CSP hash-sources (src/csp.rs).
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "fs", "macros"] }
tower-service = "0.3"
url = "2"
# Response-body inflation (src/inflate.rs), used directly, not as flate2's
# backend: 942 KB gzip body 2.9 ms against miniz_oxide's 4.0.
zlib-rs = { version = "0.6.8", default-features = false, features = ["std"] }

[dev-dependencies]
h2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# zstd frame checksums in the src/zstd.rs tests (ruzstd's own hasher).
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

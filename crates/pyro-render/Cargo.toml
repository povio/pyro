[package]
name = "pyro-render"
description = "Page snapshot to pixels with Blitz (Stylo + Taffy + Parley, painted by Vello), plus screenshot comparison."
version.workspace = true
edition.workspace = true
license.workspace = true
# One integration test binary (tests/integration.rs): each test executable links
# the whole renderer, so one per file made `cargo test` mostly link time.
autotests = false

[features]
# GPU raster (vello on wgpu/Metal). Off: the CPU backend (vello_cpu) is the
# default and the deterministic one.
gpu = ["dep:anyrender_vello"]

[dependencies]
data-url = "0.3"
roxmltree = "0.20"
app_units = "0.7"
rustc-hash = "2"
style = { package = "stylo", version = "0.24.0" }
style_dom = { version = "0.24.0", package = "stylo_dom" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
url = "2"
# `text-transform-icu`: language-specific case mappings (Turkish and Azerbaijani dotted and dotless
# i, Lithuanian, Greek), as Chromium has them; `text-transform` uses Rust's own mappings without it.
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "woff", "svg", "floats", "writing-mode", "text-transform-icu"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
# By-value getters for `Copy` computed values (Stylo 0.23 names the others `slow_clone_*`).
stylo_taffy = { version = "=0.3.0-beta.4", default-features = false }
anyrender = "0.14.0"
pyro-canvas = { workspace = true }
# `multithreading`: vello_cpu can raster on threads of its own. A 1280x720 capture cost
# twice the CPU on them (10.9 ms against 5.0) for the hand-offs, so only frames of 4 M px or
# more use them (`THREADED_RASTER_PIXELS`, `raster_threads`); the pixels are the same either
# way. Vendored for `VelloCpuImageRenderer::with_threads` (vendor/anyrender_vello_cpu).
anyrender_vello_cpu = { version = "0.18.0", features = ["multithreading"] }
anyrender_vello = { version = "0.15.0", optional = true }
# Draws SVG images for `shape-outside` (`svg_shape_alpha`), as blitz-paint draws them.
anyrender_svg = "0.15.0"
peniko = "0.6.0"
kurbo = "0.13.1"
parley = { version = "0.12", default-features = false, features = ["std"] }
# blitz-dom decodes images with `image` but enables no format.
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
png = "0.18"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
skrifa = "0.42"
# JPEG screenshots and screencast frames: libjpeg-turbo, built from the crate's
# vendored source with CMake. Its SIMD code (NEON on arm64, SSE2/AVX2 on
# x86-64) needs NASM on x86-64 only; without NASM that build falls back to C.
# A 3840x2160 page: 4.4x less CPU than jpeg-encoder's scalar 4:4:4 (see compare.rs).
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake"] }
# Capture CPU time (getrusage) and writes to FIFOs (poll).
libc = "0.2"

[dev-dependencies]
base64 = "0.23.1"
pyro-raster = { path = "../pyro-raster", features = ["test-budgets"] }
# Trees for the mirror tests come from pyro-dom (pyro-render itself does not depend on it).
pyro-dom = { workspace = true }
# Inflates PDF streams in the PDF tests.
miniz_oxide = "0.8"
# ICC profiles for the tagged image tests (the image crate's colour management library).
moxcms = "0.8"

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

# `add_font_file` changes the process's fonts before their first use, which the
# integration binary's tests make: its test runs in a process of its own.
[[test]]
name = "startup_fonts"
path = "tests/startup_fonts.rs"

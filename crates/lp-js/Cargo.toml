[package]
name = "lp-js"
description = "Safe, thread-affine JavaScriptCore runtime layer: engine, realms, values, host classes, modules."
version.workspace = true
edition.workspace = true
license.workspace = true
# One integration test binary (tests/integration.rs) instead of one per file.
autotests = false

[dependencies]
lp-jsc-sys.workspace = true
libc = "0.2"
rustc-hash = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde_json.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "string_allocation"
path = "tests/string_allocation.rs"

# Its own process: it sets a JSC option (`JSC_collectContinuously`) that is
# read once and that no other test wants.
[[test]]
name = "teardown_collecting"
path = "tests/teardown_collecting.rs"

[lints]
workspace = true

[features]
# Builds the measurement examples (slow to compile: ~9000 generated callbacks).
bench = []

[[example]]
name = "realm_bench"
required-features = ["bench"]

[env]
# Oldest macOS we target. JavaScriptCore entry points newer than this are
# resolved at runtime (lp_jsc_sys::spi) rather than linked.
MACOSX_DEPLOYMENT_TARGET = "14.0"

# Sign macOS executables with the JIT entitlement after linking (see
# scripts/macos/link-and-sign.sh). Applies to `cargo build`, `run` and `test`.
[target.aarch64-apple-darwin]
linker = "scripts/macos/link-and-sign.sh"

[target.x86_64-apple-darwin]
linker = "scripts/macos/link-and-sign.sh"

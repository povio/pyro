<!doctype html><html><head><title>Form</title></head><body>
<form id="f">
<label for="name">Name</label><input id="name" name="name">
<label>Email <input type="email" name="email"></label>
<label><input type="checkbox" name="agree"> I agree</label>
<label for="color">Color</label><select id="color" name="color"><option value="r">Red</option><option value="g">Green</option><option value="b">Blue</option></select>
<textarea aria-label="Notes" name="notes"></textarea>
<button type="submit">Save</button>
</form>
<p id="res" role="status"></p>
<ul><li>Apple</li><li>Banana</li><li>Cherry</li></ul>
<script>document.getElementById('f').addEventListener('submit', function (event) { event.preventDefault(); fetch('/api/echo',{method:'POST',body:new URLSearchParams(new FormData(this))}).then(r=>r.json()).then(j=>{document.getElementById('res').textContent='Saved: '+j.body}); });</script></body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Login</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Lato, sans-serif;
    background: linear-gradient(135deg, #1e3a8a 0%, #6d28d9 100%);
    display: flex; align-items: center; justify-content: center;
    color: #1f2937;
  }
  .card {
    width: 380px; padding: 32px 36px; background: #ffffff;
    border-radius: 14px; box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
  }
  .logo { width: 48px; height: 48px; border-radius: 12px; background: #6d28d9; margin-bottom: 16px; }
  h1 { font-size: 24px; margin: 0 0 4px 0; font-weight: 700; }
  p.sub { margin: 0 0 24px 0; color: #6b7280; font-size: 14px; }
  label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; }
  .field {
    height: 40px; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 16px;
    padding: 0 12px; display: flex; align-items: center; font-size: 14px; color: #9ca3af;
    background: #f9fafb;
  }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 20px; }
  .check { display: flex; align-items: center; gap: 8px; }
  .box { width: 14px; height: 14px; border: 1px solid #9ca3af; border-radius: 3px; background: #ffffff; }
  a { color: #6d28d9; text-decoration: none; }
  .button {
    height: 42px; border-radius: 8px; background: #6d28d9; color: #ffffff;
    display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
  }
  .footer { margin-top: 20px; text-align: center; font-size: 13px; color: #6b7280; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to continue to your workspace.</p>
    <label>Email</label>
    <div class="field">you@example.com</div>
    <label>Password</label>
    <div class="field">••••••••••</div>
    <div class="row">
      <div class="check"><div class="box"></div><span>Remember me</span></div>
      <a href="#">Forgot password?</a>
    </div>
    <div class="button">Sign in</div>
    <div class="footer">No account? <a href="#">Create one</a></div>
  </div>
</body>
</html>

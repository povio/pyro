<!doctype html>
<!--
  The ToS finance table: table-layout fixed, <col> widths that sum to less
  than the table's width (so every column grows), and a header cell with
  max-width: 60px (Tailwind max-w-[60px]) over a 60px column. Chromium
  ignores min-width and max-width on table cells: the header cell spans its
  grown column, its right border lines up with the body cell's. Second
  table: the same in the auto table layout.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="fidelity-viewport" content="480x200">
<style>
  body { margin: 10px; font: 13px system-ui; }
  table { width: 400px; border-collapse: separate; border-spacing: 0; margin-bottom: 16px; }
  th, td { padding: 0; height: 24px; text-align: left; }
  th { background: #eceef0; }
  .first { border-right: 2px solid #292c33; max-width: 60px; width: 60px; min-width: 60px; }
  td.first { max-width: none; }
  td { border-bottom: 1px solid #ccc; }
</style>
</head>
<body>
<table style="table-layout: fixed">
  <colgroup><col style="width: 60px"><col style="width: 120px"><col style="width: 120px"></colgroup>
  <thead><tr><th class="first">#</th><th>Charge/Fee</th><th>Quantity</th></tr></thead>
  <tbody><tr><td class="first">1</td><td>Freight</td><td>2</td></tr></tbody>
</table>
<table>
  <thead><tr><th class="first">#</th><th style="width: 120px">Charge/Fee</th><th style="width: 120px">Quantity</th></tr></thead>
  <tbody><tr><td class="first">1</td><td>Freight</td><td>2</td></tr></tbody>
</table>
<script>
  window.__measure = () => [...document.querySelectorAll('table')].map((t, i) => {
    const th = t.querySelector('th').getBoundingClientRect();
    const td = t.querySelector('td').getBoundingClientRect();
    return { case: i ? 'auto' : 'fixed', thWidth: +th.width.toFixed(2), tdWidth: +td.width.toFixed(2) };
  });
</script>
</body>
</html>

<!doctype html>
<!--
  Where a line of text is painted. Chromium paints each line's text from a
  whole CSS pixel at any device scale factor: the line's top in the document,
  in layout units of 1/64px, rounded half up. A line height given as a number
  is the font size times it, cut to a layout unit.

  pyro rounded a line's top to a device pixel inside its block, and added a
  fractional offset of the block's content (a vertically centred table cell,
  an input) as it was. At a device scale of 2 or 3, lines of a fractional pitch
  (the first row: 21.5px, 1.43 times 13px, ...) and the text of centred cells
  and inputs of an odd height were a device pixel off; with a line height of
  1.43 times 19px (27.17px for 27.156px) the fourth line was a CSS pixel off.

  On the way: a collapsed table's rows of a given height were 1px taller than
  Chromium's (34, 42 and 38px for 33, 41 and 37px), a single-line input of a
  fixed height kept its line height where Chromium's inner editor takes
  `line-height: normal` (the value stood a CSS pixel high), and an outside
  list marker was a bullet glyph up to 2px right of Chromium's shape.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="fidelity-viewport" content="860x330">
<style>
  @font-face { font-family: Lato; src: url(/screenshot/fixtures/fonts/Lato-Regular.ttf) format("truetype"); }
  html, body { margin: 0; background: #fff; color: #000; -webkit-font-smoothing: antialiased; }
  .c { position: absolute; width: 90px; white-space: nowrap; }
  table { position: absolute; left: 10px; top: 150px; border-collapse: collapse; }
  td { padding: 0 8px; border: 1px solid #ccc; vertical-align: middle; }
  input, textarea { position: absolute; top: 280px; box-sizing: border-box; width: 110px; margin: 0; padding: 0 8px; border: 1px solid #999; border-radius: 4px; }
  ul { position: absolute; left: 640px; top: 150px; margin: 0; width: 200px; }
  .badge { background: #fde68a; border: 1px solid #b45309; border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<script>
  let html = '';
  const cells = [];
  // Four lines each, of a pitch that is not a whole number of pixels.
  [
    ['11px/21.5px Lato', 100], ['13px/1.43 system-ui', 100], ['19px/1.43 Lato', 120], ['14px/1.375 system-ui', 100],
    ['15.3px/1.15 Lato', 100], ['12px/143% system-ui', 100], ['13.6px/1.7 Lato', 100], ['16px/1.2 system-ui', 100],
  ].forEach(([font, width], i) => {
    const x = 10 + i * 105;
    html += `<div class="c" style="left:${x}px;top:10px;font:${font}">Hxg one<br>Hxg two<br>Hxg three<br>Hxg four</div>`;
    cells.push([`lines ${font}`, `div.c:nth-of-type(${i + 1})`]);
  });
  // A table's vertically centred cells, as tall as their rows: half a pixel above and below the text.
  html += '<table>' + [[33, '13px/19px system-ui'], [41, '14px/21px Lato'], [37, '12px/17px system-ui']].map(([height, font], r) =>
    `<tr style="height:${height}px">` + ['Booking', 'Hamburg', '12 Nov 2026', '1.250,00'].map((text) => `<td style="font:${font}">${text}</td>`).join('') + '</tr>').join('') + '</table>';
  [33, 41, 37].forEach((height, r) => cells.push([`row of ${height}px`, `tr:nth-child(${r + 1})`]));
  // A list with markers outside, lines of a fractional pitch, and a badge on the second line.
  html += `<ul style="font:13px/1.43 system-ui"><li>First item</li><li>Second <span class="badge">badge</span></li><li>Third item<br>on <span class="badge">two</span> lines</li><li>Fourth item</li></ul>`;
  [1, 2, 3, 4].forEach((n) => cells.push([`list item ${n}`, `li:nth-child(${n})`]));
  // Inputs of an odd height: a value, a placeholder, and a textarea's lines.
  html += `<input style="left:10px;height:33px;font:13px/1.43 system-ui" value="Hamburg">`;
  html += `<input style="left:130px;height:37px;font:14px/1.375 Lato" placeholder="Search...">`;
  html += `<input style="left:250px;height:30px;font:15.3px Lato" value="12.50">`;
  html += `<textarea style="left:370px;height:44px;padding:1px 8px;font:13px/1.43 system-ui;resize:none">Hxg one\nHxg two</textarea>`;
  document.body.innerHTML = html;
  // Layout numbers: each block's, row's and item's box. The text in them is where the shots differ.
  window.__measure = () => cells.map(([name, selector]) => {
    const r = document.querySelector(selector).getBoundingClientRect();
    return { case: name, x: r.x, y: r.y, w: r.width, h: r.height };
  });
</script>
</body>
</html>

<!doctype html>
<!--
  Icons drawn from an external sprite, as the ToS header's (Chat, Activity,
  History): <svg> with no viewBox and no width/height attributes, sized by
  CSS (a 16px wrapper, the svg at 100%), whose <use> references a
  <symbol viewBox="0 0 24 24">. The symbol's viewBox maps onto the use's
  viewport, the svg's 16px box: the 24-unit icon is drawn at 16px. Second
  row: the same with viewBox="0 0 24 24" on the <svg>, for reference.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="fidelity-viewport" content="260x110">
<style>
  body { margin: 10px; font: 14px system-ui; color: #2563eb; }
  .slot { display: inline-flex; width: 16px; height: 16px; margin-right: 24px; outline: 1px dotted #ccc; }
  .slot > svg { width: 100%; height: 100%; }
  .big { width: 48px; height: 48px; }
  p { margin: 0 0 12px; }
</style>
</head>
<body>
<p><span class="slot"><svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-5"><use href="assets/sprite.svg#bubble"></use></svg></span><span class="slot big"><svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="assets/sprite.svg#bubble"></use></svg></span></p>
<p><span class="slot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="assets/sprite.svg#bubble"></use></svg></span><span class="slot big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="assets/sprite.svg#bubble"></use></svg></span></p>
</body>
</html>

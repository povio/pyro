name: PGO build (macOS arm64)
description: >-
  The release browser built by scripts/pgo with PYRO_PGO_LLVM and PYRO_PGO_LTO=1:
  Rust and JavaScriptCore optimized by one training run (bench/scripts/cdp-perf.mjs, serve and
  serve --fork), the JavaScriptCore archive as ThinLTO bitcode. Output:
  target/aarch64-apple-darwin/release-pgo/pyro.

inputs:
  cargo-args:
    description: Extra cargo arguments for both builds (for example --locked)
    required: false
    default: --locked

runs:
  using: composite
  steps:
    - name: Report available build space
      shell: bash
      run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
    - name: Rust with llvm-tools (llvm-profdata of rustc's LLVM)
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal --component llvm-tools --no-self-update
        rustup default stable
        v="$(rustc -vV | sed -n 's/^LLVM version: //p')"
        echo "LLVM_VERSION=$v" >> "$GITHUB_ENV"
        echo "LLVM_MAJOR=${v%%.*}" >> "$GITHUB_ENV"
    - uses: oven-sh/setup-bun@v2
    - name: Build tools for JavaScriptCore
      shell: bash
      run: command -v ninja >/dev/null || brew install ninja
    # Only what the scripts use of the release (clang, the archivers, libLTO, clang's own
    # headers and runtimes): about 450 MB of the 7 GB the release unpacks to.
    - uses: actions/cache@v4
      id: llvm
      with:
        # Workspace paths restore at the same depth on every runner and avoid concurrent HOME writes.
        path: .ci/llvm-pgo
        key: llvm-pgo-macos-arm64-v2-${{ env.LLVM_VERSION }}
    - name: LLVM release of rustc's major version
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Checked by file, not by cache hit (see the cache key above).
        if [ -x "$GITHUB_WORKSPACE/.ci/llvm-pgo/bin/clang" ]; then "$GITHUB_WORKSPACE/.ci/llvm-pgo/bin/clang" --version; exit 0; fi
        # rustc's exact LLVM version, else the newest release of its major version (common.sh
        # checks the major version only).
        tag="llvmorg-$LLVM_VERSION"
        if ! gh release view "$tag" --repo llvm/llvm-project >/dev/null 2>&1; then
          tag="$(gh release list --repo llvm/llvm-project --limit 100 --json tagName -q '.[].tagName' \
            | grep -E "^llvmorg-$LLVM_MAJOR\.[0-9]+\.[0-9]+$" | sort -V | tail -1)"
        fi
        v="${tag#llvmorg-}"
        name="LLVM-$v-macOS-ARM64"
        echo "LLVM release $v"
        mkdir -p "$GITHUB_WORKSPACE/.ci/llvm-pgo"
        curl -fsSL "https://github.com/llvm/llvm-project/releases/download/$tag/$name.tar.xz" \
          | tar -xJ -C "$GITHUB_WORKSPACE/.ci/llvm-pgo" --strip-components 1 \
            "$name/bin/clang" "$name/bin/clang++" "$name/bin/clang-$LLVM_MAJOR" \
            "$name/bin/llvm-ar" "$name/bin/llvm-ranlib" "$name/bin/llvm-libtool-darwin" \
            "$name/lib/libLTO.dylib" "$name/lib/clang"
        "$GITHUB_WORKSPACE/.ci/llvm-pgo/bin/clang" --version
    - name: Instrumented JavaScriptCore cache key
      id: jsc
      shell: bash
      run: echo "key=$(scripts/jsc/cache-key.sh)" >> "$GITHUB_OUTPUT"
    # The instrumented archive changes only with WebKit's revision, the patches and the compiler.
    - uses: actions/cache@v4
      with:
        path: target/pgo/jsc-generate
        key: pgo-jsc-generate-macos-arm64-${{ steps.jsc.outputs.key }}-llvm-${{ env.LLVM_VERSION }}
    - name: Build (instrumented, training, optimized)
      shell: bash
      env:
        CARGO_ARGS: ${{ inputs.cargo-args }}
        # 3 CPUs and 7 GB of memory; about 3 GB per JavaScriptCore compile job.
        JOBS: '2'
        PYRO_PGO_LTO: '1'
      run: |
        # shellcheck disable=SC2086
        exec bash .github/actions/pgo-build/build.sh $CARGO_ARGS
    - name: Free the PGO build directories
      if: always()
      shell: bash
      run: bash .github/actions/pgo-build/build.sh --cleanup

name: WPT

# Coverage gate over our WPT subset (bench/wpt/README.md). Pull requests run the gate's plan: every page that passed a
# subtest or completed in bench/wpt/baseline.json, split across shards by recorded duration. The `gate` job fails if a
# subtest that passes in the baseline passes in no run of its page (each differing page reruns twice or more), if a
# page that completed completes in no run, if confirmed improvements are not in the baseline yet, or if the pull
# request's baseline.json or flaky.json drops coverage the base branch's protect (unless it has the `wpt-accept-loss`
# label). Pushes to main and manual runs run every page. A run whose gate passes, or fails only for a stale or
# missing baseline, uploads the refreshed bench/wpt/baseline.json as `wpt-baseline` when it changed.
#
# The `reftest` and `reftest-gate` jobs do the same for the paint reftests (bench/wpt/README.md, "Reftests"): each
# reftest renders its test and references in the browser at 800x600 and compares the screenshots with WPT's rules;
# reftest-baseline.json and reftest-flaky.json play the parts of baseline.json and flaky.json, and a refreshed
# baseline is the `wpt-reftest-baseline` artifact.
#
# The `crashtest` job runs and gates WPT's crashtests (bench/wpt/README.md, "Crashtests"): each page is loaded, painted
# and torn down, and passes when the browser neither crashed, panicked nor hung; crashtest-baseline.json and
# crashtest-flaky.json, and a refreshed baseline is the `wpt-crashtest-baseline` artifact.
#
# The browser is the fork build (patched JavaScriptCore, as the npm package ships for arm64): with the system
# framework, window named properties and import maps are missing and ~3,200 subtests on ~150 pages fail for that
# reason alone. It is cached by its inputs, so a pull request that changes none of them skips both macOS builds.
# The `client` job also tests the npm package's client (packages/pyro) against that browser.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every page, including those with no passing subtest to protect
        type: boolean
        default: true
      durations:
        description: Refresh every page's duration in the baseline artifact (otherwise only those that moved 2x and 1 s)
        type: boolean
        default: false
      runner-args:
        description: Extra gate.mjs run arguments for every shard (e.g. --reuse-context or --jobs 1), to compare runs with gate.mjs diff
        type: string
        default: ''
      suites:
        description: Which gates run (the reftests or the crashtests alone leave the testharness shards and the client job out)
        type: choice
        options: [all, testharness, reftest, crashtest]
        default: all
      reftest-runner:
        description: Where the reftest shards run (default lp-m1; macos-15 is GitHub's hosted runner, billed as macOS minutes)
        type: choice
        options: [default, lp-m1, macos-15]
        default: default
      reftest-args:
        description: Extra gate.mjs run arguments for every reftest shard (e.g. --dirs css/CSS2 to measure a directory, --jobs 2)
        type: string
        default: ''
      crashtest-args:
        description: Extra gate.mjs run arguments for the crashtest job (e.g. --dirs css/css-multicol, --jobs 2)
        type: string
        default: ''

permissions:
  contents: read

# Concurrency is per job, not per run, and nothing that started is cancelled:
# - every job that runs on a shared runner (jsc, build, build-linux, and each test job: wpt, client, crashtest,
#   reftest per shard, wpt-linux per shard) has its own group, wpt-<job>[-<shard>]-<PR or ref>, with
#   cancel-in-progress false. GitHub keeps one running and one waiting job per group, and a newer push replaces the
#   waiting one, so the newest commit always gets the next full run.
# - Cancelling builds in progress (the first design) meant nothing finished while 3-4 workers pushed every 15-30
#   minutes: each push cancelled the macOS build before its tests began, and no #399 run completed on 2026-11-18.
# A run whose waiting jobs were replaced ends with its later jobs and gates skipped (they check that no needed job
# was cancelled), not failed.

env:
  FULL: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full) }}

jobs:
  # Cache keys, and whether the Actions cache already holds the browser and the patched JavaScriptCore (a Linux job,
  # seconds), so the macOS jobs that make them run only when needed.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # gh cache list
    outputs:
      jsc-dir: ${{ steps.keys.outputs.jsc-dir }}
      jsc-cached: ${{ steps.keys.outputs.jsc-cached }}
      browser-key: ${{ steps.keys.outputs.browser-key }}
      browser-cached: ${{ steps.keys.outputs.browser-cached }}
      reftest-runner: ${{ steps.reftest.outputs.runner }}
      reftest-shards: ${{ steps.reftest.outputs.shards }}
      linux-jsc-key: ${{ steps.keys.outputs.linux-jsc-key }}
      linux-browser-key: ${{ steps.keys.outputs.linux-browser-key }}
      linux-browser-cached: ${{ steps.keys.outputs.linux-browser-cached }}
      linux-baseline: ${{ steps.keys.outputs.linux-baseline }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            crates/pyro-jsc-sys/webkit
            scripts/jsc
            scripts/linux
            bench/wpt
      - name: Cache keys
        id: keys
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          jsc_dir="$(scripts/jsc/cache-key.sh)"
          # Every input of the browser build, by git object id: sources, build configuration, the bundling script and
          # this workflow (its build steps); plus the stable toolchain (its manifest's hash) and the JavaScriptCore.
          inputs="$(git rev-parse HEAD:crates HEAD:vendor HEAD:Cargo.toml HEAD:Cargo.lock HEAD:.cargo HEAD:scripts/macos \
            HEAD:.github/workflows/wpt.yml)"
          toolchain="$(curl -fsS --retry 3 https://static.rust-lang.org/dist/channel-rust-stable.toml.sha256)" || toolchain=unknown
          browser_key="wpt-browser-macos-arm64-$(printf '%s\n' "$inputs" "${toolchain%% *}" "$jsc_dir" | sha256sum | cut -c1-16)"
          # An entry this run can restore: saved on its own ref, its base branch or main. A failed lookup is a miss.
          cached() {
            gh cache list --repo "$GITHUB_REPOSITORY" --key "$1" --limit 100 --json key,ref \
              --jq ".[] | select(.key == \"$1\") | .ref" 2>/dev/null \
              | grep -qxF -e "$GITHUB_REF" -e "refs/heads/${BASE_REF:-main}" -e refs/heads/main && echo true || echo false
          }
          {
            echo "jsc-dir=$jsc_dir"
            echo "jsc-cached=$(cached "patched-jsc-static-macos-arm64-$jsc_dir")"
            echo "browser-key=$browser_key"
            echo "browser-cached=$(cached "$browser_key")"
          } | tee -a "$GITHUB_OUTPUT"
          # The Linux x64 browser for the testharness pages (jsc.yml's linux job keys its JavaScriptCore the same way).
          linux_jsc_key="patched-jsc-static-linux-x64-$jsc_dir-$(sha256sum scripts/linux/setup.sh | cut -c1-8)"
          linux_browser_key="wpt-browser-linux-x64-$(printf '%s\n' "$inputs" "${toolchain%% *}" "$linux_jsc_key" ubuntu-24.04 | sha256sum | cut -c1-16)"
          # Once bench/wpt/baseline-linux.json is committed, the testharness gate runs on Linux only (see `wpt-linux`).
          linux_baseline=false
          if [ -f bench/wpt/baseline-linux.json ]; then linux_baseline=true; fi
          {
            echo "linux-jsc-key=$linux_jsc_key"
            echo "linux-browser-key=$linux_browser_key"
            echo "linux-browser-cached=$(cached "$linux_browser_key")"
            echo "linux-baseline=$linux_baseline"
          } | tee -a "$GITHUB_OUTPUT"
      # The reftest shards run on the self-hosted runner (lp-m1), as every other macOS job: two shards, one per lp-m1
      # machine (worker-2-air, worker-3-m1), balanced by the baseline's durations as the testharness shards are. A
      # manual run can pick GitHub's macos-15 runners (four shards side by side; billed as macOS minutes); their
      # results matched lp-m1's but for one animation page's timing (bench/wpt/README.md, "Reftests"). None for
      # `suites: testharness`.
      - name: Reftest shards
        id: reftest
        env:
          RUNNER: ${{ inputs.reftest-runner }}
          SUITES: ${{ inputs.suites }}
        run: |
          runner="${RUNNER:-default}"
          if [ "$runner" = default ]; then runner=lp-m1; fi
          if [ "$SUITES" = testharness ] || [ "$SUITES" = crashtest ]; then shards='[]'
          elif [ "$runner" = macos-15 ]; then shards='[0, 1, 2, 3]'
          else shards='[0, 1]'; fi
          { echo "runner=$runner"; echo "shards=$shards"; } | tee -a "$GITHUB_OUTPUT"

  # The patched JavaScriptCore, built (about 7 minutes) only when neither it nor the browser is cached.
  jsc:
    needs: prepare
    if: needs.prepare.outputs.browser-cached != 'true' && needs.prepare.outputs.jsc-cached != 'true'
    concurrency:
      group: wpt-jsc-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/jsc.yml

  build:
    needs: [prepare, jsc]
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.browser-cached != 'true' }}
    # The self-hosted Apple Silicon runner (label lp-m1), as the jsc job.
    runs-on: lp-m1
    concurrency:
      group: wpt-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      JSC_DIR: ${{ needs.prepare.outputs.jsc-dir }}
      # That Mac's newest SDK is one its linker cannot read; see jsc.yml.
      SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
    steps:
      - uses: actions/checkout@v6
      # The patched JavaScriptCore: the jsc job's artifact when it ran, otherwise the Actions cache.
      - uses: actions/download-artifact@v4
        if: needs.jsc.result == 'success'
        with:
          name: patched-jsc
          path: patched-jsc
      - uses: actions/cache/restore@v4
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        if: needs.jsc.result != 'success'
        with:
          path: ~/Library/Caches/pyro/jsc/${{ needs.prepare.outputs.jsc-dir }}
          key: patched-jsc-static-macos-arm64-${{ needs.prepare.outputs.jsc-dir }}
          fail-on-cache-miss: true
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      # Dependencies only (workspace crates always rebuild). Only main saves: pull requests restore main's cache, and
      # their own entries would evict it from the repository's cache budget.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wpt-wptiter
          # Its post step deletes binaries it does not know from ~/.cargo/bin, rustup among them, which
          # broke the Rust install of the self-hosted runner (lp-m1).
          cache-bin: false
          # Also the integration pull requests (integration/*), whose runs rebuild most often.
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.head_ref, 'integration/') }}
      # wptiter: release-fast (Cargo.toml) without LTO and with 16 codegen units, defined here so Cargo.toml and the
      # release workflows keep their profiles. Same reftest results as release-fast (2026-11-18, at 1363c0eb9: the 792
      # css-backgrounds and compositing reftests, 774 pass and 18 fail with either binary) and a much faster build,
      # since every workspace and vendored crate rebuilds each run.
      - name: Build the browser against the patched JavaScriptCore
        env:
          CARGO_PROFILE_WPTITER_INHERITS: release-fast
          CARGO_PROFILE_WPTITER_LTO: 'false'
          CARGO_PROFILE_WPTITER_CODEGEN_UNITS: '16'
          CARGO_PROFILE_WPTITER_INCREMENTAL: 'false'
        run: |
          export PYRO_JSC_DIR="$HOME/Library/Caches/pyro/jsc/$JSC_DIR"
          if [ -d patched-jsc ]; then
            mkdir -p "$(dirname "$PYRO_JSC_DIR")"
            # The runner keeps its home between jobs, and another job may have left this build there: replace it
            # (mv would move the artifact inside it, or fail once it is there), as publish-npm.yml does.
            rm -rf "$PYRO_JSC_DIR"
            mv patched-jsc "$PYRO_JSC_DIR"
          fi
          cargo +stable build --locked --profile wptiter --package pyro
      - name: Stage and check the browser
        run: |
          mkdir browser
          cp target/wptiter/pyro browser/
          # The patched JavaScriptCore is inside the browser (a static archive): no library of that name is loaded.
          if otool -L browser/pyro | grep -F JavaScriptCore; then exit 1; fi
          codesign --verify --strict browser/pyro
          browser/pyro version | grep -q 'fork: true'
          browser/pyro eval -e 'console.log("ok")' | grep -Fx ok
          tar -czf browser.tgz browser
      # For later runs with the same inputs (pull requests restore their own entries and main's).
      - uses: actions/cache/save@v4
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        with:
          path: browser.tgz
          key: ${{ needs.prepare.outputs.browser-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: wpt-browser
          path: browser.tgz
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  wpt:
    needs: [prepare, build]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && needs.prepare.outputs.linux-baseline != 'true' && inputs.suites != 'reftest' && inputs.suites != 'crashtest' }}
    runs-on: lp-m1
    timeout-minutes: 30
    concurrency:
      group: wpt-wpt-${{ matrix.shard }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # One shard: lp-m1 runs one job at a time, so four shards ran one after another and each paid its setup
        # (about 25 s of a 68 s job). The pages run as before, --jobs 4 side by side. More shards are balanced by the
        # baseline's durations; the gate job checks that all of them reported.
        shard: [0]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install the runner's dependencies
        working-directory: bench
        run: bun install --frozen-lockfile
      # The pinned WPT revision, only the directories bench/wpt/wpt-paths.txt lists (about 290 MB).
      - uses: actions/cache@v4
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        id: wpt-cache
        with:
          path: wpt
          key: wpt-${{ hashFiles('bench/wpt/wpt-revision.txt', 'bench/wpt/wpt-paths.txt', 'bench/wpt/fetch-wpt.sh') }}
      - name: Fetch WPT
        if: steps.wpt-cache.outputs.cache-hit != 'true'
        run: bench/wpt/fetch-wpt.sh wpt
      # The browser: this run's build, or the cached one when its inputs did not change.
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: wpt-browser
      - uses: actions/cache/restore@v4
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        if: needs.build.result != 'success'
        with:
          path: browser.tgz
          key: ${{ needs.prepare.outputs.browser-key }}
          fail-on-cache-miss: true
      - run: tar -xzf browser.tgz
      - name: Server tests
        run: bun test bench/wpt/pipes.test.mjs
      - name: Run shard ${{ strategy.job-index }} of ${{ strategy.job-total }}
        env:
          SHARD: ${{ strategy.job-index }}/${{ strategy.job-total }}
          RUNNER_ARGS: ${{ inputs.runner-args }}
          # The load the baseline was recorded under (GitHub's 3-CPU macos-15 runners: one page more than CPUs), kept
          # on lp-m1's 8 CPUs so timing-dependent pages see what they saw. Reruns use the same --jobs, padded with
          # copies of the pages they rerun.
          JOBS: '4'
          OUT: wpt-shard-${{ strategy.job-index }}.json
        run: |
          read -r -a extra <<< "$RUNNER_ARGS"
          full=()
          if [ "$FULL" = true ]; then full=(--full); fi
          # Earlier arguments win, so runner-args can override the defaults after them.
          bun bench/wpt/gate.mjs run "${extra[@]}" --wpt wpt --bin browser/pyro --jobs "$JOBS" \
            --shard "$SHARD" "${full[@]}" --out "$OUT" --no-check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wpt-shard-${{ strategy.job-index }}
          path: wpt-shard-${{ strategy.job-index }}.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # The client against this run's browser: its type check, its own tests and the Playwright-compatible suite
  # (`pyro run`), which no other pull request job runs. ffmpeg (Playwright's build) lets the video tests run.
  client:
    needs: [prepare, build]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && inputs.suites != 'reftest' && inputs.suites != 'crashtest' }}
    runs-on: lp-m1
    timeout-minutes: 25
    concurrency:
      group: wpt-client-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: packages/pyro
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: wpt-browser
          path: ${{ github.workspace }}
      - uses: actions/cache/restore@v4
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        if: needs.build.result != 'success'
        with:
          path: browser.tgz
          key: ${{ needs.prepare.outputs.browser-key }}
          fail-on-cache-miss: true
      - name: Unpack the browser
        working-directory: ${{ github.workspace }}
        run: tar -xzf browser.tgz && browser/pyro version
      - name: Install and build the client
        run: bun install --frozen-lockfile && bun run build
      - name: ffmpeg for the video tests
        continue-on-error: true
        run: bun x playwright install ffmpeg
      - name: Type check
        run: bun run test:types
      - name: Client tests
        run: PYRO_BIN="$GITHUB_WORKSPACE/browser/pyro" bun test ./test
      - name: Playwright-compatible suite (pyro run)
        run: PYRO_BIN="$GITHUB_WORKSPACE/browser/pyro" bun run test:playwright

  gate:
    needs: [prepare, jsc, build, wpt]
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') && needs.prepare.outputs.linux-baseline != 'true' && inputs.suites != 'reftest' && inputs.suites != 'crashtest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the wpt-accept-loss label
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
          # A pull request's merge commit and its first parent, the base branch (its baseline.json and flaky.json).
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: wpt-shard-*
          merge-multiple: true
      - name: Check coverage against bench/wpt/baseline.json
        id: check
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          JOBS_BEFORE: 'prepare: ${{ needs.prepare.result }}, jsc: ${{ needs.jsc.result }}, build: ${{ needs.build.result }}, shards: ${{ needs.wpt.result }}'
        run: |
          shopt -s nullglob
          files=(wpt-shard-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            msg="No shard results, so nothing was checked: the jobs before this one failed or did not run ($JOBS_BEFORE). See their logs."
            echo "::error title=WPT gate::$msg"
            printf '## WPT coverage gate: FAIL\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          args=()
          if [ "$EVENT" = pull_request ]; then
            # What the base branch protects: this pull request's baseline.json and flaky.json may drop it only with the
            # label (read now, so adding it and re-running this job is enough).
            if git show HEAD^1:bench/wpt/baseline.json > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null; then
              args+=(--base-baseline "$RUNNER_TEMP/base-baseline.json")
              if git show HEAD^1:bench/wpt/flaky.json > "$RUNNER_TEMP/base-flaky.json" 2>/dev/null; then
                args+=(--base-flaky "$RUNNER_TEMP/base-flaky.json")
              fi
            fi
            if labels="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name')"; then
              if grep -qx wpt-accept-loss <<< "$labels"; then args+=(--accept-loss); fi
            else
              echo "::warning title=WPT gate::could not read the pull request's labels; checking as if it had none"
            fi
          fi
          bun bench/wpt/gate.mjs check "${files[@]}" --summary "$GITHUB_STEP_SUMMARY" "${args[@]}"
      # Only from a run whose gate passed, or failed only because the baseline is stale or missing: a baseline made
      # from a failing run would carry its losses.
      - name: Refresh the baseline
        id: refresh
        if: ${{ !cancelled() && contains(fromJSON('["pass", "stale", "bootstrap", "rebaseline"]'), steps.check.outputs.verdict) }}
        env:
          DURATIONS: ${{ inputs.durations }}
        run: |
          flags=()
          if [ "$DURATIONS" = true ]; then flags+=(--durations); fi
          bun bench/wpt/gate.mjs update wpt-shard-*.json --out baseline.json "${flags[@]}"
          if cmp -s baseline.json bench/wpt/baseline.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --no-index --stat bench/wpt/baseline.json baseline.json || true
            echo "The refreshed baseline is the \`wpt-baseline\` artifact: \`gh run download $GITHUB_RUN_ID -n wpt-baseline -D bench/wpt\`." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.refresh.outputs.changed == 'true' }}
        with:
          name: wpt-baseline
          path: baseline.json
          retention-days: 30
          overwrite: true

  # ---------- The testharness pages on GitHub's Linux runners (x64), off the two lp-m1 Macs ----------
  # Testharness compares no pixels, so its gate does not need macOS. bench/wpt/baseline-linux.json is the Linux
  # baseline, bootstrapped from this job's CI output (the `wpt-linux-baseline` artifact), never edited by hand. Until it
  # is committed, these jobs only report (gate.mjs bootstrap: every page twice) and the macOS `wpt`/`gate` jobs keep
  # gating; once it is committed, prepare's `linux-baseline` turns the macOS testharness jobs off. Pages whose results
  # differ between the platforms are listed, with the reason, in bench/wpt/README.md ("Linux and macOS").
  build-linux:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.linux-browser-cached != 'true' && inputs.suites != 'reftest' && inputs.suites != 'crashtest' }}
    # Ubuntu 24.04, as jsc.yml's linux job and linux-build.yml: the cached JavaScriptCore archive was compiled against
    # that release's ICU 74 (symbols u_tolower_74, ...), and ubuntu-latest's newer image has ICU 78, so linking there
    # fails. The browser then carries ICU 74 beside it (bundle-icu-linux.sh).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: wpt-build-linux-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    env:
      CC: clang
      CXX: clang++
      JSC_DIR: ${{ needs.prepare.outputs.jsc-dir }}
    steps:
      - uses: actions/checkout@v6
      - name: Scratch disk
        run: |
          # Hosted runners mount a temporary disk at /mnt, larger than what the image leaves on /.
          if mountpoint -q /mnt; then
            sudo mkdir -p /mnt/pyro-target && sudo chown "$(id -u):$(id -g)" /mnt/pyro-target && ln -s /mnt/pyro-target target
          fi
          df -h . /mnt 2>/dev/null || df -h .
      - name: Install build dependencies
        run: scripts/linux/setup.sh
      # The patched JavaScriptCore (jsc.yml's linux job saves it on main); built here only on a miss (~28 minutes).
      - uses: actions/cache/restore@v4
        id: jsc-cache
        with:
          path: ~/.cache/pyro/jsc/${{ needs.prepare.outputs.jsc-dir }}
          key: ${{ needs.prepare.outputs.linux-jsc-key }}
      - name: Build patched JavaScriptCore
        if: steps.jsc-cache.outputs.cache-hit != 'true'
        env:
          JOBS: '4'
        run: scripts/jsc/build.sh
      - uses: actions/cache/save@v4
        if: steps.jsc-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/pyro/jsc/${{ needs.prepare.outputs.jsc-dir }}
          key: ${{ needs.prepare.outputs.linux-jsc-key }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wpt-linux-x64-wptiter
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.head_ref, 'integration/') }}
      # sccache on the Actions cache: the vendored crates are path dependencies, which rust-cache does not keep.
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Build the browser (profile wptiter)
        env:
          SCCACHE_GHA_ENABLED: 'true'
          RUSTC_WRAPPER: sccache
          # wptiter: release-fast without LTO, 16 codegen units (as ~/Library/Caches/lightningpanda/bin/pyro-build
          # --iter, minus incremental, which sccache cannot cache). Defined here so Cargo.toml and release builds stay.
          CARGO_PROFILE_WPTITER_INHERITS: release-fast
          CARGO_PROFILE_WPTITER_LTO: 'false'
          CARGO_PROFILE_WPTITER_CODEGEN_UNITS: '16'
          CARGO_PROFILE_WPTITER_INCREMENTAL: 'false'
          CARGO_PROFILE_WPTITER_DEBUG: 'false'
        run: |
          export PYRO_JSC_DIR="$HOME/.cache/pyro/jsc/$JSC_DIR"
          cargo +stable build --locked --profile wptiter --package pyro
          sccache --show-stats || true
      - name: Stage and check the browser
        run: |
          mkdir browser
          cp target/wptiter/pyro browser/
          scripts/release/bundle-icu-linux.sh browser
          if ldd browser/pyro | grep -E 'not found|libJavaScriptCore'; then exit 1; fi
          browser/pyro version | grep -q 'fork: true'
          browser/pyro eval -e 'console.log("ok")' | grep -Fx ok
          tar -czf browser-linux.tgz browser
      - uses: actions/cache/save@v4
        with:
          path: browser-linux.tgz
          key: ${{ needs.prepare.outputs.linux-browser-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: wpt-browser-linux
          path: browser-linux.tgz
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  wpt-linux:
    needs: [prepare, build-linux]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && inputs.suites != 'reftest' && inputs.suites != 'crashtest' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: wpt-linux-${{ matrix.shard }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # Three shards side by side (billed Linux minutes, nothing queues), balanced by the Linux baseline's durations.
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install the runner's dependencies
        working-directory: bench
        run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        id: wpt-cache
        with:
          path: wpt
          key: wpt-linux-${{ hashFiles('bench/wpt/wpt-revision.txt', 'bench/wpt/wpt-paths.txt', 'bench/wpt/fetch-wpt.sh') }}
      - name: Fetch WPT
        if: steps.wpt-cache.outputs.cache-hit != 'true'
        run: bench/wpt/fetch-wpt.sh wpt
      - uses: actions/download-artifact@v4
        if: needs.build-linux.result == 'success'
        with:
          name: wpt-browser-linux
      - uses: actions/cache/restore@v4
        if: needs.build-linux.result != 'success'
        with:
          path: browser-linux.tgz
          key: ${{ needs.prepare.outputs.linux-browser-key }}
          fail-on-cache-miss: true
      - run: tar -xzf browser-linux.tgz && browser/pyro version
      - name: Server tests
        run: bun test bench/wpt/pipes.test.mjs
      - name: Run shard ${{ strategy.job-index }} of ${{ strategy.job-total }}
        env:
          SHARD: ${{ strategy.job-index }}/${{ strategy.job-total }}
          RUNNER_ARGS: ${{ inputs.runner-args }}
          # One page per CPU of the 4-CPU runner. At --jobs 8 (68b8650ff) three render-blocking subtests and one
          # transition subtest flipped in 9 of 9 runs (flaky-linux.json); the baseline is recorded at this --jobs.
          JOBS: '4'
          OUT: wpt-linux-shard-${{ strategy.job-index }}.json
        run: |
          echo "$(nproc) CPUs, $(free -g | awk '/^Mem:/{print $2}') GB, $(. /etc/os-release && echo "$PRETTY_NAME")"
          read -r -a extra <<< "$RUNNER_ARGS"
          full=()
          if [ "$FULL" = true ]; then full=(--full); fi
          # flaky.json plus the Linux-only entries (flaky-linux.json): macOS keeps gating what only Linux's timing breaks.
          merge_flaky() { bun -e 'const fs = require("fs"); const r = (f) => (fs.existsSync(f) && fs.statSync(f).size ? JSON.parse(fs.readFileSync(f)).tests : {});
            fs.writeFileSync(process.argv[3], JSON.stringify({ tests: { ...r(process.argv[1]), ...r(process.argv[2]) } }));' "$@"; }
          merge_flaky bench/wpt/flaky.json bench/wpt/flaky-linux.json "$RUNNER_TEMP/flaky.json"
          bun bench/wpt/gate.mjs run "${extra[@]}" --baseline bench/wpt/baseline-linux.json --flaky "$RUNNER_TEMP/flaky.json" \
            --wpt wpt --bin browser/pyro --jobs "$JOBS" --shard "$SHARD" "${full[@]}" --out "$OUT" --no-check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wpt-linux-shard-${{ strategy.job-index }}
          path: wpt-linux-shard-${{ strategy.job-index }}.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # As `gate`, against bench/wpt/baseline-linux.json: fails on a lost subtest or completion and on gains the baseline
  # does not record. Also writes the Linux/macOS comparison (bench/wpt/platform-diff.mjs) into the summary.
  gate-linux:
    needs: [prepare, build-linux, wpt-linux]
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') && inputs.suites != 'reftest' && inputs.suites != 'crashtest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the wpt-accept-loss label
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: wpt-linux-shard-*
          merge-multiple: true
      - name: Check coverage against bench/wpt/baseline-linux.json
        id: check
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          JOBS_BEFORE: 'prepare: ${{ needs.prepare.result }}, build-linux: ${{ needs.build-linux.result }}, shards: ${{ needs.wpt-linux.result }}'
        run: |
          shopt -s nullglob
          files=(wpt-linux-shard-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            msg="No Linux shard results, so nothing was checked: the jobs before this one failed or did not run ($JOBS_BEFORE). See their logs."
            echo "::error title=WPT gate (Linux)::$msg"
            printf '## WPT coverage gate (Linux): FAIL\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # flaky.json plus the Linux-only entries (flaky-linux.json): macOS keeps gating what only Linux's timing breaks.
          merge_flaky() { bun -e 'const fs = require("fs"); const r = (f) => (fs.existsSync(f) && fs.statSync(f).size ? JSON.parse(fs.readFileSync(f)).tests : {});
            fs.writeFileSync(process.argv[3], JSON.stringify({ tests: { ...r(process.argv[1]), ...r(process.argv[2]) } }));' "$@"; }
          merge_flaky bench/wpt/flaky.json bench/wpt/flaky-linux.json "$RUNNER_TEMP/flaky.json"
          args=(--baseline bench/wpt/baseline-linux.json --flaky "$RUNNER_TEMP/flaky.json" --artifact wpt-linux-baseline)
          if [ "$EVENT" = pull_request ]; then
            if git show HEAD^1:bench/wpt/baseline-linux.json > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null; then
              args+=(--base-baseline "$RUNNER_TEMP/base-baseline.json")
              git show HEAD^1:bench/wpt/flaky.json > "$RUNNER_TEMP/base-flaky-mac.json" 2>/dev/null || true
              git show HEAD^1:bench/wpt/flaky-linux.json > "$RUNNER_TEMP/base-flaky-linux.json" 2>/dev/null || true
              merge_flaky "$RUNNER_TEMP/base-flaky-mac.json" "$RUNNER_TEMP/base-flaky-linux.json" "$RUNNER_TEMP/base-flaky.json"
              args+=(--base-flaky "$RUNNER_TEMP/base-flaky.json")
            fi
            if labels="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name')"; then
              if grep -qx wpt-accept-loss <<< "$labels"; then args+=(--accept-loss); fi
            else
              echo "::warning title=WPT gate (Linux)::could not read the pull request's labels; checking as if it had none"
            fi
          fi
          bun bench/wpt/gate.mjs check "${files[@]}" --summary "$GITHUB_STEP_SUMMARY" "${args[@]}"
      - name: Refresh the baseline
        id: refresh
        if: ${{ !cancelled() && contains(fromJSON('["pass", "stale", "bootstrap", "rebaseline"]'), steps.check.outputs.verdict) }}
        env:
          DURATIONS: ${{ inputs.durations }}
        run: |
          flags=()
          if [ "$DURATIONS" = true ]; then flags+=(--durations); fi
          bun bench/wpt/gate.mjs update wpt-linux-shard-*.json --baseline bench/wpt/baseline-linux.json --flaky "$RUNNER_TEMP/flaky.json" \
            --out baseline-linux.json "${flags[@]}"
          if [ -f bench/wpt/baseline-linux.json ] && cmp -s baseline-linux.json bench/wpt/baseline-linux.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "The refreshed Linux baseline is the \`wpt-linux-baseline\` artifact: \`gh run download $GITHUB_RUN_ID -n wpt-linux-baseline -D bench/wpt\`." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      # Fails when a page passes less on Linux than in the macOS baseline and platform-split.json does not say why.
      - name: Linux and macOS
        if: ${{ !cancelled() && steps.refresh.outcome == 'success' }}
        run: bun bench/wpt/platform-diff.mjs bench/wpt/baseline.json baseline-linux.json --flaky bench/wpt/flaky-linux.json --strict --summary "$GITHUB_STEP_SUMMARY" --out platform-diff.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.refresh.outputs.changed == 'true' }}
        with:
          name: wpt-linux-baseline
          path: baseline-linux.json
          retention-days: 30
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.refresh.outcome == 'success' }}
        with:
          name: wpt-platform-diff
          path: platform-diff.json
          retention-days: 30
          overwrite: true

  # The paint reftests: bench/wpt/gate.mjs run --kind reftest, the browser and the WPT checkout as the shards above.
  reftest:
    needs: [prepare, build]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && needs.prepare.outputs.reftest-shards != '[]' }}
    runs-on: ${{ needs.prepare.outputs.reftest-runner }}
    timeout-minutes: 30
    concurrency:
      group: wpt-reftest-${{ matrix.shard }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.reftest-shards) }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install the runner's dependencies
        working-directory: bench
        run: bun install --frozen-lockfile
      # A PATH without zstd on every cache step: the first lp-m1 machine has none, so its cache entries are gzip, and a
      # machine with zstd (the second lp-m1 runner, GitHub's macOS images) would look for another cache version and miss them.
      - uses: actions/cache@v4
        id: wpt-cache
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        with:
          path: wpt
          key: wpt-${{ hashFiles('bench/wpt/wpt-revision.txt', 'bench/wpt/wpt-paths.txt', 'bench/wpt/fetch-wpt.sh') }}
      - name: Fetch WPT
        if: steps.wpt-cache.outputs.cache-hit != 'true'
        run: bench/wpt/fetch-wpt.sh wpt
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: wpt-browser
      - uses: actions/cache/restore@v4
        if: needs.build.result != 'success'
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        with:
          path: browser.tgz
          key: ${{ needs.prepare.outputs.browser-key }}
          fail-on-cache-miss: true
      - run: tar -xzf browser.tgz
      # Power mode, thermal state, memory pressure, swap and load before, during (every 5 s) and after the shard.
      - name: Machine diagnostics (before)
        run: bench/wpt/ci-diag.sh start
      - name: Run reftest shard ${{ strategy.job-index }} of ${{ strategy.job-total }}
        env:
          SHARD: ${{ strategy.job-index }}/${{ strategy.job-total }}
          RUNNER_ARGS: ${{ inputs.reftest-args }}
          OUT: wpt-reftest-shard-${{ strategy.job-index }}.json
        run: |
          echo "$(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB, macOS $(sw_vers -productVersion)"
          read -r -a extra <<< "$RUNNER_ARGS"
          full=()
          if [ "$FULL" = true ]; then full=(--full); fi
          # Two pages per CPU: a reftest page mostly waits (2026-11-18, per-page stages: settle 69 ms of 100, mostly
          # the two real 60 Hz frames, capture 22 ms), so at one per CPU the M1s ran at 30%. Measured on both lp-m1
          # machines (runs 44292757214, 44295604936, 44298843277): --jobs 8 130 s per shard, 30% of 8 CPUs; 12 101-111 s,
          # 40%, same results; 16 88-89 s, 47%, same results but one first-run timeout that its reruns passed; no
          # swap growth, no thermal limit, Low Power Mode off. Earlier arguments win, so reftest-args can override.
          bun bench/wpt/gate.mjs run --kind reftest "${extra[@]}" --wpt wpt --bin browser/pyro --jobs "$(( ${PYRO_CI_CPUS:-$(sysctl -n hw.ncpu)} * 2 ))" \
            --shard "$SHARD" "${full[@]}" --out "$OUT" --no-check
          # CPU share of the machine: (browser + runner CPU) / (wall x CPUs); event loop lag of the runner.
          bun -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1])); const n = require("os").cpus().length;
            console.log(`utilization: ${(100 * (r.browserCpuS + r.runnerCpuS) / (r.wallMs / 1000 * n)).toFixed(0)}% of ${n} CPUs over ${(r.wallMs / 1000).toFixed(0)} s at --jobs ${r.jobs} (browser ${r.browserCpuS.toFixed(0)} s, runner ${r.runnerCpuS.toFixed(0)} s); event loop lag ${JSON.stringify(r.loopLagMs ?? {})}`)' "$OUT"
      - name: Machine diagnostics (after)
        if: ${{ always() }}
        run: bench/wpt/ci-diag.sh stop
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wpt-reftest-shard-${{ strategy.job-index }}
          path: wpt-reftest-shard-${{ strategy.job-index }}.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # The reftest gate: as `gate`, with --kind reftest (bench/wpt/reftest-baseline.json and reftest-flaky.json).
  reftest-gate:
    needs: [prepare, jsc, build, reftest]
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') && inputs.suites != 'testharness' && inputs.suites != 'crashtest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the wpt-accept-loss label
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: wpt-reftest-shard-*
          merge-multiple: true
      - name: Check the reftests against bench/wpt/reftest-baseline.json
        id: check
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          JOBS_BEFORE: 'prepare: ${{ needs.prepare.result }}, jsc: ${{ needs.jsc.result }}, build: ${{ needs.build.result }}, shards: ${{ needs.reftest.result }}'
        run: |
          shopt -s nullglob
          files=(wpt-reftest-shard-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            msg="No reftest shard results, so nothing was checked: the jobs before this one failed or did not run ($JOBS_BEFORE). See their logs."
            echo "::error title=WPT reftest gate::$msg"
            printf '## WPT reftest gate: FAIL\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          args=()
          if [ "$EVENT" = pull_request ]; then
            if git show HEAD^1:bench/wpt/reftest-baseline.json > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null; then
              args+=(--base-baseline "$RUNNER_TEMP/base-baseline.json")
              if git show HEAD^1:bench/wpt/reftest-flaky.json > "$RUNNER_TEMP/base-flaky.json" 2>/dev/null; then
                args+=(--base-flaky "$RUNNER_TEMP/base-flaky.json")
              fi
            fi
            if labels="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name')"; then
              if grep -qx wpt-accept-loss <<< "$labels"; then args+=(--accept-loss); fi
            else
              echo "::warning title=WPT reftest gate::could not read the pull request's labels; checking as if it had none"
            fi
          fi
          bun bench/wpt/gate.mjs check --kind reftest "${files[@]}" --summary "$GITHUB_STEP_SUMMARY" "${args[@]}"
      - name: Refresh the baseline
        id: refresh
        if: ${{ !cancelled() && contains(fromJSON('["pass", "stale", "bootstrap", "rebaseline"]'), steps.check.outputs.verdict) }}
        env:
          DURATIONS: ${{ inputs.durations }}
        run: |
          flags=()
          if [ "$DURATIONS" = true ]; then flags+=(--durations); fi
          bun bench/wpt/gate.mjs update --kind reftest wpt-reftest-shard-*.json --out reftest-baseline.json "${flags[@]}"
          if cmp -s reftest-baseline.json bench/wpt/reftest-baseline.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --no-index --stat bench/wpt/reftest-baseline.json reftest-baseline.json || true
            echo "The refreshed baseline is the \`wpt-reftest-baseline\` artifact: \`gh run download $GITHUB_RUN_ID -n wpt-reftest-baseline -D bench/wpt\`." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.refresh.outputs.changed == 'true' }}
        with:
          name: wpt-reftest-baseline
          path: reftest-baseline.json
          retention-days: 30
          overwrite: true

  # The crashtests: bench/wpt/gate.mjs --kind crashtest, run and checked in one job (about 2,000 pages; the browser
  # and the WPT checkout as the jobs above). One job on lp-m1 rather than a run job and a Linux gate job: the check
  # takes a second, and lp-m1 has git, bun and gh for the base branch's files and the label.
  crashtest:
    needs: [prepare, build]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && inputs.suites != 'testharness' && inputs.suites != 'reftest' }}
    runs-on: lp-m1
    timeout-minutes: 30
    concurrency:
      group: wpt-crashtest-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read # the wpt-accept-loss label
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
          # A pull request's merge commit and its first parent, the base branch (its baseline and flaky list).
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install the runner's dependencies
        working-directory: bench
        run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        id: wpt-cache
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        with:
          path: wpt
          key: wpt-${{ hashFiles('bench/wpt/wpt-revision.txt', 'bench/wpt/wpt-paths.txt', 'bench/wpt/fetch-wpt.sh') }}
      - name: Fetch WPT
        if: steps.wpt-cache.outputs.cache-hit != 'true'
        run: bench/wpt/fetch-wpt.sh wpt
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: wpt-browser
      - uses: actions/cache/restore@v4
        if: needs.build.result != 'success'
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        with:
          path: browser.tgz
          key: ${{ needs.prepare.outputs.browser-key }}
          fail-on-cache-miss: true
      - run: tar -xzf browser.tgz
      - name: Discovery tests
        run: bun test bench/wpt/crashtest.test.mjs
      - name: Machine diagnostics (before)
        run: bench/wpt/ci-diag.sh start
      - name: Run the crashtests
        env:
          RUNNER_ARGS: ${{ inputs.crashtest-args }}
          OUT: wpt-crashtest-shard-0.json
        run: |
          read -r -a extra <<< "$RUNNER_ARGS"
          full=()
          if [ "$FULL" = true ]; then full=(--full); fi
          # Two pages per CPU, as the reftests: at one per CPU the M1s ran at 36%. Measured 2026-11-18 (runs 44305495715,
          # A runner can cap its share with PYRO_CI_CPUS in its .env (the Mac Studio runner uses 4).
          # 44307460716): --jobs 8 21.0 s, 36% of 8 CPUs; --jobs 16 15.5 s, 59%; all 1,979 pages pass in both, no reruns,
          # no swap growth, no thermal limit. Earlier arguments win, so crashtest-args can override.
          bun bench/wpt/gate.mjs run --kind crashtest "${extra[@]}" --wpt wpt --bin browser/pyro --jobs "$(( ${PYRO_CI_CPUS:-$(sysctl -n hw.ncpu)} * 2 ))" \
            "${full[@]}" --out wpt-crashtest-shard-0.json --no-check
          # CPU share of the machine: (browser + runner CPU) / (wall x CPUs); event loop lag of the runner.
          bun -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1])); const n = require("os").cpus().length;
            console.log(`utilization: ${(100 * (r.browserCpuS + r.runnerCpuS) / (r.wallMs / 1000 * n)).toFixed(0)}% of ${n} CPUs over ${(r.wallMs / 1000).toFixed(0)} s at --jobs ${r.jobs} (browser ${r.browserCpuS.toFixed(0)} s, runner ${r.runnerCpuS.toFixed(0)} s); event loop lag ${JSON.stringify(r.loopLagMs ?? {})}`)' "$OUT"
      - name: Machine diagnostics (after)
        if: ${{ always() }}
        run: bench/wpt/ci-diag.sh stop
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wpt-crashtest-shard-0
          path: wpt-crashtest-shard-0.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Check the crashtests against bench/wpt/crashtest-baseline.json
        id: check
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "$EVENT" = pull_request ]; then
            if git show HEAD^1:bench/wpt/crashtest-baseline.json > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null; then
              args+=(--base-baseline "$RUNNER_TEMP/base-baseline.json")
              if git show HEAD^1:bench/wpt/crashtest-flaky.json > "$RUNNER_TEMP/base-flaky.json" 2>/dev/null; then
                args+=(--base-flaky "$RUNNER_TEMP/base-flaky.json")
              fi
            fi
            if labels="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name')"; then
              if grep -qx wpt-accept-loss <<< "$labels"; then args+=(--accept-loss); fi
            else
              echo "::warning title=WPT crashtest gate::could not read the pull request's labels; checking as if it had none"
            fi
          fi
          bun bench/wpt/gate.mjs check --kind crashtest wpt-crashtest-shard-0.json --summary "$GITHUB_STEP_SUMMARY" "${args[@]}"
      # As the other gates: only from a run that passed, or failed only for a stale or missing baseline. The first
      # run (no baseline anywhere) is the bootstrap: every page ran twice and this artifact is the baseline to commit.
      - name: Refresh the baseline
        id: refresh
        if: ${{ !cancelled() && contains(fromJSON('["pass", "stale", "bootstrap", "rebaseline"]'), steps.check.outputs.verdict) }}
        env:
          DURATIONS: ${{ inputs.durations }}
        run: |
          flags=()
          if [ "$DURATIONS" = true ]; then flags+=(--durations); fi
          bun bench/wpt/gate.mjs update --kind crashtest wpt-crashtest-shard-0.json --out crashtest-baseline.json "${flags[@]}"
          if [ -f bench/wpt/crashtest-baseline.json ] && cmp -s crashtest-baseline.json bench/wpt/crashtest-baseline.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if [ -f bench/wpt/crashtest-baseline.json ]; then git diff --no-index --stat bench/wpt/crashtest-baseline.json crashtest-baseline.json || true; fi
            echo "The refreshed baseline is the \`wpt-crashtest-baseline\` artifact: \`gh run download $GITHUB_RUN_ID -n wpt-crashtest-baseline -D bench/wpt\`." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.refresh.outputs.changed == 'true' }}
        with:
          name: wpt-crashtest-baseline
          path: crashtest-baseline.json
          retention-days: 30
          overwrite: true

  # The docs site's WPT status pages (bench/wpt/status-export.mjs, /status/wpt.html): after a push to main whose three
  # gates passed, the build's results (its committed baselines, which those gates checked) go to the `wpt-results`
  # branch as runs/<sha>.json.gz plus index.json, and Chrome stable's results when the WPT revision is new to it. The
  # site rebuilds when this workflow completes (docs.yml, workflow_run).
  status:
    needs: [gate, gate-linux, reftest-gate, crashtest]
    # The testharness gate is gate-linux once bench/wpt/baseline-linux.json exists, the macOS `gate` until then.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && needs.gate-linux.result == 'success')) && needs.reftest-gate.result == 'success' && needs.crashtest.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: wpt-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Export the results to the wpt-results branch
        env:
          SHA: ${{ github.sha }}
          # chrome/<rev>.json.gz for a new WPT revision: GitHub's compare API finds the nearest Chrome stable run.
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date="$(git show -s --format=%cI "$SHA")"
          subject="$(git show -s --format=%s "$SHA")"
          for attempt in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/results"
            if git fetch --depth=1 origin wpt-results; then
              git worktree add --detach "$RUNNER_TEMP/results" FETCH_HEAD
            else
              git worktree add --detach "$RUNNER_TEMP/results" && git -C "$RUNNER_TEMP/results" checkout --orphan wpt-results-new && git -C "$RUNNER_TEMP/results" rm -rfq .
            fi
            bun bench/wpt/status-export.mjs export --data "$RUNNER_TEMP/results" --sha "$SHA" --date "$date" --subject "$subject" --chrome
            git -C "$RUNNER_TEMP/results" add -A
            git -C "$RUNNER_TEMP/results" commit -qm "WPT results for ${SHA:0:10}"
            if git -C "$RUNNER_TEMP/results" push origin HEAD:refs/heads/wpt-results; then exit 0; fi
            git worktree remove --force "$RUNNER_TEMP/results"
            sleep $((attempt * 5))
          done
          exit 1

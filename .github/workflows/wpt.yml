name: WPT

# Coverage gate over our WPT subset (bench/wpt/README.md). Pull requests run the gate's plan: every page that passed a
# subtest or completed in bench/wpt/baseline.json, split across shards by recorded duration. The `gate` job fails if a
# subtest that passes in the baseline passes in no run of its page (each differing page reruns twice or more), if a
# page that completed completes in no run, if confirmed improvements are not in the baseline yet, or if the pull
# request's baseline.json or flaky.json drops coverage the base branch's protect (unless it has the `wpt-accept-loss`
# label). Pushes to main and manual runs run every page. A run whose gate passes, or fails only for a stale or
# missing baseline, uploads the refreshed bench/wpt/baseline.json as `wpt-baseline` when it changed.
#
# The `reftest` and `reftest-gate` jobs do the same for the paint reftests (bench/wpt/README.md, "Reftests"): each
# reftest renders its test and references in the browser at 800x600 and compares the screenshots with WPT's rules;
# reftest-baseline.json and reftest-flaky.json play the parts of baseline.json and flaky.json, and a refreshed
# baseline is the `wpt-reftest-baseline` artifact.
#
# The `crashtest` job runs and gates WPT's crashtests (bench/wpt/README.md, "Crashtests"): each page is loaded, painted
# and torn down, and passes when the browser neither crashed, panicked nor hung; crashtest-baseline.json and
# crashtest-flaky.json, and a refreshed baseline is the `wpt-crashtest-baseline` artifact.
#
# The browser is the fork build (patched JavaScriptCore, as the npm package ships for arm64): with the system
# framework, window named properties and import maps are missing and ~3,200 subtests on ~150 pages fail for that
# reason alone. It is cached by its inputs, so a pull request that changes none of them skips both macOS builds.
# The `client` job also tests the npm package's client (packages/pyro) against that browser.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every page, including those with no passing subtest to protect
        type: boolean
        default: true
      durations:
        description: Refresh every page's duration in the baseline artifact (otherwise only those that moved 2x and 1 s)
        type: boolean
        default: false
      runner-args:
        description: Extra gate.mjs run arguments for every shard (e.g. --reuse-context or --jobs 1), to compare runs with gate.mjs diff
        type: string
        default: ''
      suites:
        description: Which gates run (the reftests or the crashtests alone leave the testharness shards and the client job out)
        type: choice
        options: [all, testharness, reftest, crashtest]
        default: all
      reftest-runner:
        description: Where the reftest shards run (default lp-m1; macos-15 is GitHub's hosted runner, billed as macOS minutes)
        type: choice
        options: [default, lp-m1, macos-15]
        default: default
      reftest-args:
        description: Extra gate.mjs run arguments for every reftest shard (e.g. --dirs css/CSS2 to measure a directory, --jobs 2)
        type: string
        default: ''
      crashtest-args:
        description: Extra gate.mjs run arguments for the crashtest job (e.g. --dirs css/css-multicol, --jobs 2)
        type: string
        default: ''

permissions:
  contents: read

# A new push to a pull request cancels its previous run.
concurrency:
  group: wpt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FULL: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full) }}

jobs:
  # Cache keys, and whether the Actions cache already holds the browser and the patched JavaScriptCore (a Linux job,
  # seconds), so the macOS jobs that make them run only when needed.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # gh cache list
    outputs:
      jsc-dir: ${{ steps.keys.outputs.jsc-dir }}
      jsc-cached: ${{ steps.keys.outputs.jsc-cached }}
      browser-key: ${{ steps.keys.outputs.browser-key }}
      browser-cached: ${{ steps.keys.outputs.browser-cached }}
      reftest-runner: ${{ steps.reftest.outputs.runner }}
      reftest-shards: ${{ steps.reftest.outputs.shards }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            crates/pyro-jsc-sys/webkit
            scripts/jsc
      - name: Cache keys
        id: keys
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          jsc_dir="$(scripts/jsc/cache-key.sh)"
          # Every input of the browser build, by git object id: sources, build configuration, the bundling script and
          # this workflow (its build steps); plus the stable toolchain (its manifest's hash) and the JavaScriptCore.
          inputs="$(git rev-parse HEAD:crates HEAD:vendor HEAD:Cargo.toml HEAD:Cargo.lock HEAD:.cargo HEAD:scripts/macos \
            HEAD:.github/workflows/wpt.yml)"
          toolchain="$(curl -fsS --retry 3 https://static.rust-lang.org/dist/channel-rust-stable.toml.sha256)" || toolchain=unknown
          browser_key="wpt-browser-macos-arm64-$(printf '%s\n' "$inputs" "${toolchain%% *}" "$jsc_dir" | sha256sum | cut -c1-16)"
          # An entry this run can restore: saved on its own ref, its base branch or main. A failed lookup is a miss.
          cached() {
            gh cache list --repo "$GITHUB_REPOSITORY" --key "$1" --limit 100 --json key,ref \
              --jq ".[] | select(.key == \"$1\") | .ref" 2>/dev/null \
              | grep -qxF -e "$GITHUB_REF" -e "refs/heads/${BASE_REF:-main}" -e refs/heads/main && echo true || echo false
          }
          {
            echo "jsc-dir=$jsc_dir"
            echo "jsc-cached=$(cached "patched-jsc-static-macos-arm64-$jsc_dir")"
            echo "browser-key=$browser_key"
            echo "browser-cached=$(cached "$browser_key")"
          } | tee -a "$GITHUB_OUTPUT"
      # The reftest shards run on the self-hosted runner (lp-m1), as every other macOS job: one shard there, since it
      # runs one job at a time and more would only add their setup to its queue. A manual run can pick GitHub's macos-15
      # runners (four shards side by side, about the two shards' time each before the layout directories doubled the
      # reftests; billed as macOS minutes); their results matched lp-m1's but for one animation page's timing
      # (bench/wpt/README.md, "Reftests"). None for `suites: testharness`.
      - name: Reftest shards
        id: reftest
        env:
          RUNNER: ${{ inputs.reftest-runner }}
          SUITES: ${{ inputs.suites }}
        run: |
          runner="${RUNNER:-default}"
          if [ "$runner" = default ]; then runner=lp-m1; fi
          if [ "$SUITES" = testharness ] || [ "$SUITES" = crashtest ]; then shards='[]'
          elif [ "$runner" = macos-15 ]; then shards='[0, 1, 2, 3]'
          else shards='[0]'; fi
          { echo "runner=$runner"; echo "shards=$shards"; } | tee -a "$GITHUB_OUTPUT"

  # The patched JavaScriptCore, built (about 7 minutes) only when neither it nor the browser is cached.
  jsc:
    needs: prepare
    if: needs.prepare.outputs.browser-cached != 'true' && needs.prepare.outputs.jsc-cached != 'true'
    uses: ./.github/workflows/jsc.yml

  build:
    needs: [prepare, jsc]
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.browser-cached != 'true' }}
    # The self-hosted Apple Silicon runner (label lp-m1), as the jsc job.
    runs-on: lp-m1
    timeout-minutes: 45
    env:
      JSC_DIR: ${{ needs.prepare.outputs.jsc-dir }}
      # That Mac's newest SDK is one its linker cannot read; see jsc.yml.
      SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
    steps:
      - uses: actions/checkout@v6
      # The patched JavaScriptCore: the jsc job's artifact when it ran, otherwise the Actions cache.
      - uses: actions/download-artifact@v4
        if: needs.jsc.result == 'success'
        with:
          name: patched-jsc
          path: patched-jsc
      - uses: actions/cache/restore@v4
        if: needs.jsc.result != 'success'
        with:
          path: ~/Library/Caches/pyro/jsc/${{ needs.prepare.outputs.jsc-dir }}
          key: patched-jsc-static-macos-arm64-${{ needs.prepare.outputs.jsc-dir }}
          fail-on-cache-miss: true
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      # Dependencies only (workspace crates always rebuild). Only main saves: pull requests restore main's cache, and
      # their own entries would evict it from the repository's cache budget.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wpt-release-fast
          # Its post step deletes binaries it does not know from ~/.cargo/bin, rustup among them, which
          # broke the Rust install of the self-hosted runner (lp-m1).
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # release-fast: the release profile with pyro-cdp and pyro-dom split into more codegen units (Cargo.toml), so the
      # end of the build is not one core's work.
      - name: Build the browser against the patched JavaScriptCore
        run: |
          export PYRO_JSC_DIR="$HOME/Library/Caches/pyro/jsc/$JSC_DIR"
          if [ -d patched-jsc ]; then
            mkdir -p "$(dirname "$PYRO_JSC_DIR")"
            mv patched-jsc "$PYRO_JSC_DIR"
          fi
          cargo +stable build --locked --profile release-fast --package pyro
      - name: Stage and check the browser
        run: |
          mkdir browser
          cp target/release-fast/pyro browser/
          # The patched JavaScriptCore is inside the browser (a static archive): no library of that name is loaded.
          if otool -L browser/pyro | grep -F JavaScriptCore; then exit 1; fi
          codesign --verify --strict browser/pyro
          browser/pyro version | grep -q 'fork: true'
          browser/pyro eval -e 'console.log("ok")' | grep -Fx ok
          tar -czf browser.tgz browser
      # For later runs with the same inputs (pull requests restore their own entries and main's).
      - uses: actions/cache/save@v4
        with:
          path: browser.tgz
          key: ${{ needs.prepare.outputs.browser-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: wpt-browser
          path: browser.tgz
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  wpt:
    needs: [prepare, build]
    if: ${{ !cancelled() && !failure() && inputs.suites != 'reftest' && inputs.suites != 'crashtest' }}
    runs-on: lp-m1
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One shard: lp-m1 runs one job at a time, so four shards ran one after another and each paid its setup
        # (about 25 s of a 68 s job). The pages run as before, --jobs 4 side by side. More shards are balanced by the
        # baseline's durations; the gate job checks that all of them reported.
        shard: [0]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install the runner's dependencies
        working-directory: bench
        run: bun install --frozen-lockfile
      # The pinned WPT revision, only the directories bench/wpt/wpt-paths.txt lists (about 290 MB).
      - uses: actions/cache@v4
        id: wpt-cache
        with:
          path: wpt
          key: wpt-${{ hashFiles('bench/wpt/wpt-revision.txt', 'bench/wpt/wpt-paths.txt', 'bench/wpt/fetch-wpt.sh') }}
      - name: Fetch WPT
        if: steps.wpt-cache.outputs.cache-hit != 'true'
        run: bench/wpt/fetch-wpt.sh wpt
      # The browser: this run's build, or the cached one when its inputs did not change.
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: wpt-browser
      - uses: actions/cache/restore@v4
        if: needs.build.result != 'success'
        with:
          path: browser.tgz
          key: ${{ needs.prepare.outputs.browser-key }}
          fail-on-cache-miss: true
      - run: tar -xzf browser.tgz
      - name: Run shard ${{ strategy.job-index }} of ${{ strategy.job-total }}
        env:
          SHARD: ${{ strategy.job-index }}/${{ strategy.job-total }}
          RUNNER_ARGS: ${{ inputs.runner-args }}
          # The load the baseline was recorded under (GitHub's 3-CPU macos-15 runners: one page more than CPUs), kept
          # on lp-m1's 8 CPUs so timing-dependent pages see what they saw. Reruns use the same --jobs, padded with
          # copies of the pages they rerun.
          JOBS: '4'
          OUT: wpt-shard-${{ strategy.job-index }}.json
        run: |
          read -r -a extra <<< "$RUNNER_ARGS"
          full=()
          if [ "$FULL" = true ]; then full=(--full); fi
          # Earlier arguments win, so runner-args can override the defaults after them.
          bun bench/wpt/gate.mjs run "${extra[@]}" --wpt wpt --bin browser/pyro --jobs "$JOBS" \
            --shard "$SHARD" "${full[@]}" --out "$OUT" --no-check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wpt-shard-${{ strategy.job-index }}
          path: wpt-shard-${{ strategy.job-index }}.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # The client against this run's browser: its type check, its own tests and the Playwright-compatible suite
  # (`pyro run`), which no other pull request job runs. ffmpeg (Playwright's build) lets the video tests run.
  client:
    needs: [prepare, build]
    if: ${{ !cancelled() && !failure() && inputs.suites != 'reftest' && inputs.suites != 'crashtest' }}
    runs-on: lp-m1
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/pyro
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: wpt-browser
          path: ${{ github.workspace }}
      - uses: actions/cache/restore@v4
        if: needs.build.result != 'success'
        with:
          path: browser.tgz
          key: ${{ needs.prepare.outputs.browser-key }}
          fail-on-cache-miss: true
      - name: Unpack the browser
        working-directory: ${{ github.workspace }}
        run: tar -xzf browser.tgz && browser/pyro version
      - name: Install and build the client
        run: bun install --frozen-lockfile && bun run build
      - name: ffmpeg for the video tests
        continue-on-error: true
        run: bun x playwright install ffmpeg
      - name: Type check
        run: bun run test:types
      - name: Client tests
        run: PYRO_BIN="$GITHUB_WORKSPACE/browser/pyro" bun test ./test
      - name: Playwright-compatible suite (pyro run)
        run: PYRO_BIN="$GITHUB_WORKSPACE/browser/pyro" bun run test:playwright

  gate:
    needs: [prepare, jsc, build, wpt]
    if: ${{ !cancelled() && inputs.suites != 'reftest' && inputs.suites != 'crashtest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the wpt-accept-loss label
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
          # A pull request's merge commit and its first parent, the base branch (its baseline.json and flaky.json).
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: wpt-shard-*
          merge-multiple: true
      - name: Check coverage against bench/wpt/baseline.json
        id: check
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          JOBS_BEFORE: 'prepare: ${{ needs.prepare.result }}, jsc: ${{ needs.jsc.result }}, build: ${{ needs.build.result }}, shards: ${{ needs.wpt.result }}'
        run: |
          shopt -s nullglob
          files=(wpt-shard-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            msg="No shard results, so nothing was checked: the jobs before this one failed or did not run ($JOBS_BEFORE). See their logs."
            echo "::error title=WPT gate::$msg"
            printf '## WPT coverage gate: FAIL\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          args=()
          if [ "$EVENT" = pull_request ]; then
            # What the base branch protects: this pull request's baseline.json and flaky.json may drop it only with the
            # label (read now, so adding it and re-running this job is enough).
            if git show HEAD^1:bench/wpt/baseline.json > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null; then
              args+=(--base-baseline "$RUNNER_TEMP/base-baseline.json")
              if git show HEAD^1:bench/wpt/flaky.json > "$RUNNER_TEMP/base-flaky.json" 2>/dev/null; then
                args+=(--base-flaky "$RUNNER_TEMP/base-flaky.json")
              fi
            fi
            if labels="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name')"; then
              if grep -qx wpt-accept-loss <<< "$labels"; then args+=(--accept-loss); fi
            else
              echo "::warning title=WPT gate::could not read the pull request's labels; checking as if it had none"
            fi
          fi
          bun bench/wpt/gate.mjs check "${files[@]}" --summary "$GITHUB_STEP_SUMMARY" "${args[@]}"
      # Only from a run whose gate passed, or failed only because the baseline is stale or missing: a baseline made
      # from a failing run would carry its losses.
      - name: Refresh the baseline
        id: refresh
        if: ${{ !cancelled() && contains(fromJSON('["pass", "stale", "bootstrap", "rebaseline"]'), steps.check.outputs.verdict) }}
        env:
          DURATIONS: ${{ inputs.durations }}
        run: |
          flags=()
          if [ "$DURATIONS" = true ]; then flags+=(--durations); fi
          bun bench/wpt/gate.mjs update wpt-shard-*.json --out baseline.json "${flags[@]}"
          if cmp -s baseline.json bench/wpt/baseline.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --no-index --stat bench/wpt/baseline.json baseline.json || true
            echo "The refreshed baseline is the \`wpt-baseline\` artifact: \`gh run download $GITHUB_RUN_ID -n wpt-baseline -D bench/wpt\`." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.refresh.outputs.changed == 'true' }}
        with:
          name: wpt-baseline
          path: baseline.json
          retention-days: 30
          overwrite: true

  # The paint reftests: bench/wpt/gate.mjs run --kind reftest, the browser and the WPT checkout as the shards above.
  reftest:
    needs: [prepare, build]
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.reftest-shards != '[]' }}
    runs-on: ${{ needs.prepare.outputs.reftest-runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.reftest-shards) }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install the runner's dependencies
        working-directory: bench
        run: bun install --frozen-lockfile
      # A PATH without zstd: lp-m1 has none, so its cache entries are gzip, and a runner with zstd (GitHub's macOS
      # images) would look for another cache version and miss them.
      - uses: actions/cache@v4
        id: wpt-cache
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        with:
          path: wpt
          key: wpt-${{ hashFiles('bench/wpt/wpt-revision.txt', 'bench/wpt/wpt-paths.txt', 'bench/wpt/fetch-wpt.sh') }}
      - name: Fetch WPT
        if: steps.wpt-cache.outputs.cache-hit != 'true'
        run: bench/wpt/fetch-wpt.sh wpt
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: wpt-browser
      - uses: actions/cache/restore@v4
        if: needs.build.result != 'success'
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        with:
          path: browser.tgz
          key: ${{ needs.prepare.outputs.browser-key }}
          fail-on-cache-miss: true
      - run: tar -xzf browser.tgz
      - name: Run reftest shard ${{ strategy.job-index }} of ${{ strategy.job-total }}
        env:
          SHARD: ${{ strategy.job-index }}/${{ strategy.job-total }}
          RUNNER_ARGS: ${{ inputs.reftest-args }}
          OUT: wpt-reftest-shard-${{ strategy.job-index }}.json
        run: |
          echo "$(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB, macOS $(sw_vers -productVersion)"
          read -r -a extra <<< "$RUNNER_ARGS"
          full=()
          if [ "$FULL" = true ]; then full=(--full); fi
          # Rendering is CPU-bound: one page per CPU. Earlier arguments win, so reftest-args can override --jobs.
          bun bench/wpt/gate.mjs run --kind reftest "${extra[@]}" --wpt wpt --bin browser/pyro --jobs "$(sysctl -n hw.ncpu)" \
            --shard "$SHARD" "${full[@]}" --out "$OUT" --no-check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wpt-reftest-shard-${{ strategy.job-index }}
          path: wpt-reftest-shard-${{ strategy.job-index }}.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # The reftest gate: as `gate`, with --kind reftest (bench/wpt/reftest-baseline.json and reftest-flaky.json).
  reftest-gate:
    needs: [prepare, jsc, build, reftest]
    if: ${{ !cancelled() && inputs.suites != 'testharness' && inputs.suites != 'crashtest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the wpt-accept-loss label
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: wpt-reftest-shard-*
          merge-multiple: true
      - name: Check the reftests against bench/wpt/reftest-baseline.json
        id: check
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          JOBS_BEFORE: 'prepare: ${{ needs.prepare.result }}, jsc: ${{ needs.jsc.result }}, build: ${{ needs.build.result }}, shards: ${{ needs.reftest.result }}'
        run: |
          shopt -s nullglob
          files=(wpt-reftest-shard-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            msg="No reftest shard results, so nothing was checked: the jobs before this one failed or did not run ($JOBS_BEFORE). See their logs."
            echo "::error title=WPT reftest gate::$msg"
            printf '## WPT reftest gate: FAIL\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          args=()
          if [ "$EVENT" = pull_request ]; then
            if git show HEAD^1:bench/wpt/reftest-baseline.json > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null; then
              args+=(--base-baseline "$RUNNER_TEMP/base-baseline.json")
              if git show HEAD^1:bench/wpt/reftest-flaky.json > "$RUNNER_TEMP/base-flaky.json" 2>/dev/null; then
                args+=(--base-flaky "$RUNNER_TEMP/base-flaky.json")
              fi
            fi
            if labels="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name')"; then
              if grep -qx wpt-accept-loss <<< "$labels"; then args+=(--accept-loss); fi
            else
              echo "::warning title=WPT reftest gate::could not read the pull request's labels; checking as if it had none"
            fi
          fi
          bun bench/wpt/gate.mjs check --kind reftest "${files[@]}" --summary "$GITHUB_STEP_SUMMARY" "${args[@]}"
      - name: Refresh the baseline
        id: refresh
        if: ${{ !cancelled() && contains(fromJSON('["pass", "stale", "bootstrap", "rebaseline"]'), steps.check.outputs.verdict) }}
        env:
          DURATIONS: ${{ inputs.durations }}
        run: |
          flags=()
          if [ "$DURATIONS" = true ]; then flags+=(--durations); fi
          bun bench/wpt/gate.mjs update --kind reftest wpt-reftest-shard-*.json --out reftest-baseline.json "${flags[@]}"
          if cmp -s reftest-baseline.json bench/wpt/reftest-baseline.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --no-index --stat bench/wpt/reftest-baseline.json reftest-baseline.json || true
            echo "The refreshed baseline is the \`wpt-reftest-baseline\` artifact: \`gh run download $GITHUB_RUN_ID -n wpt-reftest-baseline -D bench/wpt\`." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.refresh.outputs.changed == 'true' }}
        with:
          name: wpt-reftest-baseline
          path: reftest-baseline.json
          retention-days: 30
          overwrite: true

  # The crashtests: bench/wpt/gate.mjs --kind crashtest, run and checked in one job (about 2,000 pages; the browser
  # and the WPT checkout as the jobs above). One job on lp-m1 rather than a run job and a Linux gate job: the check
  # takes a second, and lp-m1 has git, bun and gh for the base branch's files and the label.
  crashtest:
    needs: [prepare, build]
    if: ${{ !cancelled() && !failure() && inputs.suites != 'testharness' && inputs.suites != 'reftest' }}
    runs-on: lp-m1
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # the wpt-accept-loss label
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
          # A pull request's merge commit and its first parent, the base branch (its baseline and flaky list).
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install the runner's dependencies
        working-directory: bench
        run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        id: wpt-cache
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        with:
          path: wpt
          key: wpt-${{ hashFiles('bench/wpt/wpt-revision.txt', 'bench/wpt/wpt-paths.txt', 'bench/wpt/fetch-wpt.sh') }}
      - name: Fetch WPT
        if: steps.wpt-cache.outputs.cache-hit != 'true'
        run: bench/wpt/fetch-wpt.sh wpt
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: wpt-browser
      - uses: actions/cache/restore@v4
        if: needs.build.result != 'success'
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        with:
          path: browser.tgz
          key: ${{ needs.prepare.outputs.browser-key }}
          fail-on-cache-miss: true
      - run: tar -xzf browser.tgz
      - name: Discovery tests
        run: bun test bench/wpt/crashtest.test.mjs
      - name: Run the crashtests
        env:
          RUNNER_ARGS: ${{ inputs.crashtest-args }}
        run: |
          read -r -a extra <<< "$RUNNER_ARGS"
          full=()
          if [ "$FULL" = true ]; then full=(--full); fi
          # One page per CPU (layout and paint are CPU-bound). Earlier arguments win, so crashtest-args can override.
          bun bench/wpt/gate.mjs run --kind crashtest "${extra[@]}" --wpt wpt --bin browser/pyro --jobs "$(sysctl -n hw.ncpu)" \
            "${full[@]}" --out wpt-crashtest-shard-0.json --no-check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wpt-crashtest-shard-0
          path: wpt-crashtest-shard-0.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Check the crashtests against bench/wpt/crashtest-baseline.json
        id: check
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "$EVENT" = pull_request ]; then
            if git show HEAD^1:bench/wpt/crashtest-baseline.json > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null; then
              args+=(--base-baseline "$RUNNER_TEMP/base-baseline.json")
              if git show HEAD^1:bench/wpt/crashtest-flaky.json > "$RUNNER_TEMP/base-flaky.json" 2>/dev/null; then
                args+=(--base-flaky "$RUNNER_TEMP/base-flaky.json")
              fi
            fi
            if labels="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name')"; then
              if grep -qx wpt-accept-loss <<< "$labels"; then args+=(--accept-loss); fi
            else
              echo "::warning title=WPT crashtest gate::could not read the pull request's labels; checking as if it had none"
            fi
          fi
          bun bench/wpt/gate.mjs check --kind crashtest wpt-crashtest-shard-0.json --summary "$GITHUB_STEP_SUMMARY" "${args[@]}"
      # As the other gates: only from a run that passed, or failed only for a stale or missing baseline. The first
      # run (no baseline anywhere) is the bootstrap: every page ran twice and this artifact is the baseline to commit.
      - name: Refresh the baseline
        id: refresh
        if: ${{ !cancelled() && contains(fromJSON('["pass", "stale", "bootstrap", "rebaseline"]'), steps.check.outputs.verdict) }}
        env:
          DURATIONS: ${{ inputs.durations }}
        run: |
          flags=()
          if [ "$DURATIONS" = true ]; then flags+=(--durations); fi
          bun bench/wpt/gate.mjs update --kind crashtest wpt-crashtest-shard-0.json --out crashtest-baseline.json "${flags[@]}"
          if [ -f bench/wpt/crashtest-baseline.json ] && cmp -s crashtest-baseline.json bench/wpt/crashtest-baseline.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if [ -f bench/wpt/crashtest-baseline.json ]; then git diff --no-index --stat bench/wpt/crashtest-baseline.json crashtest-baseline.json || true; fi
            echo "The refreshed baseline is the \`wpt-crashtest-baseline\` artifact: \`gh run download $GITHUB_RUN_ID -n wpt-crashtest-baseline -D bench/wpt\`." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.refresh.outputs.changed == 'true' }}
        with:
          name: wpt-crashtest-baseline
          path: crashtest-baseline.json
          retention-days: 30
          overwrite: true

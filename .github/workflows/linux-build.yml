name: Linux build

# Builds the render-enabled browser and comparison worker for Linux x64 and
# arm64 with the patched JavaScriptCore linked in (jsc-linux.yml: a
# static archive), bundles the ICU libraries it needs beside the browser
# (scripts/release/bundle-icu-linux.sh), smoke-tests the bundle and runs the
# client's test suite against it.
#
# With `pgo`, the browser is built by scripts/pgo/build.sh: Rust optimized by a
# cdp-perf training run in serve and serve --fork (JavaScriptCore is linked as
# built; its PGO and LTO are macOS-only so far). The comparison worker stays a
# plain release build.
#
# Artifacts: native-linux-<arch> (the npm package's browser) and
# archive-linux-<arch> (the GitHub release archive's binaries).

on:
  workflow_call:
    inputs:
      arch:
        description: Linux architecture (x64 or arm64)
        type: string
        required: true
      jsc-dir:
        description: jsc-linux.yml's `dir` output
        required: true
        type: string
      release:
        description: Build from the release job's stamped manifests and check the version
        type: boolean
        default: false
      version:
        type: string
        default: ''
      pgo:
        description: Build the browser with profile-guided optimization (scripts/pgo/build.sh)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    env:
      CC: clang
      CXX: clang++
      JSC_DIR: ${{ inputs.jsc-dir }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        if: inputs.release
        with:
          name: release-manifests
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: patched-jsc-linux-${{ inputs.arch }}
          path: patched-jsc
      - name: Install build dependencies
        run: scripts/linux/setup.sh
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-registry-${{ inputs.arch }}
          cache-targets: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      # The x64 runner (2 cores, 7.7 GB, about 30 GB free) was lost in this job's PGO build repeatedly since #310
      # ("The hosted runner lost communication with the server", no log kept), each time at the merge of fork
      # mode's training profiles: llvm-profdata on a damaged file, which scripts/pgo/train.sh now leaves out.
      # The rest keeps the machine from being the limit: room on disk (fork mode's raw profiles took 9 GB), swap,
      # the build below the runner process's priority, and memory and disk in the log each minute.
      - name: Scratch disk and swap
        run: |
          avail() { df --output=avail -BG "$1" | tail -1 | tr -dc 0-9; }
          room="$(avail .)"
          swap=/pyro.swap
          # Hosted runners with a temporary disk mount it at /mnt, larger than what the image leaves on /.
          if mountpoint -q /mnt && (( $(avail /mnt) > room )); then
            room="$(avail /mnt)"
            swap=/mnt/pyro.swap
            sudo mkdir -p /mnt/pyro-target
            sudo chown "$(id -u):$(id -g)" /mnt/pyro-target
            # The scripts and the steps below name `target/`: keep the name, move the directory.
            ln -s /mnt/pyro-target target
          fi
          if (( room < 60 )); then
            # Preinstalled SDKs this job does not use.
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
            room="$(avail "$(dirname "$swap")")"
          fi
          # Swap comes out of the disk the build and the raw profiles need.
          size=4
          if (( room >= 60 )); then size=16; elif (( room >= 40 )); then size=8; fi
          sudo fallocate -l "${size}G" "$swap"
          sudo chmod 600 "$swap"
          sudo mkswap "$swap" >/dev/null
          sudo swapon "$swap"
          nproc
          free -h
          df -h . /mnt 2>/dev/null || df -h .
      - name: Build browser and comparison worker against the patched JavaScriptCore
        env:
          # Install the wrapper before enabling it; PGO scripts disable it for profile-sensitive builds.
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
          PGO: ${{ inputs.pgo }}
        run: |
          export PYRO_JSC_DIR="$HOME/.cache/pyro/jsc/$JSC_DIR"
          mkdir -p "$(dirname "$PYRO_JSC_DIR")"
          mv patched-jsc "$PYRO_JSC_DIR"
          # One core stays free for the runner process on machines with four or more.
          cores="$(nproc)"
          if (( cores >= 4 )); then cores=$((cores - 1)); fi
          export CARGO_BUILD_JOBS="$cores"
          # What a lost runner leaves behind is the live log: say each minute how much memory and disk is left.
          mkdir -p target
          (
            while sleep 60; do
              echo "[resources $(date -u +%H:%M:%S)] $(free -m | awk '/^Mem:/{printf "memory available %d MiB", $7} /^Swap:/{printf ", swap used %d MiB", $3}'), disk free $(df --output=avail -BG target/ | tail -1 | tr -d " ")"
            done
          ) &
          monitor=$!
          trap 'pkill -P "$monitor" 2>/dev/null; kill "$monitor" 2>/dev/null || true' EXIT
          if [[ "$PGO" == true ]]; then
            # The builds and the training run below the runner process's priority (the profile counts calls, not time).
            nice -n 10 scripts/pgo/build.sh --locked
            host="$(rustc -vV | sed -n 's/^host: //p')"
            # Free the PGO builds' intermediates (not the binary) before the third release build.
            rm -rf target/pgo/profraw "target/$host/release-pgo/deps" "target/$host/release-pgo/build"
            nice -n 10 cargo +stable build --locked --release --package pyro-render
            cp "target/$host/release-pgo/pyro" target/release/pyro
          else
            nice -n 10 cargo +stable build --locked --release --package pyro --package pyro-render --features render
          fi
      - name: Bundle ICU and check the bundle
        env:
          ARCH: ${{ inputs.arch }}
          VERSION: ${{ inputs.version }}
        run: |
          stage="archive/linux-$ARCH"
          mkdir -p "$stage"
          cp target/release/pyro target/release/pyro-snapshot-compare "$stage/"
          # Release debug information makes the combined npm payload too large.
          # Strip only staged copies; retain symbols and untouched build outputs.
          strip --strip-debug "$stage/pyro" "$stage/pyro-snapshot-compare"
          scripts/release/bundle-icu-linux.sh "$stage"
          ldd "$stage/pyro"
          # JavaScriptCore is inside the browser, and its ICU is the bundled one.
          # (`! pipeline` would not stop the step: errexit ignores a negated command.)
          if ldd "$stage/pyro" | grep -F libJavaScriptCore; then exit 1; fi
          ldd "$stage/pyro" | grep -F "$PWD/$stage/lib/libicuuc.so"
          if ldd "$stage/pyro" | grep -E 'not found|/usr/lib/.*libicu'; then exit 1; fi
          "$stage/pyro" version
          "$stage/pyro" version | grep -q 'fork: true'
          if [[ -n "$VERSION" ]]; then
            "$stage/pyro" version | grep -Fx "pyro $VERSION"
          fi
          "$stage/pyro" eval -e 'console.log("linux-smoke-ok")' | grep -Fx linux-smoke-ok
          mkdir -p "native/linux-$ARCH/lib"
          cp "$stage/pyro" "native/linux-$ARCH/"
          cp "$stage"/lib/* "native/linux-$ARCH/lib/"
          # The npm copy has no symbol table (the registry rejects a 195 MiB package); the release archive keeps it.
          strip --strip-all "native/linux-$ARCH/pyro"
          "native/linux-$ARCH/pyro" eval -e 'console.log("linux-smoke-ok")' | grep -Fx linux-smoke-ok
      - name: Test the client against the bundled browser
        env:
          ARCH: ${{ inputs.arch }}
        working-directory: packages/pyro
        run: |
          bun install --frozen-lockfile
          bun run build
          PYRO_BIN="$GITHUB_WORKSPACE/archive/linux-$ARCH/pyro" bun test ./test
      - name: PGO training logs
        if: always() && inputs.pgo
        uses: actions/upload-artifact@v4
        with:
          name: pgo-training-logs-linux-${{ inputs.arch }}
          path: target/pgo/*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-${{ inputs.arch }}
          path: native/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: archive-linux-${{ inputs.arch }}
          path: archive/linux-${{ inputs.arch }}/
          if-no-files-found: error
          retention-days: 7

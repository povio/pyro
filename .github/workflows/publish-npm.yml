name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Serialize releases so two publishes cannot race when updating npm dist-tags.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - run: node --test scripts/npm/release.test.mjs
      - name: Stamp release versions from the Git tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/npm/release.mjs "$RELEASE_TAG" --write
      - name: Update workspace versions in the Rust lockfile
        run: cargo +stable update --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifests
          path: |
            Cargo.toml
            Cargo.lock
            packages/pyro/package.json
          if-no-files-found: error
          retention-days: 7

  # Both on the self-hosted Apple Silicon runner (label lp-m1): the Intel build is
  # cross-compiled there and runs under Rosetta 2.
  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            lipo: arm64
          - arch: x64
            target: x86_64-apple-darwin
            lipo: x86_64
    runs-on: lp-m1
    timeout-minutes: 60
    env:
      PYRO_JSC: system
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      # That Mac's newest SDK is one its linker cannot read; see jsc.yml.
      SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: .
      - name: Install Rust
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add --toolchain stable "$RUST_TARGET"
      # The Intel browser's checks below run it, which needs Rosetta 2 on the runner.
      - name: Check Rosetta 2
        if: matrix.arch == 'x64'
        run: |
          arch -x86_64 /usr/bin/true || {
            echo "::error::Rosetta 2 is not installed on this runner: sudo softwareupdate --install-rosetta --agree-to-license"
            exit 1
          }
      # OpenH264's x86-64 assembly (the default h264 feature) is assembled with NASM; without it, plain C.
      - name: Install NASM
        if: matrix.arch == 'x64'
        run: command -v nasm >/dev/null || brew install nasm
      - name: Build browser with rendering, and the comparison worker
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: cargo +stable build --locked --release --package pyro --package pyro-render --features render --target "$RUST_TARGET"
      - name: Verify and stage binary
        env:
          ARCH: ${{ matrix.arch }}
          LIPO_ARCH: ${{ matrix.lipo }}
          RUST_TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          binary="target/$RUST_TARGET/release/pyro"
          lipo -archs "$binary" | grep -qx "$LIPO_ARCH"
          codesign --verify --strict "$binary"
          codesign -d --entitlements - "$binary" 2>/dev/null | grep -q com.apple.security.cs.allow-jit
          otool -L "$binary"
          "$binary" version | grep -Fx "pyro $VERSION"
          "$binary" eval -e 'console.log("npm-smoke-ok")' | grep -Fx npm-smoke-ok
          mkdir -p "native/darwin-$ARCH"
          cp "$binary" "native/darwin-$ARCH/pyro"
          comparator="target/$RUST_TARGET/release/pyro-snapshot-compare"
          codesign --verify --strict "$comparator"
          mkdir -p "archive/$ARCH"
          cp "$binary" "$comparator" "archive/$ARCH/"
      # The npm package's Intel browser. Its arm64 browser is the fork build
      # with its patched JavaScriptCore (the `fork` job).
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64'
        with:
          name: native-${{ matrix.arch }}
          path: native/
          if-no-files-found: error
          retention-days: 7
      # The GitHub release archive's binaries (the npm package takes only the browser).
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.arch }}
          path: archive/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  jsc:
    uses: ./.github/workflows/jsc.yml

  # The fork variant: the same browser linked against the patched JavaScriptCore,
  # built with profile-guided optimization (.github/actions/pgo-build; the
  # comparison worker is a plain release build).
  fork:
    needs: [release, jsc]
    # The self-hosted Apple Silicon runner (label lp-m1), as pgo.yml.
    runs-on: lp-m1
    timeout-minutes: 150
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      # That Mac's newest SDK is one its linker cannot read; see jsc.yml.
      SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: patched-jsc
          path: patched-jsc
      - name: Build browser (PGO)
        uses: ./.github/actions/pgo-build
      - name: Build comparison worker against the patched JavaScriptCore
        env:
          JSC_DIR: ${{ needs.jsc.outputs.dir }}
        run: |
          export PYRO_JSC_DIR="$HOME/Library/Caches/pyro/jsc/$JSC_DIR"
          mkdir -p "$(dirname "$PYRO_JSC_DIR")"
          # The runner keeps its home between jobs, and the jsc job leaves this build there: replace it with the
          # artifact the release ships (mv would move the artifact inside it, or fail once it is there).
          rm -rf "$PYRO_JSC_DIR"
          mv patched-jsc "$PYRO_JSC_DIR"
          cargo +stable build --locked --release --package pyro-render
          cp target/aarch64-apple-darwin/release-pgo/pyro target/release/pyro
      - name: Verify and stage binaries
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          binary=target/release/pyro
          codesign --verify --strict "$binary"
          # The patched JavaScriptCore is inside the browser (a static archive): no library of that name is loaded.
          if otool -L "$binary" | grep -F JavaScriptCore; then exit 1; fi
          codesign -d --entitlements - "$binary" 2>/dev/null | grep -q com.apple.security.cs.allow-jit
          "$binary" version | grep -Fx "pyro $VERSION"
          "$binary" version | grep -q 'fork: true'
          mkdir -p archive/fork
          cp "$binary" target/release/pyro-snapshot-compare archive/fork/
      - name: Stage the browser for the npm package
        run: |
          mkdir -p native/darwin-arm64
          cp target/release/pyro native/darwin-arm64/
          codesign --verify --strict native/darwin-arm64/pyro
          native/darwin-arm64/pyro version | grep -q 'fork: true'
      - uses: actions/upload-artifact@v4
        with:
          name: archive-fork
          path: archive/fork/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: native-arm64
          path: native/
          if-no-files-found: error
          retention-days: 7

  # Linux x64 and arm64, both linked against the patched JavaScriptCore and
  # shipping it (and its ICU) beside the browser.
  linux:
    needs: [release, jsc]
    uses: ./.github/workflows/linux-build.yml
    with:
      jsc-dir: ${{ needs.jsc.outputs.dir }}
      release: true
      version: ${{ needs.release.outputs.version }}
      pgo: true

  # The JavaScriptCore source asset and the notices the fork archive ships.
  jsc-source:
    needs: release
    runs-on: lp-m1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Export the patched sparse WebKit tree
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: scripts/release/jsc-source.sh "$VERSION" "$GITHUB_SHA" jsc-source
      - uses: actions/upload-artifact@v4
        with:
          name: jsc-source
          path: jsc-source/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [release, build, fork, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: .
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: packages/pyro/native
      - name: Install build dependencies
        working-directory: packages/pyro
        run: bun install --frozen-lockfile
      - name: Build and pack
        working-directory: packages/pyro
        run: |
          mkdir -p ../../npm-package
          npm pack --pack-destination ../../npm-package
          # Our compressed-payload budget, not a registry API guarantee. npm
          # expands the tarball to base64 in its publication request.
          node --input-type=module -e '
            import { readdirSync, statSync } from "node:fs";
            const dir = "../../npm-package";
            for (const file of readdirSync(dir).filter(file => file.endsWith(".tgz"))) {
              const size = statSync(`${dir}/${file}`).size;
              console.log(`${file}: ${size} compressed bytes`);
              if (size > 150 * 1024 * 1024) throw new Error("npm tarball exceeds the 150 MiB release budget");
            }
          '
          bun test test/binary.test.ts
      - name: Verify client import on Linux
        run: |
          mkdir "$RUNNER_TEMP/npm-client"
          cd "$RUNNER_TEMP/npm-client"
          npm init -y
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/npm-package/*.tgz
          node --input-type=module -e 'import { Pyro, button, check } from "@povio/pyro"; if (![Pyro, button, check].every(x => typeof x === "function")) process.exit(1);'
          cp "$GITHUB_WORKSPACE/scripts/npm/types.mts" .
          node "$GITHUB_WORKSPACE/packages/pyro/node_modules/typescript/bin/tsc" types.mts --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022 --lib ES2022,DOM,ESNext.Disposable --typeRoots "$GITHUB_WORKSPACE/packages/pyro/node_modules/@types"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # The installed package on each platform. macOS runs on the self-hosted Apple
  # Silicon runner (label lp-m1): the Intel leg with x64 Node and Bun under
  # Rosetta 2, so the package picks its darwin-x64 browser (by process.arch).
  # The macOS arm64 and both Linux browsers are fork builds; the macOS Intel one
  # uses system JavaScriptCore.
  smoke:
    needs: package
    name: smoke (${{ matrix.runner }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: lp-m1
            arch: arm64
            fork: true
          - runner: lp-m1
            arch: x64
            fork: false
          - runner: ubuntu-24.04
            arch: x64
            fork: true
          - runner: ubuntu-24.04-arm
            arch: arm64
            fork: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check Rosetta 2
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        run: |
          arch -x86_64 /usr/bin/true || {
            echo "::error::Rosetta 2 is not installed on this runner: sudo softwareupdate --install-rosetta --agree-to-license"
            exit 1
          }
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      # setup-bun installs the runner's own architecture into ~/.bun, which the
      # self-hosted runner keeps between jobs: the x64 Bun goes to this job's
      # temporary directory instead (emptied at the start and end of each job).
      - name: x64 Bun
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        env:
          BUN_VERSION: '1.4.0'
        run: |
          asset=bun-darwin-x64-baseline
          dir="$RUNNER_TEMP/bun-x64"
          mkdir -p "$dir"
          cd "$dir"
          base="https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION"
          curl -fsSLO --retry 3 "$base/$asset.zip"
          curl -fsSLO --retry 3 "$base/SHASUMS256.txt"
          grep " $asset.zip\$" SHASUMS256.txt > "$asset.sha256"
          shasum -a 256 -c "$asset.sha256"
          unzip -q "$asset.zip"
          echo "$dir/$asset" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package
      - name: Test installed CLI and API with Node and Bun
        env:
          ARCH: ${{ matrix.arch }}
          FORK: ${{ matrix.fork }}
        run: |
          # The leg tests the browser of its architecture only if Node and Bun run as that architecture.
          node_arch="$(node -p process.arch)"
          bun_arch="$(bun -e 'console.log(process.arch)')"
          if [[ "$node_arch" != "$ARCH" || "$bun_arch" != "$ARCH" ]]; then
            echo "::error::Node runs as $node_arch and Bun as $bun_arch, not $ARCH"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          npm init -y
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/npm-package/*.tgz
          ./node_modules/.bin/pyro version
          ./node_modules/.bin/pyro version | grep -q "fork: $FORK"
          node "$GITHUB_WORKSPACE/scripts/npm/smoke.mjs"
          bun "$GITHUB_WORKSPACE/scripts/npm/smoke.mjs"

  # The GitHub release: the three platform archives, the client, the
  # JavaScriptCore source and checksums (docs/RELEASING.md), assembled from the
  # builds above and tested from their extracted form before upload.
  github-release:
    needs: [release, build, fork, linux, jsc, jsc-source, package, smoke]
    runs-on: lp-m1
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/download-artifact@v4
        with:
          name: archive-arm64
          path: release-in/arm64
      - uses: actions/download-artifact@v4
        with:
          name: archive-x64
          path: release-in/x64
      - uses: actions/download-artifact@v4
        with:
          name: archive-fork
          path: release-in/fork
      - uses: actions/download-artifact@v4
        with:
          name: archive-linux-x64
          path: release-in/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: archive-linux-arm64
          path: release-in/linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: patched-jsc
          path: release-in/jsc
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-in
      - uses: actions/download-artifact@v4
        with:
          name: jsc-source
          path: jsc-source
      - name: Assemble and check the archives
        run: |
          chmod +x release-in/*/pyro release-in/*/pyro-snapshot-compare
          mkdir release-out
          mv "jsc-source/pyro-jsc-source-v$VERSION.tar.gz" release-out/
          mv jsc-source/jsc-licenses release-in/
          scripts/release/assemble.sh "$VERSION" "$GITHUB_SHA" release-in release-out
      - name: Test the client against the extracted browsers
        run: |
          mkdir "$RUNNER_TEMP/extracted"
          for f in release-out/pyro-rust-v"$VERSION"-macos-arm64*.tar.gz; do tar xzf "$f" -C "$RUNNER_TEMP/extracted"; done
          cd packages/pyro
          bun install --frozen-lockfile
          # The CLI tests run the built client.
          bun run build
          # Everything, fork mode included.
          PYRO_BIN="$RUNNER_TEMP/extracted/pyro-rust-v$VERSION-macos-arm64-fork/pyro" bun test ./test
          # The standard build has no fork mode.
          PYRO_BIN="$RUNNER_TEMP/extracted/pyro-rust-v$VERSION-macos-arm64/pyro" bun test test/binary.test.ts test/screenshot.test.ts
      - name: Publish the GitHub release
        env:
          TAG: ${{ github.ref_name }}
          DIST_TAG: ${{ needs.release.outputs.dist-tag }}
        run: |
          assets=(release-out/*.tar.gz release-out/*.tgz release-out/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: replace the assets, keep the notes.
            gh release upload "$TAG" --clobber "${assets[@]}"
          else
            prerelease=()
            [[ "$DIST_TAG" == next ]] && prerelease=(--prerelease)
            gh release create "$TAG" --verify-tag --title "Pyro $TAG" --generate-notes "${prerelease[@]}" "${assets[@]}"
          fi
      - name: Verify the uploaded assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir "$RUNNER_TEMP/downloaded"
          cd "$RUNNER_TEMP/downloaded"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          shasum -a 256 -c SHA256SUMS.txt

  publish:
    # The extracted fork archive runs the complete SDK regression suite.
    # Do not publish an immutable npm version before those checks pass.
    needs: [release, smoke, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package
      - name: Publish the tested tarball
        env:
          DIST_TAG: ${{ needs.release.outputs.dist-tag }}
          # Optional bootstrap token; omit after configuring npm trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # The ./ prefix makes npm treat this as a local tarball, not owner/repo.
        run: npm publish ./npm-package/*.tgz --access public --tag "$DIST_TAG"

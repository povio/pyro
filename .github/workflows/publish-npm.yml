name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Serialize releases so two publishes cannot race when updating npm dist-tags.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - run: node --test scripts/npm/release.test.mjs
      - name: Stamp release versions from the Git tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/npm/release.mjs "$RELEASE_TAG" --write
      - name: Update workspace versions in the Rust lockfile
        run: cargo +stable update --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifests
          path: |
            Cargo.toml
            Cargo.lock
            packages/lightning-panda/package.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      LP_JSC: system
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: .
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Build browser with rendering, and the comparison worker
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: cargo +stable build --locked --release --package lightningpanda --package lp-render --features render --target "$RUST_TARGET"
      - name: Verify and stage binary
        env:
          ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          binary="target/$RUST_TARGET/release/lightningpanda"
          codesign --verify --strict "$binary"
          codesign -d --entitlements - "$binary" 2>/dev/null | grep -q com.apple.security.cs.allow-jit
          otool -L "$binary"
          "$binary" version | grep -Fx "lightningpanda $VERSION"
          "$binary" eval -e 'console.log("npm-smoke-ok")' | grep -Fx npm-smoke-ok
          mkdir -p "native/darwin-$ARCH"
          cp "$binary" "native/darwin-$ARCH/lightningpanda"
          comparator="target/$RUST_TARGET/release/lp-snapshot-compare"
          codesign --verify --strict "$comparator"
          mkdir -p "archive/$ARCH"
          cp "$binary" "$comparator" "archive/$ARCH/"
      # The npm package's Intel browser. Its arm64 browser is the fork build
      # with its patched JavaScriptCore (the `fork` job).
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64'
        with:
          name: native-${{ matrix.arch }}
          path: native/
          if-no-files-found: error
          retention-days: 7
      # The GitHub release archive's binaries (the npm package takes only the browser).
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.arch }}
          path: archive/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  jsc:
    uses: ./.github/workflows/jsc.yml

  # The fork variant: the same browser linked against the patched JavaScriptCore.
  fork:
    needs: [release, jsc]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: patched-jsc
          path: patched-jsc
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Build browser and comparison worker against the patched JavaScriptCore
        env:
          JSC_DIR: ${{ needs.jsc.outputs.dir }}
        run: |
          # At the path it was built at: its install name is absolute.
          export LP_JSC_DIR="$HOME/Library/Caches/lightningpanda/jsc/$JSC_DIR"
          mkdir -p "$(dirname "$LP_JSC_DIR")"
          mv patched-jsc "$LP_JSC_DIR"
          cargo +stable build --locked --release --package lightningpanda --package lp-render --features render
      - name: Verify and stage binaries
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          binary=target/release/lightningpanda
          codesign --verify --strict "$binary"
          otool -L "$binary" | grep libJavaScriptCore.dylib
          "$binary" version | grep -Fx "lightningpanda $VERSION"
          "$binary" version | grep -q 'fork: true'
          mkdir -p archive/fork
          cp "$binary" target/release/lp-snapshot-compare archive/fork/
      - name: Bundle the patched JavaScriptCore for the npm package
        env:
          JSC_DIR: ${{ needs.jsc.outputs.dir }}
        run: |
          mkdir -p native/darwin-arm64
          cp target/release/lightningpanda native/darwin-arm64/
          scripts/release/bundle-jsc.sh native/darwin-arm64 "$HOME/Library/Caches/lightningpanda/jsc/$JSC_DIR/lib/libJavaScriptCore.dylib"
          # Moved, so nothing can load the build cache's copy instead.
          mv "$HOME/Library/Caches/lightningpanda/jsc/$JSC_DIR" "$RUNNER_TEMP/jsc-moved"
          native/darwin-arm64/lightningpanda version | grep -q 'fork: true'
          DYLD_PRINT_LIBRARIES=1 native/darwin-arm64/lightningpanda eval -e 1 2>&1 | grep libJavaScriptCore \
            | grep -q "$PWD/native/darwin-arm64/lib/libJavaScriptCore.dylib"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-fork
          path: archive/fork/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: native-arm64
          path: native/
          if-no-files-found: error
          retention-days: 7

  # The JavaScriptCore source asset and the notices the fork archive ships.
  jsc-source:
    needs: release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Export the patched sparse WebKit tree
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: scripts/release/jsc-source.sh "$VERSION" "$GITHUB_SHA" jsc-source
      - uses: actions/upload-artifact@v4
        with:
          name: jsc-source
          path: jsc-source/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [release, build, fork]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: .
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: packages/lightning-panda/native
      - name: Install build dependencies
        working-directory: packages/lightning-panda
        run: bun install --frozen-lockfile
      - name: Build and pack
        working-directory: packages/lightning-panda
        run: |
          mkdir -p ../../npm-package
          npm pack --pack-destination ../../npm-package
          bun test test/binary.test.ts
      - name: Verify client import on Linux
        run: |
          mkdir "$RUNNER_TEMP/npm-client"
          cd "$RUNNER_TEMP/npm-client"
          npm init -y
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/npm-package/*.tgz
          node --input-type=module -e 'import { Lightningpanda, button, check } from "@povio/lightning-panda"; if (![Lightningpanda, button, check].every(x => typeof x === "function")) process.exit(1);'
          cp "$GITHUB_WORKSPACE/scripts/npm/types.mts" .
          node "$GITHUB_WORKSPACE/packages/lightning-panda/node_modules/typescript/bin/tsc" types.mts --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022 --lib ES2022,DOM,ESNext.Disposable --typeRoots "$GITHUB_WORKSPACE/packages/lightning-panda/node_modules/@types"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package
      - name: Test installed CLI and API with Node and Bun
        run: |
          mkdir "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          npm init -y
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/npm-package/*.tgz
          ./node_modules/.bin/lightningpanda version
          # The arm64 browser is the fork build; the Intel one uses system JavaScriptCore.
          want=false
          [[ "$(uname -m)" == arm64 ]] && want=true
          ./node_modules/.bin/lightningpanda version | grep -q "fork: $want"
          node "$GITHUB_WORKSPACE/scripts/npm/smoke.mjs"
          bun "$GITHUB_WORKSPACE/scripts/npm/smoke.mjs"

  # The GitHub release: the three platform archives, the client, the
  # JavaScriptCore source and checksums (docs/RELEASING.md), assembled from the
  # builds above and tested from their extracted form before upload.
  github-release:
    needs: [release, build, fork, jsc, jsc-source, package, smoke]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/download-artifact@v4
        with:
          name: archive-arm64
          path: release-in/arm64
      - uses: actions/download-artifact@v4
        with:
          name: archive-x64
          path: release-in/x64
      - uses: actions/download-artifact@v4
        with:
          name: archive-fork
          path: release-in/fork
      - uses: actions/download-artifact@v4
        with:
          name: patched-jsc
          path: release-in/jsc
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-in
      - uses: actions/download-artifact@v4
        with:
          name: jsc-source
          path: jsc-source
      - name: Assemble and check the archives
        run: |
          chmod +x release-in/*/lightningpanda release-in/*/lp-snapshot-compare
          mkdir release-out
          mv "jsc-source/lightningpanda-jsc-source-v$VERSION.tar.gz" release-out/
          mv jsc-source/jsc-licenses release-in/
          scripts/release/assemble.sh "$VERSION" "$GITHUB_SHA" release-in release-out
      - name: Test the client against the extracted browsers
        run: |
          mkdir "$RUNNER_TEMP/extracted"
          for f in release-out/lightningpanda-rust-v"$VERSION"-macos-arm64*.tar.gz; do tar xzf "$f" -C "$RUNNER_TEMP/extracted"; done
          cd packages/lightning-panda
          bun install --frozen-lockfile
          # Everything, fork mode included.
          LIGHTNINGPANDA_BIN="$RUNNER_TEMP/extracted/lightningpanda-rust-v$VERSION-macos-arm64-fork/lightningpanda" bun test ./test
          # The standard build has no fork mode.
          LIGHTNINGPANDA_BIN="$RUNNER_TEMP/extracted/lightningpanda-rust-v$VERSION-macos-arm64/lightningpanda" bun test test/binary.test.ts test/screenshot.test.ts
      - name: Publish the GitHub release
        env:
          TAG: ${{ github.ref_name }}
          DIST_TAG: ${{ needs.release.outputs.dist-tag }}
        run: |
          assets=(release-out/*.tar.gz release-out/*.tgz release-out/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: replace the assets, keep the notes.
            gh release upload "$TAG" --clobber "${assets[@]}"
          else
            prerelease=()
            [[ "$DIST_TAG" == next ]] && prerelease=(--prerelease)
            gh release create "$TAG" --verify-tag --title "Rust Lightpanda $TAG" --generate-notes "${prerelease[@]}" "${assets[@]}"
          fi
      - name: Verify the uploaded assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir "$RUNNER_TEMP/downloaded"
          cd "$RUNNER_TEMP/downloaded"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          shasum -a 256 -c SHA256SUMS.txt

  publish:
    needs: [release, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package
      - name: Publish the tested tarball
        env:
          DIST_TAG: ${{ needs.release.outputs.dist-tag }}
          # Optional bootstrap token; omit after configuring npm trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # The ./ prefix makes npm treat this as a local tarball, not owner/repo.
        run: npm publish ./npm-package/*.tgz --access public --tag "$DIST_TAG"

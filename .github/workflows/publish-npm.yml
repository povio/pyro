name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Serialize releases so two publishes cannot race when updating npm dist-tags.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - run: bun test --timeout 30000 scripts/npm/release.test.mjs
      - name: Stamp release versions from the Git tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/npm/release.mjs "$RELEASE_TAG" --write
      - name: Update workspace versions in the Rust lockfile
        run: cargo +stable update --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifests
          path: |
            Cargo.toml
            Cargo.lock
            packages/pyro/package.json
          if-no-files-found: error
          retention-days: 7

  # Both on the self-hosted Apple Silicon runner (label lp-m1): the Intel build is
  # cross-compiled there. lp-m1 has no Rosetta 2, so the Intel browser first runs
  # in the smoke job, on GitHub's Intel runner.
  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            lipo: arm64
          - arch: x64
            target: x86_64-apple-darwin
            lipo: x86_64
    runs-on: lp-m1
    timeout-minutes: 60
    env:
      PYRO_JSC: system
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      # That Mac's newest SDK is one its linker cannot read; see jsc.yml.
      SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: .
      - name: Install Rust
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add --toolchain stable "$RUST_TARGET"
      # libjpeg-turbo's x86-64 SIMD and OpenH264's x86-64 assembly are assembled with NASM; without it both build as
      # plain C, with no error. lp-m1 has neither NASM nor Homebrew: build the release Homebrew's formula pins (same
      # checksum), a host tool, into this job's temporary directory.
      - name: NASM
        if: matrix.arch == 'x64'
        env:
          NASM_VERSION: '3.02'
          NASM_SHA256: 87336eba53b4acfe917424ab5d500d2b0054d9f5148d35c2273ccf2cfb712f0d
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO --retry 3 "https://www.nasm.us/pub/nasm/releasebuilds/$NASM_VERSION/nasm-$NASM_VERSION.tar.xz"
          echo "$NASM_SHA256  nasm-$NASM_VERSION.tar.xz" > nasm.sha256
          shasum -a 256 -c nasm.sha256
          tar -xJf "nasm-$NASM_VERSION.tar.xz"
          cd "nasm-$NASM_VERSION"
          ./configure --quiet
          make -j"${PYRO_CI_CPUS:-$(sysctl -n hw.ncpu)}" nasm
          ./nasm -v
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Build browser with rendering, and the comparison worker
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: cargo +stable build --locked --release --package pyro --package pyro-render --features render --target "$RUST_TARGET"
      - name: Verify and stage binary
        env:
          ARCH: ${{ matrix.arch }}
          LIPO_ARCH: ${{ matrix.lipo }}
          RUST_TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          binary="target/$RUST_TARGET/release/pyro"
          lipo -archs "$binary" | grep -qx "$LIPO_ARCH"
          codesign --verify --strict "$binary"
          codesign -d --entitlements - "$binary" 2>/dev/null | grep -q com.apple.security.cs.allow-jit
          otool -L "$binary"
          # NASM's output is in the binary, not the plain C the build scripts fall back to with no error:
          # libjpeg-turbo's AVX2 colour conversion and OpenH264's SSSE3 deblocking.
          if [ "$ARCH" = x64 ]; then
            nm "$binary" > "$RUNNER_TEMP/symbols.txt"
            for symbol in '_jsimd_rgb_ycc_convert_avx2$' '_DeblockLumaLt4V_ssse3$'; do
              grep -qE " [Tt] $symbol" "$RUNNER_TEMP/symbols.txt" || { echo "::error::$symbol is missing: built without NASM?"; exit 1; }
            done
          fi
          # The Intel browser cannot run here (no Rosetta 2); the smoke job's Intel leg runs it.
          if [ "$ARCH" = arm64 ]; then
            "$binary" version | grep -Fx "pyro $VERSION"
            "$binary" eval -e 'console.log("npm-smoke-ok")' | grep -Fx npm-smoke-ok
          fi
          mkdir -p "native/darwin-$ARCH"
          cp "$binary" "native/darwin-$ARCH/pyro"
          # The npm copy has no symbol table (the registry rejects a 195 MiB package with 413); the release
          # archive keeps the symbols. Stripping drops the signature, so sign again with the JIT entitlement.
          strip "native/darwin-$ARCH/pyro"
          codesign --force --sign - --entitlements scripts/macos/jit.entitlements "native/darwin-$ARCH/pyro"
          codesign --verify --strict "native/darwin-$ARCH/pyro"
          codesign -d --entitlements - "native/darwin-$ARCH/pyro" 2>/dev/null | grep -q com.apple.security.cs.allow-jit
          # Every section's contents unchanged by strip and signing; the Intel copy cannot run here (no Rosetta 2).
          python3 scripts/release/same-code.py "$binary" "native/darwin-$ARCH/pyro"
          if [ "$ARCH" = arm64 ]; then
            "native/darwin-$ARCH/pyro" eval -e 'console.log("npm-smoke-ok")' | grep -Fx npm-smoke-ok
          fi
          comparator="target/$RUST_TARGET/release/pyro-snapshot-compare"
          codesign --verify --strict "$comparator"
          mkdir -p "archive/$ARCH"
          cp "$binary" "$comparator" "archive/$ARCH/"
      # The npm package's Intel browser. Its arm64 browser is the fork build
      # with its patched JavaScriptCore (the `fork` job).
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64'
        with:
          name: native-${{ matrix.arch }}
          path: native/
          if-no-files-found: error
          retention-days: 7
      # The GitHub release archive's binaries (the npm package takes only the browser).
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.arch }}
          path: archive/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  jsc:
    uses: ./.github/workflows/jsc.yml

  # The fork variant: the same browser linked against the patched JavaScriptCore,
  # built with profile-guided optimization (.github/actions/pgo-build; the
  # comparison worker is a plain release build).
  fork:
    needs: [release, jsc]
    # The self-hosted Apple Silicon runner (label lp-m1), as pgo.yml.
    runs-on: lp-m1
    timeout-minutes: 150
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      # That Mac's newest SDK is one its linker cannot read; see jsc.yml.
      SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: patched-jsc
          path: patched-jsc
      - name: Build browser (PGO)
        uses: ./.github/actions/pgo-build
      - name: Build comparison worker against the patched JavaScriptCore
        run: |
          # Keep the artifact local to this job; other runners may share this Mac's home directory.
          export PYRO_JSC_DIR="$GITHUB_WORKSPACE/patched-jsc"
          cargo +stable build --locked --release --package pyro-render
          cp target/aarch64-apple-darwin/release-pgo/pyro target/release/pyro
      - name: Verify and stage binaries
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          binary=target/release/pyro
          codesign --verify --strict "$binary"
          # The patched JavaScriptCore is inside the browser (a static archive): no library of that name is loaded.
          if otool -L "$binary" | grep -F JavaScriptCore; then exit 1; fi
          codesign -d --entitlements - "$binary" 2>/dev/null | grep -q com.apple.security.cs.allow-jit
          "$binary" version | grep -Fx "pyro $VERSION"
          "$binary" version | grep -q 'fork: true'
          mkdir -p archive/fork
          cp "$binary" target/release/pyro-snapshot-compare archive/fork/
      - name: Stage the browser for the npm package
        run: |
          mkdir -p native/darwin-arm64
          cp target/release/pyro native/darwin-arm64/
          # No symbol table in the npm copy (see the build job); archive-fork keeps it.
          strip native/darwin-arm64/pyro
          codesign --force --sign - --entitlements scripts/macos/jit.entitlements native/darwin-arm64/pyro
          codesign --verify --strict native/darwin-arm64/pyro
          codesign -d --entitlements - native/darwin-arm64/pyro 2>/dev/null | grep -q com.apple.security.cs.allow-jit
          python3 scripts/release/same-code.py target/release/pyro native/darwin-arm64/pyro
          native/darwin-arm64/pyro version | grep -q 'fork: true'
          native/darwin-arm64/pyro eval -e 'console.log("npm-smoke-ok")' | grep -Fx npm-smoke-ok
      - uses: actions/upload-artifact@v4
        with:
          name: archive-fork
          path: archive/fork/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: native-arm64
          path: native/
          if-no-files-found: error
          retention-days: 7

  # Linux x64 and arm64, both linked against the patched JavaScriptCore and
  # shipping it (and its ICU) beside the browser.
  linux-x64:
    needs: release
    uses: ./.github/workflows/linux-platform.yml
    with:
      arch: x64
      release: true
      version: ${{ needs.release.outputs.version }}
      pgo: true

  linux-arm64:
    needs: release
    uses: ./.github/workflows/linux-platform.yml
    with:
      arch: arm64
      release: true
      version: ${{ needs.release.outputs.version }}
      pgo: true

  # The JavaScriptCore source asset and the notices the fork archive ships.
  jsc-source:
    needs: release
    runs-on: lp-m1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Export the patched sparse WebKit tree
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: scripts/release/jsc-source.sh "$VERSION" "$GITHUB_SHA" jsc-source
      - uses: actions/upload-artifact@v4
        with:
          name: jsc-source
          path: jsc-source/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [release, build, fork, linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: .
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: packages/pyro/native
      - name: Install build dependencies
        working-directory: packages/pyro
        run: bun install --frozen-lockfile
      - name: Build and pack
        working-directory: packages/pyro
        run: |
          mkdir -p ../../npm-package
          npm pack --pack-destination ../../npm-package
          # npm pack compresses at a low level; gzip -9 makes the same tarball ~6 MB smaller.
          for file in ../../npm-package/*.tgz; do
            gzip -dc "$file" | gzip -9 -n > "$file.9" && mv "$file.9" "$file"
            tar -tzf "$file" > /dev/null
          done
          # Our compressed-payload budget. npm sends the tarball base64-encoded in one request: the registry accepted
          # 195,675,050 bytes (0.0.50-rc.6) and rejected 204,910,000 bytes with 413 Payload Too Large (0.0.50-rc.8).
          # 185 MiB stays under the largest size known to be accepted.
          bun --eval '
            import { readdirSync, statSync } from "node:fs";
            const dir = "../../npm-package";
            for (const file of readdirSync(dir).filter(file => file.endsWith(".tgz"))) {
              const size = statSync(`${dir}/${file}`).size;
              console.log(`${file}: ${size} compressed bytes`);
              if (size > 185 * 1024 * 1024) throw new Error("npm tarball exceeds the 185 MiB release budget");
            }
          '
          bun test test/binary.test.ts
      - name: Verify client import on Linux
        run: |
          mkdir "$RUNNER_TEMP/npm-client"
          cd "$RUNNER_TEMP/npm-client"
          npm init -y
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/npm-package/*.tgz
          node --input-type=module -e 'import { Pyro, button, check } from "@povio/pyro"; if (![Pyro, button, check].every(x => typeof x === "function")) process.exit(1);'
          cp "$GITHUB_WORKSPACE/scripts/npm/types.mts" .
          bun "$GITHUB_WORKSPACE/packages/pyro/node_modules/typescript/bin/tsc" types.mts --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022 --lib ES2022,DOM,ESNext.Disposable --typeRoots "$GITHUB_WORKSPACE/packages/pyro/node_modules/@types"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Test the installed package on macOS arm64 using the self-hosted Apple Silicon
  # runner (label lp-m1), and on Linux x64 and arm64. All three use fork builds.
  smoke:
    needs: package
    name: smoke (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: lp-m1
            arch: arm64
            fork: true
          - runner: ubuntu-24.04
            arch: x64
            fork: true
          - runner: ubuntu-24.04-arm
            arch: arm64
            fork: true
    runs-on: ${{ matrix.runner }}
    # A slow artifact transfer must not consume the installed-package test's entire budget.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/download-artifact@v4
        timeout-minutes: 15
        with:
          name: npm-package
          path: npm-package
      - name: Test installed CLI and API with Node and Bun
        timeout-minutes: 5
        env:
          ARCH: ${{ matrix.arch }}
          FORK: ${{ matrix.fork }}
          # npm caches the installed tarball (about 150 MB): in the job's temporary directory, not lp-m1's home.
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          # The package picks its browser by process.arch: the leg tests its own architecture only if both run as it.
          node_arch="$(node -p process.arch)"
          bun_arch="$(bun -e 'console.log(process.arch)')"
          if [[ "$node_arch" != "$ARCH" || "$bun_arch" != "$ARCH" ]]; then
            echo "::error::Node runs as $node_arch and Bun as $bun_arch, not $ARCH"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          npm init -y
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/npm-package/*.tgz
          version="$(bun -e 'console.log(require("./node_modules/@povio/pyro/package.json").version)')"
          ./node_modules/.bin/pyro version
          ./node_modules/.bin/pyro version | grep -Fx "pyro $version"
          ./node_modules/.bin/pyro version | grep -q "fork: $FORK"
          node "$GITHUB_WORKSPACE/scripts/npm/smoke.mjs"
          bun "$GITHUB_WORKSPACE/scripts/npm/smoke.mjs"

  # The GitHub release: the three platform archives, the client, the
  # JavaScriptCore source and checksums (docs/RELEASING.md), assembled from the
  # builds above and tested from their extracted form before upload.
  github-release:
    needs: [release, build, fork, linux-x64, linux-arm64, jsc, jsc-source, package, smoke]
    runs-on: lp-m1
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/download-artifact@v4
        with:
          name: archive-arm64
          path: release-in/arm64
      - uses: actions/download-artifact@v4
        with:
          name: archive-x64
          path: release-in/x64
      - uses: actions/download-artifact@v4
        with:
          name: archive-fork
          path: release-in/fork
      - uses: actions/download-artifact@v4
        with:
          name: archive-linux-x64
          path: release-in/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: archive-linux-arm64
          path: release-in/linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: patched-jsc
          path: release-in/jsc
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-in
      - uses: actions/download-artifact@v4
        with:
          name: jsc-source
          path: jsc-source
      - name: Assemble and check the archives
        run: |
          chmod +x release-in/*/pyro release-in/*/pyro-snapshot-compare
          mkdir release-out
          mv "jsc-source/pyro-jsc-source-v$VERSION.tar.gz" release-out/
          mv jsc-source/jsc-licenses release-in/
          scripts/release/assemble.sh "$VERSION" "$GITHUB_SHA" release-in release-out
      - name: Test the client against the extracted browsers
        run: |
          mkdir "$RUNNER_TEMP/extracted"
          for f in release-out/pyro-rust-v"$VERSION"-macos-arm64*.tar.gz; do tar xzf "$f" -C "$RUNNER_TEMP/extracted"; done
          cd packages/pyro
          bun install --frozen-lockfile
          # The CLI tests run the built client.
          bun run build
          # Everything, fork mode included.
          PYRO_BIN="$RUNNER_TEMP/extracted/pyro-rust-v$VERSION-macos-arm64-fork/pyro" bun test ./test
          # The standard build has no fork mode.
          PYRO_BIN="$RUNNER_TEMP/extracted/pyro-rust-v$VERSION-macos-arm64/pyro" bun test test/binary.test.ts test/screenshot.test.ts
      - name: Publish the GitHub release
        env:
          TAG: ${{ github.ref_name }}
          DIST_TAG: ${{ needs.release.outputs.dist-tag }}
        run: |
          assets=(release-out/*.tar.gz release-out/*.tgz release-out/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: replace the assets, keep the notes.
            gh release upload "$TAG" --clobber "${assets[@]}"
          else
            prerelease=()
            [[ "$DIST_TAG" == next ]] && prerelease=(--prerelease)
            gh release create "$TAG" --verify-tag --title "Pyro $TAG" --generate-notes "${prerelease[@]}" "${assets[@]}"
          fi
      - name: Verify the uploaded assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir "$RUNNER_TEMP/downloaded"
          cd "$RUNNER_TEMP/downloaded"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          shasum -a 256 -c SHA256SUMS.txt

  publish:
    # The extracted fork archive runs the complete SDK regression suite.
    # Do not publish an immutable npm version before those checks pass.
    needs: [release, smoke, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package
      - name: Publish the tested tarball
        env:
          VERSION: ${{ needs.release.outputs.version }}
          DIST_TAG: ${{ needs.release.outputs.dist-tag }}
          # Optional bootstrap token; omit after configuring npm trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Retried: npm signs the provenance with Sigstore and records it in the
        # Rekor transparency log before it uploads. A record call that timed out
        # on the client after Rekor stored it makes npm's own retry fail with
        # TLOG_CREATE_ENTRY_ERROR 409 "an equivalent entry already exists" (the
        # v0.0.45 run), and nothing reached the registry. A new attempt signs
        # with a new key, so it is a new entry. A version already on the
        # registry (an attempt whose reply was lost, or a re-run of this job)
        # counts as published: npm versions are immutable.
        # The ./ prefix makes npm treat this as a local tarball, not owner/repo.
        run: |
          published() { [ "$(npm view "@povio/pyro@$VERSION" version 2>/dev/null)" = "$VERSION" ]; }
          for attempt in 1 2 3 4; do
            if published; then
              echo "@povio/pyro@$VERSION is on the registry"
              exit 0
            fi
            if npm publish ./npm-package/*.tgz --access public --tag "$DIST_TAG"; then
              exit 0
            fi
            echo "::warning::npm publish attempt $attempt failed"
            sleep $((attempt * 30))
          done
          published || { echo "::error::@povio/pyro@$VERSION was not published"; exit 1; }

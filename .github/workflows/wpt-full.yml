name: WPT full

# The whole WPT suite, nightly (bench/wpt/README.md, "Whole suite"): every testharness page, reftest and crashtest the
# runner can run in every directory (run.mjs --dirs all, --testdriver), served by WPT's own server (--server wptserve: Python
# handlers, substitutions, every origin, https), with the browser of the newest main build (wpt.yml's `wpt-browser`
# artifact). It reports and uploads the results; it gates nothing yet (the pull request gate, wpt.yml, keeps its
# plan). A pull request that changes this workflow or the wptserve glue runs the `smoke` job only: a handful of pages
# through wptserve on lp-m1, which also checks the runner's Python.
#
# Seven balanced shards run up to four at a time on the expanded self-hosted macOS pool. Override the default with
# the repository variable WPT_FULL_PARALLEL (1..7), or choose it on a manual run. This is job concurrency, not the
# per-shard page-worker count: provision CPU/memory caps per physical machine when several runners share a Mac.
# Full runs still queue without cancelling an in-progress report; PR smoke runs cancel only their older smoke run.

on:
  schedule:
    - cron: '7 3 * * *'
  # After each push to main: its WPT run (wpt.yml) builds the browser this workflow tests, so the whole suite follows
  # that run rather than the push. The status site publishes from this run (docs.yml), so it never shows a new
  # commit with an older commit's whole-suite numbers.
  workflow_run:
    workflows: [WPT]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Where the shards run (lp-m1 is free and idle at night; macos-15 is GitHub's hosted runner, billed)
        type: choice
        options: [lp-m1, macos-15]
        default: lp-m1
      parallel:
        description: Maximum simultaneous shards (respect physical-machine CPU and memory budgets)
        type: choice
        options: ['1', '2', '4', '7']
        default: '4'
      runner-args:
        description: Extra gate.mjs run arguments for every shard (e.g. --dirs css/css-grid to measure one directory)
        type: string
        default: ''
      kinds:
        description: Which kinds' shards run (e.g. testharness alone, to compare runner-args)
        type: choice
        options: [all, testharness, reftest, crashtest]
        default: all
      reruns:
        description: Rerun every page once more (two runs per page, what a baseline needs; scheduled runs always do); doubles the time
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/wpt-full.yml
      - bench/wpt/wptserve.mjs
      - bench/wpt/fetch-wpt.sh
      - bench/wpt/prepare-ci-wpt.sh
      - bench/wpt/testdriver.mjs
      - bench/wpt/testdriver-vendor.js

permissions:
  contents: read
  actions: read

# A pull request's new push cancels its smoke run. Scheduled and manual runs queue behind a running one instead (the
# 01:17 nightly used to cancel a manual run 4 h in); a third run replaces the queued one.
concurrency:
  group: wpt-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The newest main build's browser (wpt.yml uploads it as `wpt-browser` when its build job runs).
  prepare:
    # Of main's WPT runs, only a push's (not a manual rerun's).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser-run: ${{ steps.find.outputs.run }}
      runner: ${{ steps.find.outputs.runner }}
      matrix: ${{ steps.find.outputs.matrix }}
      parallel: ${{ steps.find.outputs.parallel }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER: ${{ inputs.runner || 'lp-m1' }}
          KINDS: ${{ inputs.kinds || 'all' }}
          PARALLEL: ${{ inputs.parallel || vars.WPT_FULL_PARALLEL || '4' }}
        run: |
          case "$PARALLEL" in [1-7]) ;; *) echo "WPT_FULL_PARALLEL must be an integer from 1 to 7" >&2; exit 1 ;; esac
          echo "parallel=$PARALLEL" >> "$GITHUB_OUTPUT"
          # The shards: 4 testharness, 2 reftest, 1 crashtest (about 8 minutes each), or one kind's.
          matrix=$(jq -cn --arg k "$KINDS" '[range(4) | {kind: "testharness", shard: ., of: 4}] + [range(2) | {kind: "reftest", shard: ., of: 2}]
            + [{kind: "crashtest", shard: 0, of: 1}] | map(select($k == "all" or .kind == $k))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=wpt-browser&per_page=100" \
            -q '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].workflow_run.id')
          if [ -z "$run" ] || [ "$run" = null ]; then echo "no wpt-browser artifact from main" >&2; exit 1; fi
          echo "browser from run $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"

  # Pull requests: wptserve on lp-m1 (its Python, the venv, the proxy) and testdriver over a few pages that need them.
  smoke:
    needs: prepare
    if: github.event_name == 'pull_request'
    runs-on: lp-m1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - working-directory: bench
        run: bun install --frozen-lockfile
      - name: Python
        run: |
          for p in python3 /usr/bin/python3; do echo "$p: $(command -v $p) $($p --version 2>&1)"; done
          python3 -m pip --version || true
          sw_vers -productVersion
      - name: Prepare local full WPT checkout and venv
        env:
          WPT_PYTHON: /usr/bin/python3
        run: bench/wpt/prepare-ci-wpt.sh full
      - uses: actions/download-artifact@v4
        with:
          name: wpt-browser
          run-id: ${{ needs.prepare.outputs.browser-run }}
          github-token: ${{ github.token }}
      - run: tar -xzf browser.tgz
      - name: Pages through wptserve
        run: |
          printf '%s\n' '["xhr/status-basic.htm","xhr/send-redirect.htm","fetch/api/basic/request-headers.any.html",' \
            '"html/browsers/origin/relaxing-the-same-origin-restriction/document_domain_setter.html",' \
            '"dom/nodes/Node-appendChild.html","html/dom/render-blocking/remove-attr-unblocks-rendering.optional.html",' \
            '"uievents/click/click_events_on_input.html","css/selectors/focus-visible-001.html"]' > smoke.json
          bun bench/wpt/run.mjs --wpt "$WPT_DIR" --bin pyro=browser/pyro --server wptserve --testdriver --dirs all --tests smoke.json \
            --jobs 2 --out smoke-results.json
          bun -e 'const r = JSON.parse(require("fs").readFileSync("smoke-results.json")); for (const t of r.results) { const s = t.subtests ?? []; console.log(t.status, `${s.filter((x) => x.status === "Pass").length}/${s.length}`, t.url); } if (r.results.length < 8 || r.results.some((t) => t.status !== "complete")) process.exit(1);'

  full:
    needs: prepare
    if: github.event_name != 'pull_request'
    runs-on: ${{ needs.prepare.outputs.runner }}
    # A shard is a quarter (testharness) or half (reftest) of the suite, ~8 min; the runner ends itself after 10 min without
    # progress (run.mjs STALL_MS), so this only bounds what that misses.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.parallel) }}
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - working-directory: bench
        run: bun install --frozen-lockfile
      - name: Prepare local full WPT checkout and venv
        if: runner.environment == 'self-hosted'
        env:
          WPT_PYTHON: /usr/bin/python3
        run: bench/wpt/prepare-ci-wpt.sh full
      - uses: actions/cache@v4
        if: runner.environment == 'github-hosted'
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        with:
          path: wpt-full
          key: wpt-full-${{ hashFiles('bench/wpt/wpt-revision.txt', 'bench/wpt/fetch-wpt.sh') }}
      - name: Fetch WPT (all of it) and wptserve's venv
        if: runner.environment == 'github-hosted'
        env:
          WPT_PYTHON: /usr/bin/python3
        run: bench/wpt/fetch-wpt.sh --all --venv wpt-full
      - uses: actions/download-artifact@v4
        with:
          name: wpt-browser
          run-id: ${{ needs.prepare.outputs.browser-run }}
          github-token: ${{ github.token }}
      - run: tar -xzf browser.tgz && browser/pyro version
      - name: Run ${{ matrix.kind }} shard ${{ matrix.shard }} of ${{ matrix.of }}
        env:
          RUNNER_ARGS: ${{ inputs.runner-args }}
          # Scheduled runs rerun the pages whose result differs from the committed whole-suite baseline (bench/wpt/full/).
          RERUNS: ${{ github.event_name != 'workflow_dispatch' || inputs.reruns }}
          OUT: wpt-full-${{ matrix.kind }}-${{ matrix.shard }}.json
        run: |
          echo "$(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          read -r -a extra <<< "$RUNNER_ARGS"
          rerun=(--no-rerun)
          if [ "$RERUNS" = true ]; then rerun=(); fi
          # Pages side by side: testharness pages mostly wait (timers, timeouts; the browser used 12-14% of one core at
          # --jobs 4 in the first nightly, ~1 h per shard), so 16; reftests and crashtests render, one per CPU.
          # --slow-jobs: the pages that timed out in the baseline run to their full timeout on that many more workers,
          # nearly idle, beside the others (run.mjs SLOW_JOBS): in a testharness shard they were 1.7% of the pages and
          # 47% of the page time, holding 16 workers for 45 s each.
          jobs=${PYRO_CI_CPUS:-$(sysctl -n hw.ncpu)}; slow=8
          if [ ${{ matrix.kind }} = testharness ]; then jobs=16; slow=32; fi
          # The committed whole-suite baseline (bench/wpt/full/<kind>/) orders and balances the pages by duration, and
          # only the pages whose result differs from it run again (in run 44235329366, 8,875 of a shard's 8,892
          # reruns of every page matched their first run). For a WPT revision it does not cover, gate.mjs runs every
          # page twice (bootstrap).
          bun bench/wpt/gate.mjs run --kind ${{ matrix.kind }} "${extra[@]}" --wpt "${WPT_DIR:-wpt-full}" --bin browser/pyro \
            --server wptserve --testdriver --dirs all --baseline bench/wpt/full/${{ matrix.kind }}/ --full --jobs "$jobs" \
            --slow-jobs "$slow" --shard ${{ matrix.shard }}/${{ matrix.of }} "${rerun[@]}" --out "$OUT" --no-check
          gzip -9 "$OUT"
      # Twice: GitHub's artifact service timed out on reftest shard 0's upload in the first nightly (5 attempts in
      # 50 s), which lost the shard's 12 minutes of results.
      - uses: actions/upload-artifact@v4
        id: upload
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: wpt-full-${{ matrix.kind }}-${{ matrix.shard }}
          path: wpt-full-${{ matrix.kind }}-${{ matrix.shard }}.json.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: ${{ !cancelled() && steps.upload.outcome == 'failure' }}
        run: sleep 60
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.upload.outcome == 'failure' }}
        with:
          name: wpt-full-${{ matrix.kind }}-${{ matrix.shard }}
          path: wpt-full-${{ matrix.kind }}-${{ matrix.shard }}.json.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

  # Every shard's results in one artifact, and a summary per kind.
  results:
    needs: full
    if: ${{ !cancelled() && needs.full.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bench
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: wpt-full-*
          path: shards
          merge-multiple: true
      - name: Summary
        run: |
          gunzip shards/*.json.gz
          bun -e '
            const fs = require("fs");
            const by = {};
            for (const f of fs.readdirSync("shards")) {
              const kind = f.split("-")[2];
              const r = JSON.parse(fs.readFileSync("shards/" + f));
              const k = (by[kind] ??= { pages: 0, complete: 0, allPass: 0, subtests: 0, pass: 0, wallS: 0, restarts: 0 });
              for (const t of r.results) {
                const s = t.subtests ?? [];
                k.pages++; k.subtests += s.length; k.pass += s.filter((x) => x.status === "Pass").length;
                if (t.status === "complete") k.complete++;
                if (s.length && s.every((x) => x.status === "Pass")) k.allPass++;
              }
              k.wallS += Math.round((r.wallMs ?? 0) / 1000); k.restarts += r.restarts ?? 0;
            }
            let md = "## WPT, whole suite\n\n| kind | pages | completed | all subtests pass | subtests passing | shard wall s | browser restarts |\n|---|---:|---:|---:|---:|---:|---:|\n";
            for (const [kind, k] of Object.entries(by)) md += `| ${kind} | ${k.pages} | ${k.complete} | ${k.allPass} | ${k.pass} / ${k.subtests} | ${k.wallS} | ${k.restarts} |\n`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            console.log(md);'
          tar -czf wpt-full-results.tgz -C shards .
      - uses: actions/upload-artifact@v4
        with:
          name: wpt-full-results
          path: wpt-full-results.tgz
          retention-days: 30
          compression-level: 0
      # With reruns (every page ran twice), the whole suite's baselines: one directory per kind, one file per top-level
      # WPT directory (lib.mjs readBaselineAt), as bench/wpt/full/ holds them. CI does not commit them: they go to
      # the status site (next job) and are committed from the artifact when the protected set should move.
      - name: Baselines
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.reruns }}
        run: |
          for k in testharness reftest crashtest; do
            ls shards/wpt-full-$k-*.json >/dev/null 2>&1 || continue
            # Tonight's results replace each page's entry (--replace --match .): a page that matched the committed
            # baseline ran once (two agreeing observations, last commit and tonight), one that differed ran three times
            # and takes their consensus. A lost shard keeps its pages' committed entries (--missing-shards).
            bun bench/wpt/gate.mjs update --kind $k --missing-shards --replace --match . --baseline bench/wpt/full/$k/ \
              --out full-baselines/$k/ shards/wpt-full-$k-*.json
          done
          du -sh full-baselines/* || true
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.reruns }}
        with:
          name: wpt-full-baselines
          path: full-baselines
          retention-days: 30

  # The status site (bench/wpt/status-export.mjs): a main run's whole-suite baselines join the gates' committed ones
  # in that commit's run on the `wpt-results` branch (runs/<sha>.json.gz is replaced with the superset), and the site
  # rebuilds when this workflow completes (docs.yml). A main push's own export (wpt.yml `status`) reads the
  # whole-suite baselines committed in bench/wpt/full/.
  status:
    needs: results
    if: ${{ !cancelled() && needs.results.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.reruns) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: wpt-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: wpt-full-baselines
          path: full-baselines
      - name: Export the whole suite to the wpt-results branch
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date="$(git show -s --format=%cI "$SHA")"
          subject="$(git show -s --format=%s "$SHA")"
          for attempt in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/results"
            git fetch --depth=1 origin wpt-results
            git worktree add --detach "$RUNNER_TEMP/results" FETCH_HEAD
            bun bench/wpt/status-export.mjs export --data "$RUNNER_TEMP/results" --sha "$SHA" --date "$date" \
              --subject "$subject" --full full-baselines --chrome
            git -C "$RUNNER_TEMP/results" add -A
            git -C "$RUNNER_TEMP/results" commit -qm "WPT results for ${SHA:0:10} (whole suite)"
            if git -C "$RUNNER_TEMP/results" push origin HEAD:refs/heads/wpt-results; then exit 0; fi
            git worktree remove --force "$RUNNER_TEMP/results"
            sleep $((attempt * 5))
          done
          exit 1

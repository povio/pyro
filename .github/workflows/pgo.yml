name: PGO build

# The release browsers are built with profile-guided optimization: macOS arm64
# by .github/actions/pgo-build (publish-npm.yml's `fork` job), Linux x64 and
# arm64 by linux-build.yml with `pgo`. This workflow runs the same builds when
# their inputs change, so a broken PGO build
# shows on the pull request and not at release time. Runs on `main` also save
# the instrumented JavaScriptCore to the cache release tags restore.

on:
  workflow_dispatch:
    inputs:
      linux:
        description: Include Linux x64 and arm64 builds
        type: boolean
        default: true
  workflow_call:
    inputs:
      linux:
        description: Include Linux builds (WPT supplies its own shared Linux builds)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pgo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pgo:
    # The self-hosted Apple Silicon runner (label lp-m1), as the jsc job.
    runs-on: lp-m1
    timeout-minutes: 150
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      # That Mac's newest SDK is one its linker cannot read; see jsc.yml.
      SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/pgo-build
      - name: Check the binary
        run: |
          binary=target/aarch64-apple-darwin/release-pgo/pyro
          codesign --verify --strict "$binary"
          if otool -L "$binary" | grep -F JavaScriptCore; then exit 1; fi
          codesign -d --entitlements - "$binary" 2>/dev/null | grep -q com.apple.security.cs.allow-jit
          "$binary" version
          "$binary" version | grep -q 'fork: true'
          "$binary" eval -e 'console.log("pgo-smoke-ok")' | grep -Fx pgo-smoke-ok
      - name: Training logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-training-logs
          path: target/pgo/*.log
          if-no-files-found: ignore
          retention-days: 7

  linux:
    if: inputs.linux
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    uses: ./.github/workflows/linux-platform.yml
    with:
      arch: ${{ matrix.arch }}
      pgo: true

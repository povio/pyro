name: TEMPORARY release jobs on lp-m1

# Removed before merge: runs publish-npm.yml's new steps that a pull request cannot otherwise exercise: the Intel
# browser cross-compiled on lp-m1 (NASM built from source, its checks), and the smoke legs (lp-m1 arm64, GitHub's
# Intel runner) on the published v0.0.37 npm tarball, the Intel leg again with the cross-built browser in the package.

on:
  pull_request:
    paths:
      - .github/workflows/tmp-release-on-lp-m1.yml

permissions:
  contents: read

jobs:
  # publish-npm.yml `build`, x64 leg (the release-manifests stamping left out).
  build:
    runs-on: lp-m1
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-apple-darwin
            lipo: x86_64
    env:
      PYRO_JSC: system
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add --toolchain stable "$RUST_TARGET"
      - name: NASM
        if: matrix.arch == 'x64'
        env:
          NASM_VERSION: '3.02'
          NASM_SHA256: 87336eba53b4acfe917424ab5d500d2b0054d9f5148d35c2273ccf2cfb712f0d
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO --retry 3 "https://www.nasm.us/pub/nasm/releasebuilds/$NASM_VERSION/nasm-$NASM_VERSION.tar.xz"
          echo "$NASM_SHA256  nasm-$NASM_VERSION.tar.xz" > nasm.sha256
          shasum -a 256 -c nasm.sha256
          tar -xJf "nasm-$NASM_VERSION.tar.xz"
          cd "nasm-$NASM_VERSION"
          ./configure --quiet
          make -j"$(sysctl -n hw.ncpu)" nasm
          ./nasm -v
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Build browser with rendering, and the comparison worker
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: cargo +stable build --locked --release --package pyro --package pyro-render --features render --target "$RUST_TARGET"
      - name: Verify and stage binary
        env:
          ARCH: ${{ matrix.arch }}
          LIPO_ARCH: ${{ matrix.lipo }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          binary="target/$RUST_TARGET/release/pyro"
          lipo -archs "$binary" | grep -qx "$LIPO_ARCH"
          codesign --verify --strict "$binary"
          codesign -d --entitlements - "$binary" 2>/dev/null | grep -q com.apple.security.cs.allow-jit
          otool -L "$binary"
          if [ "$ARCH" = x64 ] && grep -l -e 'not using any assembly' -e 'NASM does not seem to be installed' \
              target/"$RUST_TARGET"/release/build/*/output; then
            echo "::error::a dependency built without its x86-64 assembly (NASM)"
            exit 1
          fi
          # Probe only: the assembly is in the binary (libjpeg-turbo's AVX2 colour conversion).
          nm "$binary" | grep -c 'jsimd_.*avx2' || true
          mkdir -p "native/darwin-$ARCH"
          cp "$binary" "native/darwin-$ARCH/pyro"
          comparator="target/$RUST_TARGET/release/pyro-snapshot-compare"
          codesign --verify --strict "$comparator"
          lipo -archs "$comparator" | grep -qx "$LIPO_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: tmp-native-${{ matrix.arch }}
          path: native/
          if-no-files-found: error
          retention-days: 3

  # publish-npm.yml `smoke`, both macOS legs.
  smoke:
    needs: build
    name: smoke (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: lp-m1
            arch: arm64
            fork: true
          - runner: macos-15-intel
            arch: x64
            fork: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: The published v0.0.37 npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.0.37 --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir npm-package && ls npm-package
      - name: Test installed CLI and API with Node and Bun
        env:
          ARCH: ${{ matrix.arch }}
          FORK: ${{ matrix.fork }}
        run: |
          node_arch="$(node -p process.arch)"
          bun_arch="$(bun -e 'console.log(process.arch)')"
          if [[ "$node_arch" != "$ARCH" || "$bun_arch" != "$ARCH" ]]; then
            echo "::error::Node runs as $node_arch and Bun as $bun_arch, not $ARCH"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          npm init -y
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/npm-package/*.tgz
          version="$(node -p 'require("./node_modules/@povio/pyro/package.json").version')"
          ./node_modules/.bin/pyro version
          ./node_modules/.bin/pyro version | grep -Fx "pyro $version"
          ./node_modules/.bin/pyro version | grep -q "fork: $FORK"
          node "$GITHUB_WORKSPACE/scripts/npm/smoke.mjs"
          bun "$GITHUB_WORKSPACE/scripts/npm/smoke.mjs"
      - uses: actions/download-artifact@v4
        if: matrix.arch == 'x64'
        with:
          name: tmp-native-x64
          path: cross
      - name: The same smoke with the cross-built Intel browser in the package
        if: matrix.arch == 'x64'
        run: |
          cd "$RUNNER_TEMP/npm-smoke"
          target=node_modules/@povio/pyro/native/darwin-x64/pyro
          cp "$GITHUB_WORKSPACE/cross/darwin-x64/pyro" "$target"
          chmod +x "$target"
          ./node_modules/.bin/pyro version
          ./node_modules/.bin/pyro version | grep -q 'fork: false'
          "$target" eval -e 'console.log("npm-smoke-ok")' | grep -Fx npm-smoke-ok
          node "$GITHUB_WORKSPACE/scripts/npm/smoke.mjs"
          bun "$GITHUB_WORKSPACE/scripts/npm/smoke.mjs"

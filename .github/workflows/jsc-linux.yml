name: Patched JavaScriptCore (Linux)

# One architecture per call: no macOS or other-architecture barrier. WPT owns
# automatic CI calls, so Linux and PGO checks consume the same artifacts.
on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
    outputs:
      dir:
        description: Directory name of the patched JavaScriptCore build
        value: ${{ jobs.jsc.outputs.dir }}

permissions:
  contents: read

jobs:
  jsc:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    outputs:
      dir: ${{ steps.key.outputs.dir }}
    steps:
      - uses: actions/checkout@v6
      - name: Cache key
        id: key
        run: |
          rev="$(tr -d '[:space:]' < crates/pyro-jsc-sys/webkit/REVISION)"
          patches="$(cat crates/pyro-jsc-sys/webkit/patches/*.patch | sha256sum | cut -c1-12)"
          echo "dir=${rev:0:12}-$patches" >> "$GITHUB_OUTPUT"
          echo "setup=$(sha256sum scripts/linux/setup.sh | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ~/.cache/pyro/jsc/${{ steps.key.outputs.dir }}
          key: patched-jsc-static-linux-${{ inputs.arch }}-${{ steps.key.outputs.dir }}-${{ steps.key.outputs.setup }}
      - name: Build patched JavaScriptCore
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # 4 CPUs and 16 GB on the hosted runners; about 3 GB per job.
          JOBS: '4'
          CC: clang
          CXX: clang++
        run: |
          scripts/linux/setup.sh
          scripts/jsc/build.sh
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/pyro/jsc/${{ steps.key.outputs.dir }}
          key: patched-jsc-static-linux-${{ inputs.arch }}-${{ steps.key.outputs.dir }}-${{ steps.key.outputs.setup }}
      - name: Check the build
        env:
          DIR: ${{ steps.key.outputs.dir }}
        run: |
          lib="$HOME/.cache/pyro/jsc/$DIR/lib/libJavaScriptCore.a"
          # A fork-support entry point (patch 0002), and the archive's other pieces: the JIT subtarget, WTF and bmalloc.
          nm --defined-only "$lib" 2>/dev/null > symbols.txt || true
          for symbol in JSPrepareForFork _ZN3JSC3DFG4Plan11notifyReadyEv _ZN3WTF10initializeEv _ZN8Gigacage14ensureGigacageEv; do
            grep -q " T $symbol\$" symbols.txt || { echo "libJavaScriptCore.a does not define $symbol" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: patched-jsc-linux-${{ inputs.arch }}
          path: ~/.cache/pyro/jsc/${{ steps.key.outputs.dir }}
          if-no-files-found: error

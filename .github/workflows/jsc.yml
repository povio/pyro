name: Patched JavaScriptCore

# Builds the macOS patched JavaScriptCore the fork variant
# links into the browser (scripts/jsc/build.sh: one static archive,
# lib/libJavaScriptCore.a) and keeps the build in the Actions cache,
# keyed by the WebKit revision and the patches. WPT calls it on main when needed: caches saved on the default branch are
# the ones release tags can restore. Release tags call this workflow and get
# the cached build, or build it themselves on a miss.

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      dir:
        description: Directory name of the macOS build under jsc/
        value: ${{ jobs.jsc.outputs.dir }}

permissions:
  contents: read

jobs:
  jsc:
    # The self-hosted Apple Silicon runner (label lp-m1).
    runs-on: lp-m1
    # A cold build at -j2 took 7 minutes; cached builds take a minute.
    timeout-minutes: 360
    env:
      # That Mac has a stray macOS 27.0 SDK next to the 26.6 Command Line Tools,
      # whose linker cannot read it (ld: tapi error: malformed file). Use the 26.5 SDK.
      SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
      # Registrations on one Mac can share HOME. Keep mutable source/build/output trees job-local.
      PYRO_JSC_CACHE: ${{ github.workspace }}/jsc
      PYRO_WEBKIT_SRC: ${{ github.workspace }}/target/jsc-src
      PYRO_JSC_BUILD: ${{ github.workspace }}/target/jsc-build
    outputs:
      dir: ${{ steps.key.outputs.dir }}
    steps:
      - uses: actions/checkout@v6
      # The WebKit revision and a hash of the patches (wpt.yml looks the cache up by the same key).
      - name: Cache key
        id: key
        run: |
          dir="$(scripts/jsc/cache-key.sh)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        id: cache
        with:
          path: jsc/${{ steps.key.outputs.dir }}
          key: patched-jsc-static-macos-arm64-v2-${{ steps.key.outputs.dir }}
      - name: Build patched JavaScriptCore
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # The hosted runner has 3 CPUs and 7 GB of memory; the build needs
          # about 3 GB per job.
          JOBS: '2'
        run: |
          command -v ninja >/dev/null || brew install ninja
          scripts/jsc/build.sh
      - uses: actions/cache/save@v4
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: jsc/${{ steps.key.outputs.dir }}
          key: patched-jsc-static-macos-arm64-v2-${{ steps.key.outputs.dir }}
      - name: Check the build
        env:
          DIR: ${{ steps.key.outputs.dir }}
        run: |
          lib="$GITHUB_WORKSPACE/jsc/$DIR/lib/libJavaScriptCore.a"
          lipo -archs "$lib" | grep -qx arm64
          # A fork-support entry point (patch 0002): this is the patched library. The archive's
          # other pieces: the JIT subtarget's objects, WTF and bmalloc (scripts/jsc/archive.sh).
          nm -gU "$lib" 2>/dev/null > symbols.txt || true
          for symbol in _JSPrepareForFork __ZN3JSC3DFG4Plan11notifyReadyEv __ZN3WTF10initializeEv __ZN8Gigacage14ensureGigacageEv; do
            grep -q " T $symbol\$" symbols.txt || { echo "libJavaScriptCore.a does not define $symbol" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: patched-jsc
          path: jsc/${{ steps.key.outputs.dir }}
          if-no-files-found: error
          retention-days: 7

name: CI configuration

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
      - scripts/ci/**
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
      - scripts/ci/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Build-plan contract tests
        run: node --test scripts/ci/plan.test.mjs
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: Check workflow contracts and embedded shell
        # SC2016 flags intentional literal JavaScript template strings in existing bun/node snippets.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -ignore SC2016

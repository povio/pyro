name: Linux

# Automatic Linux validation is part of WPT, sharing its JSC producers.
# Keep this entry point for standalone diagnostics.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    uses: ./.github/workflows/linux-platform.yml
    with:
      arch: ${{ matrix.arch }}

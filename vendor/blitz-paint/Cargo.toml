# Standalone manifest for the vendored copy (workspace inheritance resolved by
# lightningpanda; see README.lightningpanda.md).

[package]
name = "blitz-paint"
description = "Paint a Blitz Document using anyrender"
documentation = "https://docs.rs/blitz-paint"
version = "0.3.0-beta.4"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/dioxuslabs/blitz"
repository = "https://github.com/dioxuslabs/blitz"
categories = ["gui"]
edition = "2024"
rust-version = "1.91.0"

[features]
default = ["svg"]
tracing = ["dep:tracing"]
svg = ["dep:anyrender_svg", "blitz-dom/svg"]
"custom-widget" = ["blitz-dom/custom-widget"]
"font-embolden" = []
"apple-font-embolden" = []
scrollbars = ["blitz-dom/scrollbars"]

[dependencies]
anyrender = { version = "0.14.0" }
anyrender_svg = { optional = true, version = "0.15.0" }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
style = { version = "0.24.0", package = "stylo" }
taffy = { default-features = false, features = ["std", "flexbox", "flexbox_balance", "grid", "block_layout", "content_size", "calc", "detailed_layout_info"], version = "0.15" }
parley = { version = "0.12", default-features = false, features = ["std", "bytemuck"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
color = { version = "0.3" }
peniko = { version = "0.6.0" }
kurbo = { version = "0.13.1" }
bytemuck = { version = "1" }
smallvec = { version = "1" }
tracing = { version = "0.1.40", optional = true }

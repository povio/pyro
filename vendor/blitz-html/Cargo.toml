# Standalone manifest for the vendored copy (workspace inheritance resolved by
# pyro; see README.pyro.md).

[package]
name = "blitz-html"
description = "Blitz HTML parser"
documentation = "https://docs.rs/blitz-html"
version = "0.3.0-beta.4"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/dioxuslabs/blitz"
repository = "https://github.com/dioxuslabs/blitz"
categories = ["gui"]
edition = "2024"
rust-version = "1.91.0"

[features]
accessibility = ["blitz-dom/accessibility"]
tracing = ["dep:tracing", "blitz-dom/tracing"]

[dependencies]
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
html5ever = { version = "0.40.1" }
xml5ever = { version = "0.40.0" }
tracing = { version = "0.1.40", optional = true }

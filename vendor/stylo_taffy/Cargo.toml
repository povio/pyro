# Standalone manifest for the vendored copy (workspace inheritance resolved by
# lightningpanda; see README.lightningpanda.md).

[package]
name = "stylo_taffy"
license = "MIT OR Apache-2.0 OR MPL-2.0"
description = "Interop crate for the stylo and taffy crates"
keywords = ["css", "layout"]
version = "0.3.0-beta.4"
homepage = "https://github.com/dioxuslabs/blitz"
repository = "https://github.com/dioxuslabs/blitz"
categories = ["gui"]
edition = "2024"
rust-version = "1.91.0"

[features]
default = ["std", "block", "flexbox", "grid"]
std = ["taffy/std"]
block = ["taffy/block_layout"]
flexbox = ["taffy/flexbox", "taffy/flexbox_balance"]
grid = ["taffy/grid"]
floats = ["taffy/float_layout"]
"writing-mode" = []

[dependencies]
bitflags = { version = "2.8.0" }
taffy = { default-features = false, features = ["std", "flexbox", "flexbox_balance", "grid", "block_layout", "content_size", "calc", "detailed_layout_info"], version = "0.15" }
style = { version = "0.24.0", package = "stylo" }
style_atoms = { version = "0.24.0", package = "stylo_atoms" }

<!doctype html><meta charset="utf-8"><title>Convolver graph and response lifecycle</title>
<script src="/resources/testharness.js"></script><script src="/resources/testharnessreport.js"></script><script>
for(const ni of [1,2])for(const nk of [1,2,4])promise_test(async()=>{
 const c=new OfflineAudioContext(2,1024,48000),response=c.createBuffer(nk,600,48000),source=c.createBufferSource();
 const inputs=c.createBuffer(ni,256,48000);
 for(let i=0;i<ni;i++)inputs.getChannelData(i)[0]=i===0?2:3;
 for(let i=0;i<nk;i++)response.getChannelData(i)[128*i+1]=i+1;
 const conv=new ConvolverNode(c,{buffer:response,disableNormalization:true});
 source.buffer=inputs;source.connect(conv).connect(c.destination);source.start();
 const result=await c.startRendering();
 const routes=nk===4?[[0,0,0],[0,1,1],[ni-1,2,0],[ni-1,3,1]]:nk===2?[[0,0,0],[ni-1,1,1]]:[[0,0,0],[ni-1,0,1]];
 for(let ch=0;ch<2;ch++){const expected=new Float32Array(1024);
  for(const [input,k,o] of routes)if(o===ch)expected[128*k+1]+=(input===0?2:3)*(k+1);
  assert_array_approx_equals(result.getChannelData(ch),expected,0.00001);}
},ni+' input channels by '+nk+' impulse channels match direct routing');
promise_test(async()=>{
 const c=new OfflineAudioContext(1,512,44100),response=c.createBuffer(1,4,c.sampleRate),src=c.createBufferSource();
 const old=response.getChannelData(0);old[0]=1;
 const node=c.createConvolver();node.normalize=false;node.buffer=response;node.normalize=true;
 assert_equals(node.buffer,response);const fresh=response.getChannelData(0);fresh[0]=0;
 const invalid=c.createBuffer(3,1,c.sampleRate);assert_throws_dom('NotSupportedError',()=>{node.buffer=invalid});
 assert_equals(node.buffer,response);
 const x=c.createBuffer(1,1,c.sampleRate);x.getChannelData(0)[0]=1;src.buffer=x;src.connect(node).connect(c.destination);src.start();
 const out=await c.startRendering();assert_approx_equals(out.getChannelData(0)[0],1,1e-7);
},'Kernel snapshots data and normalization on assignment; invalid replacement is atomic');
promise_test(async()=>{
 const c=new OfflineAudioContext(1,1024,48000),node=c.createConvolver(),x=c.createBuffer(1,1,c.sampleRate),h=c.createBuffer(1,512,c.sampleRate);
 x.getChannelData(0)[0]=1;h.getChannelData(0)[383]=.75;node.normalize=false;node.buffer=h;
 const src=c.createBufferSource();src.buffer=x;src.connect(node).connect(c.destination);src.start();
 const paused=c.suspend(128/c.sampleRate).then(()=>{src.disconnect();return c.resume()});
 const completed=c.startRendering();await paused;const out=await completed;
 assert_approx_equals(out.getChannelData(0)[383],.75,1e-6);
},'Disconnected input drains previously excited impulse-response partitions');
promise_test(async()=>{
 const c=new OfflineAudioContext(1,128,44100),h=c.createBuffer(1,4,44100),x=c.createBuffer(1,1,44100);
 h.getChannelData(0)[0]=1;x.getChannelData(0)[0]=1;
 const f=new ConvolverNode(c,{buffer:h});const src=c.createBufferSource();src.buffer=x;src.connect(f).connect(c.destination);src.start();
 const out=await c.startRendering();assert_approx_equals(out.getChannelData(0)[0],0.00125/0.5,1e-7);
},'Normalization uses the Web Audio 0.00125 calibration constant and impulse RMS');
</script>
<script>
promise_test(async()=>{
 const c=new OfflineAudioContext(2,4096,48000),ir=c.createBuffer(2,256,c.sampleRate);
 ir.getChannelData(0)[0]=ir.getChannelData(1)[0]=1;
 const conv=new ConvolverNode(c,{buffer:ir,disableNormalization:true});
 const silent=c.createConstantSource();silent.offset.value=0;
 silent.connect(c.createGain()).connect(conv);
 const sum=new GainNode(c,{channelInterpretation:'discrete'});conv.connect(sum);
 const audible=c.createConstantSource();audible.offset.value=.25;audible.connect(sum);
 sum.connect(c.destination);audible.start();silent.start();silent.stop(128/c.sampleRate);
 const right=(await c.startRendering()).getChannelData(1);
 assert_equals(right[64],0,'a silent but active source keeps the stereo response active');
 assert_equals(right[4095],.25,'ended input releases the old width after its tail despite its live connection');
},'Active silent source and connected but ended source have distinct lifetimes');
promise_test(async t=>{
 const frame=document.body.appendChild(document.createElement('iframe'));
 t.add_cleanup(()=>frame.remove());
 const other=frame.contentWindow,c=new OfflineAudioContext(1,128,48000), f=c.createConvolver();
 const foreign=new other.AudioBuffer({length:1,sampleRate:c.sampleRate});
 foreign.getChannelData(0)[0]=.5;f.normalize=false;f.buffer=foreign;
 assert_equals(f.buffer,foreign);
 assert_true(foreign.getChannelData(0) instanceof other.Float32Array,'refreshed view belongs to buffer owner');
 assert_throws_js(TypeError,()=>{f.buffer=Object.create(other.AudioBuffer.prototype)});
 const src=c.createConstantSource();src.offset.value=1;src.connect(f).connect(c.destination);src.start();
 assert_equals((await c.startRendering()).getChannelData(0)[0],.5);
},'Same-origin foreign AudioBuffer retains its identity and owner realm');
</script>
<script>
promise_test(async()=>{
 const c=new OfflineAudioContext(1,1024,48000),f=c.createConvolver(),x=c.createBuffer(1,1,c.sampleRate),h=c.createBuffer(1,512,c.sampleRate);
 x.getChannelData(0)[0]=1;h.getChannelData(0)[383]=.75;
 f.normalize=false;f.buffer=h;
 const s=c.createBufferSource(); s.buffer=x;s.connect(f);s.start();
 const suspend=c.suspend(128/c.sampleRate).then(()=>{f.connect(c.destination);return c.resume()});
 const completion=c.startRendering();await suspend;
 const out=await completion;assert_approx_equals(out.getChannelData(0)[383],.75,1e-6);
},'A fed convolver retains earlier input for output connected during its tail');
</script>

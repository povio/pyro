<!doctype html><title>Experimental unaccelerated CPU graph</title>
<script src="/resources/testharness.js"></script><script src="/resources/testharnessreport.js"></script>
<script src="model.js"></script><script>
function check(r) {
  assert_false(r.accelerated);assert_array_equals(r.shape,[1,3]);
  const expected=[[31,7,1.5,0,39],[31,2,3.5,0,39],[31,0,0,6.5,39]];
  r.results.forEach((row,i)=>assert_array_equals(row,expected[i]));
}
promise_test(async()=>{check(await evaluateModel());},'Window performs three rewrites and dispatches through one compiled matmul/add/ReLU graph');
promise_test(async t=>{
 const w=new Worker('worker.js');t.add_cleanup(()=>w.terminate());
 const result=await new Promise((r,j)=>{w.onmessage=e=>r(e.data);w.onerror=j;});
 assert_true(result.secure);assert_false('error' in result,String(result.error));check(result.result);
},'Dedicated Worker runs the same numerical graph in its own CPU context');
promise_test(async t=>{
  const seen=[];const c=await navigator.ml.createContext({
    get accelerated(){seen.push('accelerated');return 0;},
    get powerPreference(){seen.push('powerPreference');return 'low-power';},
    get deviceType(){throw new Error('nonstandard dictionary member read');}});
  assert_array_equals(seen,['accelerated','powerPreference']);assert_false(c.accelerated);
  await promise_rejects_dom(t,'NotSupportedError',navigator.ml.createContext({deviceType:'cpu'}));
  await promise_rejects_js(t,TypeError,navigator.ml.createContext({accelerated:false,powerPreference:'other'}));c.destroy();
},'CPU opt-in follows the pinned WebIDL dictionary and ignores unknown fields');
promise_test(async t=>{
 const c=await navigator.ml.createContext({accelerated:false}),d={shape:[2],dataType:'float32'};
 const other=await navigator.ml.createContext({accelerated:false});
 const b=new MLGraphBuilder(c),otherBuild=new MLGraphBuilder(other),x=b.input('x',d);
 assert_throws_js(TypeError,()=>b.input('',d));
 assert_throws_js(TypeError,()=>b.relu(otherBuild.input('other',d)));
 assert_throws_js(TypeError,()=>b.add(x,b.input('different',{...d,shape:[3]})));
 const y=b.relu(x);await promise_rejects_js(t,TypeError,b.build({'':y}));
 const g=await b.build({y});await promise_rejects_dom(t,'InvalidStateError',b.build({y}));
 const input=await c.createTensor({...d,writable:true}),output=await c.createTensor({...d,readable:true});
 assert_throws_js(TypeError,()=>c.dispatch(g,{x:input},{y:input}));
 assert_throws_js(TypeError,()=>other.dispatch(g,{x:input},{y:output}));
 assert_throws_js(TypeError,()=>c.writeTensor(input,new Uint32Array([1,2])));
 const read=c.readTensor(output);output.destroy();await promise_rejects_dom(t,'InvalidStateError',read);
 await promise_rejects_js(t,TypeError,c.readTensor(output));
 g.destroy();assert_throws_dom('InvalidStateError',()=>c.dispatch(g,{x:input},{y:output}));
 c.destroy();other.destroy();
},'Builder ownership, aliasing, dimensions, buffer type and destroyed resources are enforced');
promise_test(async t=>{
 const c=await navigator.ml.createContext({accelerated:false}),b=new MLGraphBuilder(c),d={shape:[2],dataType:'float32'};
 const t0=await c.createConstantTensor(d,new Float32Array([3,4])),out=b.relu(b.constant(t0));t0.destroy();
 await promise_rejects_js(t,TypeError,b.build({out}));c.destroy();
},'Destroying a constant tensor before graph compilation invalidates its operand');
promise_test(async()=>{
 const c=await navigator.ml.createContext({accelerated:false}),l=c.opSupportLimits();
 assert_array_equals(l.matmul.a.dataTypes,['float32']);assert_equals(l.matmul.a.rankRange.max,2);
 assert_array_equals(l.conv2d.input.dataTypes,[]);l.relu.input.dataTypes.length=0;
 assert_array_equals(c.opSupportLimits().relu.input.dataTypes,['float32']);c.destroy();
},'Support reporting reflects implemented CPU kernels and returns fresh dictionaries');
</script>

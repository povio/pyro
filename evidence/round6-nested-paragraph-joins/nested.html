<!doctype html><title>Joining the first line of a nested editable paragraph</title><script src="/resources/testharness.js"></script><script src="/resources/testharnessreport.js"></script><body><script>
function host(t,txt){const h=document.body.appendChild(document.createElement('div'));h.contentEditable='true';h.innerHTML=txt;h.focus();t.add_cleanup(()=>h.remove());return h;}
for(const command of ['backspace','delete','range'])test(t=>{
 const h=host(t,'<p style="white-space:nowrap">abc</p><div style="white-space:pre-wrap"><div><b>def<br>ghi</b></div><i>tail</i></div>');const [left,right]=h.children,tail=right.lastChild,s=getSelection();const before=h.innerHTML;
 if(command==='backspace')s.collapse(right.firstChild.firstChild.firstChild,0);
 if(command==='delete')s.collapse(left.firstChild,3);if(command==='range')s.setBaseAndExtent(left.firstChild,3,right.firstChild.firstChild.firstChild,0);
 assert_true(document.execCommand(command==='delete'?'forwardDelete':'delete'));assert_equals(left.textContent,'abcdef');assert_equals(right.textContent,'ghitail');assert_equals(tail.parentNode,right);assert_equals(getComputedStyle(left.querySelector('b')).whiteSpace,'pre-wrap');
 assert_true(s.isCollapsed);assert_equals(s.anchorOffset,3);const changed=h.innerHTML;assert_true(document.execCommand('undo'));assert_equals(h.innerHTML,before);assert_true(document.execCommand('redo'));assert_equals(h.innerHTML,changed);
},command+' joins a nested first line and retains the unselected remainder and undo state');
test(t=>{const h=host(t,'<span>abc</span><div style="white-space:pre"><div><div>def\nghi</div>middle</div>end</div>');const right=h.lastChild;getSelection().collapse(right.firstChild.firstChild.firstChild,0);document.execCommand('delete');assert_equals(h.textContent,'abcdefghimiddleend');assert_equals(right.textContent,'ghimiddleend');assert_equals(getComputedStyle(h.children[1]).whiteSpace,'pre');},'An anonymous left line absorbs only the first preserved line from a deeper block');
test(t=>{const h=host(t,'<div style="white-space:pre;font-weight:bold;color:red">L</div><div><div style="color:blue"><i>R</i></div><span contenteditable=false>shield</span><p>tail</p></div>');const left=h.firstChild,right=h.lastChild,italic=right.querySelector('i'),shield=right.querySelector('span'),n=shield.firstChild,typ=getComputedStyle(italic);const weight=typ.fontWeight,color=typ.color;getSelection().collapse(left.firstChild,1);document.execCommand('forwardDelete');assert_true(left.contains(italic));assert_equals(getComputedStyle(italic).fontWeight,weight);assert_equals(getComputedStyle(italic).color,color);assert_equals(n,shield.firstChild);assert_equals(shield.parentNode,right);assert_equals(right.textContent,'shieldtail');},'An extracted inline subtree retains formatting and leaves the locked remainder untouched');
test(t=>{const h=host(t,'<p style="white-space:nowrap">left</p><div style="white-space:pre"><div>abc</div>tail</div>');const r=h.lastChild,l=h.firstChild;getSelection().collapse(r.firstChild.firstChild,2);document.execCommand('delete');assert_equals(l.textContent,'left');assert_equals(r.textContent,'actail');},'Backspace inside the nested line deletes its preceding character without joining');
test(t=>{const h=host(t,'<span style="white-space:pre;visibility:hidden">ghost</span><div><div>abc</div></div>');const hidden=h.firstChild,n=hidden.firstChild;getSelection().collapse(h.lastChild.firstChild.firstChild,0);document.execCommand('delete');assert_false(hidden.contains(getSelection().focusNode),'caret is visible');document.execCommand('insertText',false,'x');assert_equals(n.data,'ghost');assert_equals(h.textContent,'ghostxabc');},'A hidden left inline cannot receive the caret or the next typed text');
test(t=>{const st=document.head.appendChild(document.createElement('style'));t.add_cleanup(()=>st.remove());st.textContent='[data-src] .fmt{color:rgb(0, 0, 255);font-style:italic}';const h=host(t,'<p style="white-space:nowrap">a</p><div data-src style="white-space:pre"><div><span class="fmt">styled  text</span></div>remainder</div>');const l=h.firstChild,r=h.lastChild;getSelection().collapse(l.firstChild,1);document.execCommand('forwardDelete');const moved=l.querySelector('.fmt');assert_true(!!moved);assert_equals(moved.textContent,'styled  text');assert_equals(getComputedStyle(moved).color,'rgb(0, 0, 255)');assert_equals(getComputedStyle(moved).fontStyle,'italic');assert_equals(r.textContent,'remainder');},'Nested source contextual styles remain effective after moving editable text');
</script>

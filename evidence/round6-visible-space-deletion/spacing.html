<!doctype html><meta charset=utf-8><title>Deleting one visible space in an editing host</title><script src="/resources/testharness.js"></script><script src="/resources/testharnessreport.js"></script><body><script>
function host(t,value,whiteSpace='normal'){const h=document.body.appendChild(document.createElement('div'));h.contentEditable=true;h.style.cssText='display:inline-block;font:20px monospace;white-space:'+whiteSpace;h.textContent=value;t.add_cleanup(()=>h.remove());h.focus();return h;}
function width(t,h,text){const ref=h.cloneNode(false);ref.removeAttribute('contenteditable');ref.style.whiteSpace='pre';ref.textContent=text;document.body.append(ref);const result=ref.getBoundingClientRect().width;ref.remove();return result;}
for(const mode of ['normal','pre-line','nowrap'])for(const backward of [true,false])test(t=>{
 const h=host(t,'a \u00a0 b',mode),n=h.firstChild;const s=getSelection();s.collapse(n,backward?3:2);const old=h.innerHTML;
 document.execCommand(backward?'delete':'forwardDelete');assert_equals(h.firstChild,n);assert_equals(h.textContent.replaceAll('\u00a0',' '),'a  b');
 assert_approx_equals(h.getBoundingClientRect().width,width(t,h,'a  b'),1,'deleting one space should not collapse a second one');assert_equals(s.anchorNode,n);assert_equals(s.anchorOffset,2);
 const after=h.innerHTML;assert_true(document.execCommand('undo'));assert_equals(h.innerHTML,old);assert_true(document.execCommand('redo'));assert_equals(h.innerHTML,after);
},'A '+(backward?'backspace':'forward delete')+' within a visible '+mode+' run preserves the other two widths and one undo step');
for(const mode of ['pre-wrap','pre','break-spaces'])test(t=>{const h=host(t,'a \u00a0 b',mode);getSelection().collapse(h.firstChild,3);document.execCommand('delete');assert_equals(h.textContent,'a  b');},'Preformatted text keeps its literal spaces under '+mode);
test(t=>{const h=host(t,'\u00a0 \u00a0b');getSelection().collapse(h.firstChild,1);document.execCommand('delete');assert_approx_equals(h.getBoundingClientRect().width,width(t,h,'  b'),1);},'A deletion at the line start keeps both surviving spaces visible');
test(t=>{const h=host(t,'😀 \u00a0 b');getSelection().collapse(h.firstChild,4);document.execCommand('delete');assert_equals(getSelection().anchorOffset,3);assert_equals(h.textContent.replaceAll('\u00a0',' '),'😀  b');},'Deleting a visible space preserves a UTF-16 caret after an astral character');
test(t=>{const h=host(t,'');h.innerHTML='<b>foo&nbsp;</b> bar';const first=h.firstChild,n=first.firstChild;getSelection().collapse(h.lastChild,1);document.execCommand('delete');assert_equals(first.firstChild,n);assert_equals(n.data,'foo\u00a0');},'Deleting a boundary space leaves authored spacing in a different inline element alone');
test(t=>{const h=host(t,'a  \u00a0 b');getSelection().collapse(h.firstChild,4);document.execCommand('delete');assert_true(h.textContent.startsWith('a'));assert_true(h.textContent.endsWith('b'));assert_less_than(h.getBoundingClientRect().width,width(t,h,'a   b')-1);},'Previously collapsed whitespace is not promoted to fully visible text');
test(t=>{const h=host(t,'');h.innerHTML='<span contenteditable="false"></span> &nbsp;&nbsp;B';const protectedNode=h.firstChild,n=h.lastChild;getSelection().collapse(n,3);const before=h.getBoundingClientRect().width;document.execCommand('delete');assert_equals(h.firstChild,protectedNode);assert_equals(protectedNode.childNodes.length,0);assert_less_than(h.getBoundingClientRect().width,before-1);},'An empty noneditable inline does not turn a previously collapsed leading space into visible content');
test(t=>{const h=host(t,'A  😀B'),n=h.firstChild;getSelection().collapse(n,4);document.execCommand('delete');assert_true(n.data.startsWith('A  '),'the whitespace preceding the surrogate pair is unchanged');},'A caret inside a surrogate pair cannot misclassify its half as a space deletion');
test(t=>{const h=host(t,'a   b');getSelection().collapse(h.firstChild,3);document.execCommand('delete');assert_true(h.textContent.includes(' '),'a wrapping opportunity remains');h.style.width='3ch';const ref=host(t,'a  b');ref.style.width='3ch';assert_approx_equals(h.getBoundingClientRect().height,ref.getBoundingClientRect().height,1);},'Removing the last breakable space in a visible run retains wrapping');
test(t=>{const h=host(t,'a     b');getSelection().collapse(h.firstChild,4);document.execCommand('delete');assert_equals(h.textContent,'a    b');},'A surviving visible and breakable representation does not require rewriting');
test(t=>{const h=host(t,'a   b','pre-line');h.style.textWrapMode='nowrap';assert_equals(getComputedStyle(h).textWrapMode,'nowrap');getSelection().collapse(h.firstChild,3);document.execCommand('delete');assert_equals(h.textContent,'a  b');},'A nowrap longhand with preserved line breaks does not need a wrapping-only replacement');
test(t=>{const h=host(t,'a   ');getSelection().collapse(h.firstChild,3);document.execCommand('delete');assert_equals(h.textContent,'a  ');},'An intact trailing run needs no new soft break at the paragraph end');
</script>

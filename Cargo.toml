# Root workspace for the lightningpanda Rust rewrite of lightpanda-io/browser.
# JavaScript engine: system JavaScriptCore (no V8 anywhere in the tree;
# `scripts/check-no-v8.sh` enforces this against `cargo tree`).
[workspace]
resolver = "2"
members = ["crates/*"]
# Every crate (lp-render's Blitz lays pages out, so it is no longer optional).
default-members = [
    "crates/lightningpanda",
    "crates/lp-browser",
    "crates/lp-cdp",
    "crates/lp-cdp-protocol",
    "crates/lp-dom",
    "crates/lp-js",
    "crates/lp-layout",
    "crates/lp-jsc-sys",
    "crates/lp-net",
    "crates/lp-psl",
    "crates/lp-render",
    "crates/lp-runtime",
    "crates/lp-webapi",
]

[workspace.package]
version = "0.0.17"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/povio/lightningpanda"
rust-version = "1.85"

[workspace.dependencies]
lp-jsc-sys = { path = "crates/lp-jsc-sys" }
lp-js = { path = "crates/lp-js" }
lp-runtime = { path = "crates/lp-runtime" }
lp-browser = { path = "crates/lp-browser" }
lp-dom = { path = "crates/lp-dom" }
lp-net = { path = "crates/lp-net" }
lp-psl = { path = "crates/lp-psl" }
lp-webapi = { path = "crates/lp-webapi" }
lp-cdp-protocol = { path = "crates/lp-cdp-protocol" }
lp-cdp = { path = "crates/lp-cdp" }
lp-render = { path = "crates/lp-render" }
lp-layout = { path = "crates/lp-layout" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
# Cargo otherwise strips after our linker signs when DEBUG=0, losing allow-jit.
strip = "none"

# lp-webapi's ~170 interface classes are small modules that rustc merges
# into one codegen unit, together with every lp-js invoker they instantiate,
# so LLVM optimizes all of them on one core. More units for this crate let
# that codegen run in parallel; thin LTO still inlines across units.
# Measured clean release build (one member trampoline per member, before
# lp-js switched to one invoker per class): 128 s -> 69 s. lp-dom and lp-cdp
# are off the critical path and keep one unit: splitting them cost ~10% on
# the in-process CDP microbench for no wall-time gain.
[profile.release.package.lp-webapi]
codegen-units = 64

# Release build for local iteration (`cargo build --profile release-fast`,
# binary in target/release-fast). With lp-webapi already split, lp-cdp and
# lp-dom are the single-core tail of a clean release build; 16 units each
# cut it from ~70 s to ~48 s on an M1 Max. The cost is CDP round-trip
# latency: on cdp_microbench (5 alternating runs) Runtime.evaluate went
# 5.1 -> 5.5 us, evaluate handle + releaseObject 8.1 -> 9.1 us, small
# callFunctionOn 5.6 -> 5.8 us. Splitting only lp-dom gains ~5 s. Ship and
# benchmark with `release`.
[profile.release-fast]
inherits = "release"

[profile.release-fast.package.lp-webapi]
codegen-units = 64

[profile.release-fast.package.lp-cdp]
codegen-units = 16

[profile.release-fast.package.lp-dom]
codegen-units = 16

[profile.dev]
# Backtraces keep file:line; debuggers lose local variables. Cuts clean builds
# and target/ size; incremental rebuilds are unaffected.
debug = "line-tables-only"

# Generated public suffix list. At opt-level 2 LLVM spends ~16 s on its
# tables on one core; at -O0 it builds in ~3 s and the lookup cost in dev and
# tests is negligible. Every test binary and the main binary link against it,
# so it must not become the last job: today the lp-dom -> lp-cdp chain ends
# at about the same time, so a clean build gains ~1 s of wall time and ~13 s
# of CPU on an M1 Max.
[profile.dev.package.lp-psl]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
# Line tables keep backtraces readable; full debug info for dependencies is
# rarely stepped into and only slows codegen.
debug = "line-tables-only"

# The "*" override above also applies to proc macros and build-script deps
# (it outranks build-override), so syn, serde_derive and friends were being
# optimized on every clean build. Expansion is cheap; compile them at -O0.
# Cargo warns if one of these drops out of the dependency graph.
[profile.dev.package.proc-macro2]
opt-level = 0
[profile.dev.package.quote]
opt-level = 0
[profile.dev.package.syn]
opt-level = 0
[profile.dev.package.unicode-ident]
opt-level = 0
[profile.dev.package.synstructure]
opt-level = 0
[profile.dev.package.serde_derive]
opt-level = 0
[profile.dev.package.zerofrom-derive]
opt-level = 0
[profile.dev.package.yoke-derive]
opt-level = 0
[profile.dev.package.zerovec-derive]
opt-level = 0
[profile.dev.package.displaydoc]
opt-level = 0
[profile.dev.package.tokio-macros]
opt-level = 0
[profile.dev.package.derive_more-impl]
opt-level = 0
[profile.dev.package.phf_macros]
opt-level = 0
[profile.dev.package.phf_generator]
opt-level = 0
[profile.dev.package.cssparser-macros]
opt-level = 0
[profile.dev.package.rustversion]
opt-level = 0
[profile.dev.package.time-macros]
opt-level = 0
[profile.dev.package.multiversion_no_op]
opt-level = 0
[profile.dev.package.cc]
opt-level = 0
[profile.dev.package.shlex]
opt-level = 0
[profile.dev.package.find-msvc-tools]
opt-level = 0

# blitz-dom 0.3.0-beta.4 with one change (class atoms cached per element);
# see vendor/blitz-dom/README.lightningpanda.md.
[patch.crates-io]
blitz-dom = { path = "vendor/blitz-dom" }
blitz-paint = { path = "vendor/blitz-paint" }
# Flex fit-content clamp; see vendor/taffy/README.lightningpanda.md.
taffy = { path = "vendor/taffy" }
# Chromium's ascent for Times/Helvetica/Courier; see vendor/parley_engine/README.lightningpanda.md.
parley_engine = { path = "vendor/parley_engine" }
# Built layouts reused for identical text and styles; see vendor/parley/README.lightningpanda.md.
parley = { path = "vendor/parley" }
# Style sharing; see vendor/stylo/README.lightningpanda.md.
stylo = { path = "vendor/stylo" }
# ASCII hosts with invalid xn-- labels pass through; see vendor/idna/README.lightningpanda.md.
idna = { path = "vendor/idna" }

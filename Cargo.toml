# Root workspace for the pyro Rust rewrite of lightpanda-io/browser.
# JavaScript engine: system JavaScriptCore (no V8 anywhere in the tree;
# `scripts/check-no-v8.sh` enforces this against `cargo tree`).
[workspace]
resolver = "2"
members = ["crates/*"]
# Every crate (pyro-render's Blitz lays pages out, so it is no longer optional).
default-members = [
    "crates/pyro",
    "crates/pyro-browser",
    "crates/pyro-canvas",
    "crates/pyro-cdp",
    "crates/pyro-cdp-protocol",
    "crates/pyro-dom",
    "crates/pyro-js",
    "crates/pyro-layout",
    "crates/pyro-jsc-sys",
    "crates/pyro-media",
    "crates/pyro-net",
    "crates/pyro-psl",
    "crates/pyro-raster",
    "crates/pyro-render",
    "crates/pyro-runtime",
    "crates/pyro-webapi",
]

[workspace.package]
version = "0.0.17"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/povio/pyro"
rust-version = "1.85"

[workspace.dependencies]
pyro-jsc-sys = { path = "crates/pyro-jsc-sys" }
pyro-js = { path = "crates/pyro-js" }
pyro-runtime = { path = "crates/pyro-runtime" }
pyro-browser = { path = "crates/pyro-browser" }
pyro-dom = { path = "crates/pyro-dom" }
pyro-net = { path = "crates/pyro-net" }
pyro-psl = { path = "crates/pyro-psl" }
pyro-webapi = { path = "crates/pyro-webapi" }
pyro-cdp-protocol = { path = "crates/pyro-cdp-protocol" }
pyro-cdp = { path = "crates/pyro-cdp" }
pyro-render = { path = "crates/pyro-render" }
pyro-layout = { path = "crates/pyro-layout" }
pyro-canvas = { path = "crates/pyro-canvas" }
pyro-media = { path = "crates/pyro-media", default-features = false }
# `float_roundtrip`: a JSON number parses to the nearest double, so a double
# read back from JSON text (CDP params, the JSON.stringify text an `Pyro.run`
# eval reads) is the one that was written, as with Chrome. The default parser
# was one ulp off for about one random double in ten (0.9591810769706007
# came back as ...008). Costs ~10 ns per parsed double (cdp_microbench:
# 1,000 doubles through an Pyro.run eval, +9 us); integers and strings parse as
# before. Every crate takes serde_json from here.
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# `pyro_pgo_training` is set by scripts/pgo/generate.sh on the instrumented build only.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pyro_pgo_training)'] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
# Cargo otherwise strips after our linker signs when DEBUG=0, losing allow-jit.
strip = "none"

# pyro-webapi's ~170 interface classes are small modules that rustc merges
# into one codegen unit, together with every pyro-js invoker they instantiate,
# so LLVM optimizes all of them on one core. More units for this crate let
# that codegen run in parallel; thin LTO still inlines across units.
# Measured clean release build (one member trampoline per member, before
# pyro-js switched to one invoker per class): 128 s -> 69 s. pyro-dom and pyro-cdp
# are off the critical path and keep one unit: splitting them cost ~10% on
# the in-process CDP microbench for no wall-time gain.
[profile.release.package.pyro-webapi]
codegen-units = 64

# Release build for local iteration (`cargo build --profile release-fast`,
# binary in target/release-fast). With pyro-webapi already split, pyro-cdp and
# pyro-dom are the single-core tail of a clean release build; 16 units each
# cut it from ~70 s to ~48 s on an M1 Max. The cost is CDP round-trip
# latency: on cdp_microbench (5 alternating runs) Runtime.evaluate went
# 5.1 -> 5.5 us, evaluate handle + releaseObject 8.1 -> 9.1 us, small
# callFunctionOn 5.6 -> 5.8 us. Splitting only pyro-dom gains ~5 s. Ship and
# benchmark with `release`.
[profile.release-fast]
inherits = "release"

[profile.release-fast.package.pyro-webapi]
codegen-units = 64

[profile.release-fast.package.pyro-cdp]
codegen-units = 16

[profile.release-fast.package.pyro-dom]
codegen-units = 16

# Profile-guided release build (`scripts/pgo/`, binary in
# target/<host>/release-pgo). Same settings as `release`; the PGO flags come
# from RUSTFLAGS in those scripts, so a plain `cargo build --profile
# release-pgo` is just a release build in another directory. Not the default:
# it takes an instrumented build, a training run and a second build (with
# PYRO_PGO_LLVM two more JavaScriptCore builds), and a profile belongs to the
# sources it was trained on. Measured on the M1 Max against `release`
# (instructions per operation, binaries alternated): cdp-perf -9% with the
# Rust profile, -14% with JavaScriptCore's too (PYRO_PGO_LLVM), -17% with
# JavaScriptCore as ThinLTO (PYRO_PGO_LTO); README "Profile-guided
# optimization" has the rest. Fat LTO on top of PGO measured 0..+3% against
# plain `release` (it undoes most of the PGO gain), so the profile keeps thin
# LTO.
[profile.release-pgo]
inherits = "release"

[profile.release-pgo.package.pyro-webapi]
codegen-units = 64

# Tests at release speed without release link time (`cargo t`, see
# .cargo/config.toml). `release` runs thin LTO over the whole dependency graph
# for every test executable, with one codegen unit for most crates: rebuilding
# the workspace tests after touching pyro-dom took 90 CPU-minutes. Without LTO,
# with parallel codegen and incremental workspace crates, each executable is
# optimized like release but links without the cross-crate LTO pass. Ship and
# benchmark with `release`.
[profile.test-fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true

[profile.test-fast.package.pyro-webapi]
codegen-units = 64

# See [profile.dev.package.pyro-psl]: its generated tables cost ~16 s of
# single-core codegen when optimized, and lookups are negligible in tests.
[profile.test-fast.package.pyro-psl]
opt-level = 0

[profile.dev]
# Backtraces keep file:line; debuggers lose local variables. Cuts clean builds
# and target/ size; incremental rebuilds are unaffected.
debug = "line-tables-only"

# Generated public suffix list. At opt-level 2 LLVM spends ~16 s on its
# tables on one core; at -O0 it builds in ~3 s and the lookup cost in dev and
# tests is negligible. Every test binary and the main binary link against it,
# so it must not become the last job: today the pyro-dom -> pyro-cdp chain ends
# at about the same time, so a clean build gains ~1 s of wall time and ~13 s
# of CPU on an M1 Max.
[profile.dev.package.pyro-psl]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
# Line tables keep backtraces readable; full debug info for dependencies is
# rarely stepped into and only slows codegen.
debug = "line-tables-only"

# The "*" override above also applies to proc macros and build-script deps
# (it outranks build-override), so syn, serde_derive and friends were being
# optimized on every clean build. Expansion is cheap; compile them at -O0.
# Cargo warns if one of these drops out of the dependency graph.
[profile.dev.package.proc-macro2]
opt-level = 0
[profile.dev.package.quote]
opt-level = 0
[profile.dev.package.syn]
opt-level = 0
[profile.dev.package.unicode-ident]
opt-level = 0
[profile.dev.package.synstructure]
opt-level = 0
[profile.dev.package.serde_derive]
opt-level = 0
[profile.dev.package.zerofrom-derive]
opt-level = 0
[profile.dev.package.yoke-derive]
opt-level = 0
[profile.dev.package.zerovec-derive]
opt-level = 0
[profile.dev.package.displaydoc]
opt-level = 0
[profile.dev.package.tokio-macros]
opt-level = 0
[profile.dev.package.derive_more-impl]
opt-level = 0
[profile.dev.package.phf_macros]
opt-level = 0
[profile.dev.package.phf_generator]
opt-level = 0
[profile.dev.package.cssparser-macros]
opt-level = 0
[profile.dev.package.rustversion]
opt-level = 0
[profile.dev.package.multiversion_no_op]
opt-level = 0
[profile.dev.package.cc]
opt-level = 0
[profile.dev.package.shlex]
opt-level = 0
[profile.dev.package.find-msvc-tools]
opt-level = 0

# Blitz from upstream main (past 0.3.0-beta.4) with pyro's changes; see
# vendor/blitz-dom/README.pyro.md. blitz-traits and blitz-html are upstream main
# unchanged (blitz-dom main needs them); stylo_taffy is patched (its README.pyro.md).
[patch.crates-io]
blitz-dom = { path = "vendor/blitz-dom" }
blitz-paint = { path = "vendor/blitz-paint" }
blitz-traits = { path = "vendor/blitz-traits" }
blitz-html = { path = "vendor/blitz-html" }
stylo_taffy = { path = "vendor/stylo_taffy" }
# Taffy main with pyro's changes; see vendor/taffy/README.pyro.md.
taffy = { path = "vendor/taffy" }
# Chromium's ascent for Times/Helvetica/Courier; see vendor/parley_engine/README.pyro.md.
parley_engine = { path = "vendor/parley_engine" }
# Built layouts reused for identical text and styles; see vendor/parley/README.pyro.md.
parley = { path = "vendor/parley" }
# `@font-face` `unicode-range` in font matching; see vendor/fontique/README.pyro.md.
fontique = { path = "vendor/fontique" }
# A raster thread count per renderer; see vendor/anyrender_vello_cpu/README.pyro.md.
anyrender_vello_cpu = { path = "vendor/anyrender_vello_cpu" }
# Skia's rounding of 8-bit compositing; see vendor/vello_cpu/README.pyro.md.
vello_cpu = { path = "vendor/vello_cpu" }
# SVG patterns, masks and clip paths of any content; see vendor/anyrender_svg/README.pyro.md.
anyrender_svg = { path = "vendor/anyrender_svg" }
# Style sharing; see vendor/stylo/README.pyro.md.
stylo = { path = "vendor/stylo" }
# `:has()` and `:not()` on the featureless shadow host, `:host-context()`; see vendor/selectors/README.pyro.md.
selectors = { path = "vendor/selectors" }
# Sizes `:host-context()` selectors; see vendor/stylo_malloc_size_of/README.pyro.md.
stylo_malloc_size_of = { path = "vendor/stylo_malloc_size_of" }
# ASCII hosts with invalid xn-- labels pass through; see vendor/idna/README.pyro.md.
idna = { path = "vendor/idna" }
# WHATWG URL Standard fixes over url 2.5.8; see vendor/url/README.pyro.md.
url = { path = "vendor/url" }
# `<?target data>` in HTML is a processing instruction; see vendor/html5ever/README.pyro.md.
html5ever = { path = "vendor/html5ever" }
# AAC-LC up to 5.1 (channel configurations 3 to 6); see vendor/symphonia-codec-aac/README.pyro.md.
symphonia-codec-aac = { path = "vendor/symphonia-codec-aac" }
